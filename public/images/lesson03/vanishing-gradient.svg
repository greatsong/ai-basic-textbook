<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 320" font-family="'Pretendard Variable', Pretendard, -apple-system, sans-serif">
  <defs>
    <linearGradient id="vgBg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="720" height="320" rx="12" fill="url(#vgBg)"/>

  <!-- Title -->
  <text x="360" y="28" text-anchor="middle" fill="#e2e8f0" font-size="15" font-weight="600">기울기 소실 문제: Sigmoid vs ReLU</text>

  <!-- ═══ LEFT: Sigmoid ═══ -->
  <g transform="translate(30,50)">
    <text x="150" y="0" text-anchor="middle" fill="#6366f1" font-size="13" font-weight="600">Sigmoid (기울기 소실)</text>
    <text x="150" y="16" text-anchor="middle" fill="#64748b" font-size="10">최대 기울기 = 0.25 → 층마다 ×0.25</text>

    <!-- Layer labels -->
    <text x="30" y="238" text-anchor="middle" fill="#94a3b8" font-size="10">출력층</text>
    <text x="90" y="238" text-anchor="middle" fill="#94a3b8" font-size="10">5층</text>
    <text x="150" y="238" text-anchor="middle" fill="#94a3b8" font-size="10">4층</text>
    <text x="210" y="238" text-anchor="middle" fill="#94a3b8" font-size="10">3층</text>
    <text x="270" y="238" text-anchor="middle" fill="#94a3b8" font-size="10">2층</text>
    <text x="320" y="238" text-anchor="middle" fill="#94a3b8" font-size="10">입력층</text>

    <!-- Bars (gradient magnitude shrinking) -->
    <!-- Output: 1.0 = 200px -->
    <rect x="10" y="30" width="40" height="200" rx="4" fill="#6366f1" opacity="0.9"/>
    <text x="30" y="50" text-anchor="middle" fill="#fff" font-size="9" font-weight="600">1.0</text>

    <!-- Layer 5: 0.25 = 50px -->
    <rect x="70" y="180" width="40" height="50" rx="4" fill="#6366f1" opacity="0.75"/>
    <text x="90" y="175" text-anchor="middle" fill="#c4b5fd" font-size="9">0.25</text>

    <!-- Layer 4: 0.0625 = 12.5px -->
    <rect x="130" y="218" width="40" height="12" rx="3" fill="#6366f1" opacity="0.6"/>
    <text x="150" y="213" text-anchor="middle" fill="#c4b5fd" font-size="9">0.063</text>

    <!-- Layer 3: 0.016 = 3px -->
    <rect x="190" y="227" width="40" height="3" rx="1" fill="#6366f1" opacity="0.5"/>
    <text x="210" y="222" text-anchor="middle" fill="#c4b5fd" font-size="9">0.016</text>

    <!-- Layer 2: 0.004 = barely visible -->
    <rect x="250" y="229" width="40" height="1" rx="0.5" fill="#6366f1" opacity="0.4"/>
    <text x="270" y="222" text-anchor="middle" fill="#c4b5fd" font-size="9">0.004</text>

    <!-- Input layer indicator -->
    <text x="320" y="222" text-anchor="middle" fill="#ef4444" font-size="9" font-weight="600">≈ 0</text>
    <text x="320" y="180" text-anchor="middle" fill="#ef4444" font-size="8">학습</text>
    <text x="320" y="192" text-anchor="middle" fill="#ef4444" font-size="8">불가!</text>

    <!-- Arrow showing direction -->
    <line x1="40" y1="250" x2="310" y2="250" stroke="#64748b" stroke-width="1" marker-end="url(#arrowGray)"/>
    <text x="175" y="264" text-anchor="middle" fill="#64748b" font-size="9">← 오차가 전파되는 방향 (역전파)</text>

    <!-- Baseline -->
    <line x1="5" y1="230" x2="340" y2="230" stroke="rgba(71,85,105,0.3)" stroke-width="1"/>
  </g>

  <!-- ═══ RIGHT: ReLU ═══ -->
  <g transform="translate(390,50)">
    <text x="150" y="0" text-anchor="middle" fill="#10b981" font-size="13" font-weight="600">ReLU (기울기 유지)</text>
    <text x="150" y="16" text-anchor="middle" fill="#64748b" font-size="10">양수 영역 기울기 = 1 → 층마다 ×1</text>

    <!-- Layer labels -->
    <text x="30" y="238" text-anchor="middle" fill="#94a3b8" font-size="10">출력층</text>
    <text x="90" y="238" text-anchor="middle" fill="#94a3b8" font-size="10">5층</text>
    <text x="150" y="238" text-anchor="middle" fill="#94a3b8" font-size="10">4층</text>
    <text x="210" y="238" text-anchor="middle" fill="#94a3b8" font-size="10">3층</text>
    <text x="270" y="238" text-anchor="middle" fill="#94a3b8" font-size="10">2층</text>
    <text x="320" y="238" text-anchor="middle" fill="#94a3b8" font-size="10">입력층</text>

    <!-- Bars (gradient stays constant) -->
    <rect x="10" y="30" width="40" height="200" rx="4" fill="#10b981" opacity="0.9"/>
    <text x="30" y="50" text-anchor="middle" fill="#fff" font-size="9" font-weight="600">1.0</text>

    <rect x="70" y="30" width="40" height="200" rx="4" fill="#10b981" opacity="0.8"/>
    <text x="90" y="50" text-anchor="middle" fill="#fff" font-size="9" font-weight="600">1.0</text>

    <rect x="130" y="30" width="40" height="200" rx="4" fill="#10b981" opacity="0.7"/>
    <text x="150" y="50" text-anchor="middle" fill="#fff" font-size="9" font-weight="600">1.0</text>

    <rect x="190" y="30" width="40" height="200" rx="4" fill="#10b981" opacity="0.6"/>
    <text x="210" y="50" text-anchor="middle" fill="#fff" font-size="9" font-weight="600">1.0</text>

    <rect x="250" y="30" width="40" height="200" rx="4" fill="#10b981" opacity="0.5"/>
    <text x="270" y="50" text-anchor="middle" fill="#fff" font-size="9" font-weight="600">1.0</text>

    <!-- Input layer -->
    <text x="320" y="120" text-anchor="middle" fill="#10b981" font-size="9" font-weight="600">1.0</text>
    <text x="320" y="180" text-anchor="middle" fill="#10b981" font-size="8">학습</text>
    <text x="320" y="192" text-anchor="middle" fill="#10b981" font-size="8">정상!</text>

    <!-- Arrow -->
    <line x1="40" y1="250" x2="310" y2="250" stroke="#64748b" stroke-width="1"/>
    <text x="175" y="264" text-anchor="middle" fill="#64748b" font-size="9">← 오차가 전파되는 방향 (역전파)</text>

    <!-- Baseline -->
    <line x1="5" y1="230" x2="340" y2="230" stroke="rgba(71,85,105,0.3)" stroke-width="1"/>
  </g>

  <!-- Bottom insight -->
  <rect x="140" y="288" width="440" height="24" rx="6" fill="rgba(16,185,129,0.1)" stroke="rgba(16,185,129,0.3)" stroke-width="1"/>
  <text x="360" y="304" text-anchor="middle" fill="#6ee7b7" font-size="11" font-weight="500">ReLU 덕분에 층을 깊게 쌓을 수 있게 되었다 → 이것이 "딥"러닝의 시작</text>
</svg>