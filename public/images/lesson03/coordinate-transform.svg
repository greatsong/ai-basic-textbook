<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 300" font-family="'Pretendard Variable', Pretendard, -apple-system, sans-serif">
  <defs>
    <linearGradient id="ctBg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
  </defs>
  <rect width="720" height="300" rx="12" fill="url(#ctBg)"/>

  <!-- ═══ LEFT: Original (x₁, x₂) space ═══ -->
  <text x="155" y="24" text-anchor="middle" fill="#e2e8f0" font-size="13" font-weight="600">원래 공간 (x₁, x₂)</text>

  <g transform="translate(30,38)">
    <!-- Axes -->
    <line x1="40" y1="220" x2="260" y2="220" stroke="#334155" stroke-width="1"/>
    <line x1="40" y1="220" x2="40" y2="20" stroke="#334155" stroke-width="1"/>
    <text x="150" y="248" text-anchor="middle" fill="#64748b" font-size="11">x₁</text>
    <text x="18" y="120" text-anchor="middle" fill="#64748b" font-size="11" transform="rotate(-90,18,120)">x₂</text>

    <!-- Grid lines -->
    <line x1="40" y1="120" x2="260" y2="120" stroke="#1e293b" stroke-width="0.5"/>
    <line x1="150" y1="20" x2="150" y2="220" stroke="#1e293b" stroke-width="0.5"/>

    <!-- Axis labels -->
    <text x="40" y="236" text-anchor="middle" fill="#475569" font-size="9">0</text>
    <text x="150" y="236" text-anchor="middle" fill="#475569" font-size="9">0.5</text>
    <text x="260" y="236" text-anchor="middle" fill="#475569" font-size="9">1</text>
    <text x="30" y="224" text-anchor="middle" fill="#475569" font-size="9">0</text>
    <text x="30" y="124" text-anchor="middle" fill="#475569" font-size="9">0.5</text>
    <text x="30" y="24" text-anchor="middle" fill="#475569" font-size="9">1</text>

    <!-- Dashed line attempts (can't separate) -->
    <line x1="50" y1="30" x2="250" y2="210" stroke="#f59e0b" stroke-width="1.5" stroke-dasharray="6,4" opacity="0.4"/>
    <line x1="50" y1="210" x2="250" y2="30" stroke="#f59e0b" stroke-width="1.5" stroke-dasharray="6,4" opacity="0.4"/>

    <!-- Data points -->
    <!-- (0,0) = blue = 0 -->
    <circle cx="40" cy="220" r="12" fill="rgba(59,130,246,0.25)" stroke="#3b82f6" stroke-width="2"/>
    <text x="40" y="224" text-anchor="middle" fill="#3b82f6" font-size="12" font-weight="700">0</text>
    <text x="56" y="212" fill="#64748b" font-size="8">(0,0)</text>

    <!-- (0,1) = red = 1 -->
    <circle cx="40" cy="20" r="12" fill="rgba(239,68,68,0.25)" stroke="#ef4444" stroke-width="2"/>
    <text x="40" y="24" text-anchor="middle" fill="#ef4444" font-size="12" font-weight="700">1</text>
    <text x="56" y="16" fill="#64748b" font-size="8">(0,1)</text>

    <!-- (1,0) = red = 1 -->
    <circle cx="260" cy="220" r="12" fill="rgba(239,68,68,0.25)" stroke="#ef4444" stroke-width="2"/>
    <text x="260" y="224" text-anchor="middle" fill="#ef4444" font-size="12" font-weight="700">1</text>
    <text x="246" y="212" fill="#64748b" font-size="8" text-anchor="end">(1,0)</text>

    <!-- (1,1) = blue = 0 -->
    <circle cx="260" cy="20" r="12" fill="rgba(59,130,246,0.25)" stroke="#3b82f6" stroke-width="2"/>
    <text x="260" y="24" text-anchor="middle" fill="#3b82f6" font-size="12" font-weight="700">0</text>
    <text x="246" y="16" fill="#64748b" font-size="8" text-anchor="end">(1,1)</text>

    <!-- X mark -->
    <text x="150" y="130" text-anchor="middle" fill="#ef4444" font-size="16" font-weight="700" opacity="0.6">직선으로 분리 불가</text>
  </g>

  <!-- ═══ ARROW ═══ -->
  <g transform="translate(325,120)">
    <rect x="-35" y="-30" width="70" height="60" rx="8" fill="rgba(16,185,129,0.1)" stroke="rgba(16,185,129,0.3)" stroke-width="1"/>
    <text x="0" y="-10" text-anchor="middle" fill="#10b981" font-size="10" font-weight="600">은닉층</text>
    <text x="0" y="4" text-anchor="middle" fill="#10b981" font-size="10" font-weight="600">ReLU</text>
    <text x="0" y="18" text-anchor="middle" fill="#10b981" font-size="10" font-weight="600">변환</text>
    <!-- Arrow right -->
    <polygon points="40,0 30,-6 30,6" fill="#10b981" opacity="0.8"/>
  </g>

  <!-- ═══ RIGHT: Transformed (h₁, h₂) space ═══ -->
  <text x="555" y="24" text-anchor="middle" fill="#e2e8f0" font-size="13" font-weight="600">변환된 공간 (h₁, h₂)</text>

  <g transform="translate(400,38)">
    <!-- Axes -->
    <line x1="40" y1="220" x2="280" y2="220" stroke="#334155" stroke-width="1"/>
    <line x1="40" y1="220" x2="40" y2="20" stroke="#334155" stroke-width="1"/>
    <text x="160" y="248" text-anchor="middle" fill="#64748b" font-size="11">h₁ = ReLU(x₁ − x₂)</text>
    <text x="18" y="120" text-anchor="middle" fill="#64748b" font-size="11" transform="rotate(-90,18,120)">h₂ = ReLU(x₂ − x₁)</text>

    <!-- Axis labels -->
    <text x="40" y="236" text-anchor="middle" fill="#475569" font-size="9">0</text>
    <text x="280" y="236" text-anchor="middle" fill="#475569" font-size="9">1</text>
    <text x="30" y="224" text-anchor="middle" fill="#475569" font-size="9">0</text>
    <text x="30" y="24" text-anchor="middle" fill="#475569" font-size="9">1</text>

    <!-- Separation line: h₁ + h₂ = 0.5 -->
    <!-- h₂ = 0.5 - h₁, so (0, 0.5) to (0.5, 0) in data coords -->
    <!-- In SVG: (40, 120) to (160, 220) -->
    <line x1="40" y1="120" x2="160" y2="220" stroke="#10b981" stroke-width="2.5" opacity="0.8"/>

    <!-- Shaded region (red side: h₁+h₂ > 0.5) -->
    <path d="M160,220 L280,220 L280,20 L40,20 L40,120 Z" fill="rgba(239,68,68,0.06)"/>

    <!-- Data points in transformed space -->
    <!-- (0,0) and (1,1) both → (0, 0) = blue -->
    <circle cx="40" cy="220" r="14" fill="rgba(59,130,246,0.25)" stroke="#3b82f6" stroke-width="2.5"/>
    <text x="40" y="224" text-anchor="middle" fill="#3b82f6" font-size="11" font-weight="700">0</text>
    <text x="60" y="208" fill="#64748b" font-size="8">(0,0)←두 점</text>

    <!-- (0,1) → (0, 1) = red -->
    <circle cx="40" cy="20" r="12" fill="rgba(239,68,68,0.25)" stroke="#ef4444" stroke-width="2"/>
    <text x="40" y="24" text-anchor="middle" fill="#ef4444" font-size="12" font-weight="700">1</text>
    <text x="58" y="16" fill="#64748b" font-size="8">(0,1)</text>

    <!-- (1,0) → (1, 0) = red -->
    <circle cx="280" cy="220" r="12" fill="rgba(239,68,68,0.25)" stroke="#ef4444" stroke-width="2"/>
    <text x="280" y="224" text-anchor="middle" fill="#ef4444" font-size="12" font-weight="700">1</text>
    <text x="264" y="210" fill="#64748b" font-size="8" text-anchor="end">(1,0)</text>

    <!-- Checkmark -->
    <text x="200" y="100" text-anchor="middle" fill="#10b981" font-size="14" font-weight="700">직선으로 분리 가능!</text>

    <!-- Line label -->
    <text x="110" y="185" text-anchor="middle" fill="#10b981" font-size="9" transform="rotate(-40,110,185)">h₁+h₂ = 0.5</text>
  </g>

  <!-- Bottom caption -->
  <text x="360" y="290" text-anchor="middle" fill="#64748b" font-size="10">활성화함수(ReLU)가 좌표를 변환하면, 원래 불가능했던 분류가 가능해집니다</text>
</svg>