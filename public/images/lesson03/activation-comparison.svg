<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500">
  <style>@import url("https://fonts.googleapis.com/css2?family=Nanum+Gothic:wght@400;700&amp;display=swap");</style>
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FAFBFF"/>
      <stop offset="100%" stop-color="#F0F4FF"/>
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="1" dy="2" stdDeviation="3" flood-opacity="0.1"/>
    </filter>
  </defs>
  <rect width="900" height="500" fill="url(#bgGrad)" rx="12"/>
  <text x="450" y="38" text-anchor="middle" font-family="'Nanum Gothic', 'Apple SD Gothic Neo', sans-serif" font-size="22" font-weight="bold" fill="#1E293B">활성화함수 비교: Step vs Sigmoid vs ReLU</text>

  <!-- Step Function -->
  <g transform="translate(30, 60)" filter="url(#shadow)">
    <rect width="260" height="380" fill="white" rx="12" stroke="#E0E7FF" stroke-width="1.5"/>
    <rect width="260" height="44" fill="#4F46E5" rx="12 12 0 0"/>
    <text x="130" y="30" text-anchor="middle" font-family="'Nanum Gothic', 'Apple SD Gothic Neo', sans-serif" font-size="16" font-weight="bold" fill="white">계단 함수 (Step)</text>
    <!-- Graph area -->
    <rect x="30" y="60" width="200" height="140" fill="#FAFBFF" rx="6" stroke="#E0E7FF"/>
    <!-- Axes -->
    <line x1="50" y1="190" x2="220" y2="190" stroke="#94A3B8" stroke-width="1.5"/>
    <line x1="130" y1="70" x2="130" y2="195" stroke="#94A3B8" stroke-width="1.5"/>
    <text x="225" y="194" font-family="'Nanum Gothic', 'Apple SD Gothic Neo', sans-serif" font-size="11" fill="#94A3B8">x</text>
    <text x="133" y="68" font-family="'Nanum Gothic', 'Apple SD Gothic Neo', sans-serif" font-size="11" fill="#94A3B8">y</text>
    <!-- Step curve -->
    <polyline points="50,180 130,180 130,90 220,90" fill="none" stroke="#EF4444" stroke-width="3" stroke-linecap="round"/>
    <circle cx="130" cy="180" r="4" fill="white" stroke="#EF4444" stroke-width="2"/>
    <circle cx="130" cy="90" r="4" fill="#EF4444"/>
    <!-- Labels -->
    <text x="80" y="175" font-family="'Nanum Gothic', 'Apple SD Gothic Neo', sans-serif" font-size="11" fill="#475569">0</text>
    <text x="170" y="85" font-family="'Nanum Gothic', 'Apple SD Gothic Neo', sans-serif" font-size="11" fill="#475569">1</text>
    <!-- Info -->
    <text x="130" y="225" text-anchor="middle" font-family="'Nanum Gothic', 'Apple SD Gothic Neo', sans-serif" font-size="13" font-weight="bold" fill="#EF4444">0 또는 1</text>
    <text x="130" y="248" text-anchor="middle" font-family="'Nanum Gothic', 'Apple SD Gothic Neo', sans-serif" font-size="12" fill="#475569">미분 불가능</text>
    <text x="130" y="270" text-anchor="middle" font-family="'Nanum Gothic', 'Apple SD Gothic Neo', sans-serif" font-size="12" fill="#475569">딱딱하게 끊김</text>
    <rect x="40" y="290" width="180" height="36" fill="#FEE2E2" rx="8"/>
    <text x="130" y="313" text-anchor="middle" font-family="'Nanum Gothic', 'Apple SD Gothic Neo', sans-serif" font-size="12" font-weight="bold" fill="#EF4444">역전파 학습 불가</text>
    <text x="130" y="352" text-anchor="middle" font-family="'Nanum Gothic', 'Apple SD Gothic Neo', sans-serif" font-size="11" fill="#94A3B8">1958 퍼셉트론</text>
  </g>

  <!-- Sigmoid -->
  <g transform="translate(320, 60)" filter="url(#shadow)">
    <rect width="260" height="380" fill="white" rx="12" stroke="#E0E7FF" stroke-width="1.5"/>
    <rect width="260" height="44" fill="#F59E0B" rx="12 12 0 0"/>
    <text x="130" y="30" text-anchor="middle" font-family="'Nanum Gothic', 'Apple SD Gothic Neo', sans-serif" font-size="16" font-weight="bold" fill="white">시그모이드 (Sigmoid)</text>
    <rect x="30" y="60" width="200" height="140" fill="#FAFBFF" rx="6" stroke="#E0E7FF"/>
    <line x1="50" y1="190" x2="220" y2="190" stroke="#94A3B8" stroke-width="1.5"/>
    <line x1="130" y1="70" x2="130" y2="195" stroke="#94A3B8" stroke-width="1.5"/>
    <text x="225" y="194" font-family="'Nanum Gothic', 'Apple SD Gothic Neo', sans-serif" font-size="11" fill="#94A3B8">x</text>
    <text x="133" y="68" font-family="'Nanum Gothic', 'Apple SD Gothic Neo', sans-serif" font-size="11" fill="#94A3B8">y</text>
    <!-- Sigmoid curve (S shape) -->
    <path d="M50,178 C70,178 90,176 110,165 C120,155 125,140 130,130 C135,120 140,105 150,95 C170,84 190,82 220,82" fill="none" stroke="#F59E0B" stroke-width="3" stroke-linecap="round"/>
    <text x="80" y="175" font-family="'Nanum Gothic', 'Apple SD Gothic Neo', sans-serif" font-size="11" fill="#475569">0</text>
    <text x="170" y="78" font-family="'Nanum Gothic', 'Apple SD Gothic Neo', sans-serif" font-size="11" fill="#475569">1</text>
    <text x="130" y="225" text-anchor="middle" font-family="'Nanum Gothic', 'Apple SD Gothic Neo', sans-serif" font-size="13" font-weight="bold" fill="#F59E0B">0 ~ 1 (부드러운 S)</text>
    <text x="130" y="248" text-anchor="middle" font-family="'Nanum Gothic', 'Apple SD Gothic Neo', sans-serif" font-size="12" fill="#475569">미분 가능!</text>
    <text x="130" y="270" text-anchor="middle" font-family="'Nanum Gothic', 'Apple SD Gothic Neo', sans-serif" font-size="12" fill="#475569">기울기 최대 0.25</text>
    <rect x="40" y="290" width="180" height="36" fill="#FEF3C7" rx="8"/>
    <text x="130" y="313" text-anchor="middle" font-family="'Nanum Gothic', 'Apple SD Gothic Neo', sans-serif" font-size="12" font-weight="bold" fill="#F59E0B">기울기 소실 문제!</text>
    <text x="130" y="352" text-anchor="middle" font-family="'Nanum Gothic', 'Apple SD Gothic Neo', sans-serif" font-size="11" fill="#94A3B8">1986 역전파</text>
  </g>

  <!-- ReLU -->
  <g transform="translate(610, 60)" filter="url(#shadow)">
    <rect width="260" height="380" fill="white" rx="12" stroke="#E0E7FF" stroke-width="1.5"/>
    <rect width="260" height="44" fill="#10B981" rx="12 12 0 0"/>
    <text x="130" y="30" text-anchor="middle" font-family="'Nanum Gothic', 'Apple SD Gothic Neo', sans-serif" font-size="16" font-weight="bold" fill="white">ReLU</text>
    <rect x="30" y="60" width="200" height="140" fill="#FAFBFF" rx="6" stroke="#E0E7FF"/>
    <line x1="50" y1="190" x2="220" y2="190" stroke="#94A3B8" stroke-width="1.5"/>
    <line x1="130" y1="70" x2="130" y2="195" stroke="#94A3B8" stroke-width="1.5"/>
    <text x="225" y="194" font-family="'Nanum Gothic', 'Apple SD Gothic Neo', sans-serif" font-size="11" fill="#94A3B8">x</text>
    <text x="133" y="68" font-family="'Nanum Gothic', 'Apple SD Gothic Neo', sans-serif" font-size="11" fill="#94A3B8">y</text>
    <!-- ReLU curve -->
    <polyline points="50,190 130,190 210,100" fill="none" stroke="#10B981" stroke-width="3" stroke-linecap="round"/>
    <text x="80" y="183" font-family="'Nanum Gothic', 'Apple SD Gothic Neo', sans-serif" font-size="11" fill="#475569">0</text>
    <text x="130" y="225" text-anchor="middle" font-family="'Nanum Gothic', 'Apple SD Gothic Neo', sans-serif" font-size="13" font-weight="bold" fill="#10B981">max(0, x)</text>
    <text x="130" y="248" text-anchor="middle" font-family="'Nanum Gothic', 'Apple SD Gothic Neo', sans-serif" font-size="12" fill="#475569">미분 가능!</text>
    <text x="130" y="270" text-anchor="middle" font-family="'Nanum Gothic', 'Apple SD Gothic Neo', sans-serif" font-size="12" fill="#475569">양수 구간 기울기 = 1</text>
    <rect x="40" y="290" width="180" height="36" fill="#D1FAE5" rx="8"/>
    <text x="130" y="313" text-anchor="middle" font-family="'Nanum Gothic', 'Apple SD Gothic Neo', sans-serif" font-size="12" font-weight="bold" fill="#10B981">딥러닝의 핵심!</text>
    <text x="130" y="352" text-anchor="middle" font-family="'Nanum Gothic', 'Apple SD Gothic Neo', sans-serif" font-size="11" fill="#94A3B8">2012 AlexNet</text>
  </g>

  <!-- Evolution arrows -->
  <g transform="translate(0, 470)">
    <line x1="160" y1="0" x2="440" y2="0" stroke="#818CF8" stroke-width="2" marker-end="url(#arrow)"/>
    <line x1="580" y1="0" x2="730" y2="0" stroke="#818CF8" stroke-width="2" marker-end="url(#arrow)"/>
    <text x="300" y="-8" text-anchor="middle" font-family="'Nanum Gothic', 'Apple SD Gothic Neo', sans-serif" font-size="11" fill="#818CF8">미분 가능하게!</text>
    <text x="660" y="-8" text-anchor="middle" font-family="'Nanum Gothic', 'Apple SD Gothic Neo', sans-serif" font-size="11" fill="#818CF8">기울기 소실 해결!</text>
  </g>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6" fill="#818CF8"/>
    </marker>
  </defs>
</svg>