<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 480">
  <style>@import url("https://fonts.googleapis.com/css2?family=Nanum+Gothic:wght@400;700&amp;display=swap");</style>
  <defs>
    <linearGradient id="bgG" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FAFBFF"/>
      <stop offset="100%" stop-color="#F0F4FF"/>
    </linearGradient>
    <filter id="sh" x="-3%" y="-3%" width="106%" height="110%">
      <feDropShadow dx="1" dy="2" stdDeviation="2" flood-opacity="0.08"/>
    </filter>
    <marker id="fwdArr" markerWidth="10" markerHeight="8" refX="10" refY="4" orient="auto">
      <path d="M0,0 L10,4 L0,8" fill="#4F46E5"/>
    </marker>
    <marker id="bwdArr" markerWidth="10" markerHeight="8" refX="0" refY="4" orient="auto">
      <path d="M10,0 L0,4 L10,8" fill="#EF4444"/>
    </marker>
  </defs>
  <rect width="900" height="480" fill="url(#bgG)" rx="12"/>

  <!-- Title -->
  <text x="450" y="36" text-anchor="middle" font-family="'Nanum Gothic', 'Apple SD Gothic Neo', sans-serif" font-size="22" font-weight="bold" fill="#1E293B">역전파(Backpropagation) 흐름도</text>

  <!-- Forward pass label -->
  <rect x="30" y="55" width="140" height="28" fill="#4F46E5" rx="14"/>
  <text x="100" y="74" text-anchor="middle" font-family="'Nanum Gothic', 'Apple SD Gothic Neo', sans-serif" font-size="13" font-weight="bold" fill="white">순전파 (Forward)</text>

  <!-- Backward pass label -->
  <rect x="30" y="88" width="140" height="28" fill="#EF4444" rx="14"/>
  <text x="100" y="107" text-anchor="middle" font-family="'Nanum Gothic', 'Apple SD Gothic Neo', sans-serif" font-size="13" font-weight="bold" fill="white">역전파 (Backward)</text>

  <!-- Input Layer -->
  <g transform="translate(60, 160)" filter="url(#sh)">
    <rect width="120" height="200" fill="white" rx="12" stroke="#818CF8" stroke-width="2"/>
    <rect width="120" height="36" fill="#818CF8" rx="12 12 0 0"/>
    <text x="60" y="24" text-anchor="middle" font-family="'Nanum Gothic', 'Apple SD Gothic Neo', sans-serif" font-size="14" font-weight="bold" fill="white">입력층</text>
    <circle cx="60" cy="80" r="20" fill="#E0E7FF" stroke="#4F46E5" stroke-width="2"/>
    <text x="60" y="85" text-anchor="middle" font-family="'Nanum Gothic', 'Apple SD Gothic Neo', sans-serif" font-size="13" font-weight="bold" fill="#4F46E5">x1</text>
    <circle cx="60" cy="140" r="20" fill="#E0E7FF" stroke="#4F46E5" stroke-width="2"/>
    <text x="60" y="145" text-anchor="middle" font-family="'Nanum Gothic', 'Apple SD Gothic Neo', sans-serif" font-size="13" font-weight="bold" fill="#4F46E5">x2</text>
  </g>

  <!-- Hidden Layer 1 -->
  <g transform="translate(270, 140)" filter="url(#sh)">
    <rect width="120" height="240" fill="white" rx="12" stroke="#4F46E5" stroke-width="2"/>
    <rect width="120" height="36" fill="#4F46E5" rx="12 12 0 0"/>
    <text x="60" y="24" text-anchor="middle" font-family="'Nanum Gothic', 'Apple SD Gothic Neo', sans-serif" font-size="14" font-weight="bold" fill="white">은닉층 1</text>
    <circle cx="60" cy="70" r="20" fill="#E0E7FF" stroke="#4F46E5" stroke-width="2"/>
    <text x="60" y="75" text-anchor="middle" font-family="'Nanum Gothic', 'Apple SD Gothic Neo', sans-serif" font-size="12" font-weight="bold" fill="#4F46E5">h1</text>
    <circle cx="60" cy="130" r="20" fill="#E0E7FF" stroke="#4F46E5" stroke-width="2"/>
    <text x="60" y="135" text-anchor="middle" font-family="'Nanum Gothic', 'Apple SD Gothic Neo', sans-serif" font-size="12" font-weight="bold" fill="#4F46E5">h2</text>
    <circle cx="60" cy="190" r="20" fill="#E0E7FF" stroke="#4F46E5" stroke-width="2"/>
    <text x="60" y="195" text-anchor="middle" font-family="'Nanum Gothic', 'Apple SD Gothic Neo', sans-serif" font-size="12" font-weight="bold" fill="#4F46E5">h3</text>
    <text x="60" y="228" text-anchor="middle" font-family="'Nanum Gothic', 'Apple SD Gothic Neo', sans-serif" font-size="10" fill="#818CF8">+ReLU</text>
  </g>

  <!-- Hidden Layer 2 -->
  <g transform="translate(480, 170)" filter="url(#sh)">
    <rect width="120" height="180" fill="white" rx="12" stroke="#4F46E5" stroke-width="2"/>
    <rect width="120" height="36" fill="#4F46E5" rx="12 12 0 0"/>
    <text x="60" y="24" text-anchor="middle" font-family="'Nanum Gothic', 'Apple SD Gothic Neo', sans-serif" font-size="14" font-weight="bold" fill="white">은닉층 2</text>
    <circle cx="60" cy="75" r="20" fill="#E0E7FF" stroke="#4F46E5" stroke-width="2"/>
    <text x="60" y="80" text-anchor="middle" font-family="'Nanum Gothic', 'Apple SD Gothic Neo', sans-serif" font-size="12" font-weight="bold" fill="#4F46E5">h4</text>
    <circle cx="60" cy="135" r="20" fill="#E0E7FF" stroke="#4F46E5" stroke-width="2"/>
    <text x="60" y="140" text-anchor="middle" font-family="'Nanum Gothic', 'Apple SD Gothic Neo', sans-serif" font-size="12" font-weight="bold" fill="#4F46E5">h5</text>
    <text x="60" y="168" text-anchor="middle" font-family="'Nanum Gothic', 'Apple SD Gothic Neo', sans-serif" font-size="10" fill="#818CF8">+ReLU</text>
  </g>

  <!-- Output Layer -->
  <g transform="translate(690, 210)" filter="url(#sh)">
    <rect width="120" height="120" fill="white" rx="12" stroke="#10B981" stroke-width="2"/>
    <rect width="120" height="36" fill="#10B981" rx="12 12 0 0"/>
    <text x="60" y="24" text-anchor="middle" font-family="'Nanum Gothic', 'Apple SD Gothic Neo', sans-serif" font-size="14" font-weight="bold" fill="white">출력층</text>
    <circle cx="60" cy="75" r="22" fill="#D1FAE5" stroke="#10B981" stroke-width="2"/>
    <text x="60" y="80" text-anchor="middle" font-family="'Nanum Gothic', 'Apple SD Gothic Neo', sans-serif" font-size="13" font-weight="bold" fill="#10B981">y</text>
  </g>

  <!-- Forward arrows (blue, top) -->
  <line x1="180" y1="235" x2="268" y2="215" stroke="#4F46E5" stroke-width="2" marker-end="url(#fwdArr)"/>
  <line x1="180" y1="245" x2="268" y2="265" stroke="#4F46E5" stroke-width="2" marker-end="url(#fwdArr)"/>
  <line x1="180" y1="300" x2="268" y2="275" stroke="#4F46E5" stroke-width="2" marker-end="url(#fwdArr)"/>
  <line x1="180" y1="310" x2="268" y2="330" stroke="#4F46E5" stroke-width="2" marker-end="url(#fwdArr)"/>

  <line x1="390" y1="210" x2="478" y2="245" stroke="#4F46E5" stroke-width="2" marker-end="url(#fwdArr)"/>
  <line x1="390" y1="270" x2="478" y2="260" stroke="#4F46E5" stroke-width="2" marker-end="url(#fwdArr)"/>
  <line x1="390" y1="330" x2="478" y2="305" stroke="#4F46E5" stroke-width="2" marker-end="url(#fwdArr)"/>

  <line x1="600" y1="248" x2="688" y2="280" stroke="#4F46E5" stroke-width="2" marker-end="url(#fwdArr)"/>
  <line x1="600" y1="305" x2="688" y2="288" stroke="#4F46E5" stroke-width="2" marker-end="url(#fwdArr)"/>

  <!-- Backward arrows (red, bottom, dashed) -->
  <line x1="690" y1="300" x2="605" y2="262" stroke="#EF4444" stroke-width="2.5" stroke-dasharray="6,3" marker-end="url(#bwdArr)"/>
  <line x1="690" y1="300" x2="605" y2="318" stroke="#EF4444" stroke-width="2.5" stroke-dasharray="6,3" marker-end="url(#bwdArr)"/>

  <line x1="483" y1="258" x2="395" y2="222" stroke="#EF4444" stroke-width="2.5" stroke-dasharray="6,3" marker-end="url(#bwdArr)"/>
  <line x1="483" y1="280" x2="395" y2="282" stroke="#EF4444" stroke-width="2.5" stroke-dasharray="6,3" marker-end="url(#bwdArr)"/>
  <line x1="483" y1="315" x2="395" y2="340" stroke="#EF4444" stroke-width="2.5" stroke-dasharray="6,3" marker-end="url(#bwdArr)"/>

  <!-- Error box -->
  <g transform="translate(825, 260)">
    <rect x="-25" y="-25" width="80" height="50" fill="#FEE2E2" rx="10" stroke="#EF4444" stroke-width="1.5"/>
    <text x="15" y="-5" text-anchor="middle" font-family="'Nanum Gothic', 'Apple SD Gothic Neo', sans-serif" font-size="11" font-weight="bold" fill="#EF4444">오차</text>
    <text x="15" y="12" text-anchor="middle" font-family="'Nanum Gothic', 'Apple SD Gothic Neo', sans-serif" font-size="10" fill="#EF4444">(Loss)</text>
  </g>

  <!-- Bottom labels -->
  <g transform="translate(0, 420)">
    <rect x="50" y="0" width="800" height="50" fill="#E0E7FF" rx="10"/>
    <text x="160" y="20" text-anchor="middle" font-family="'Nanum Gothic', 'Apple SD Gothic Neo', sans-serif" font-size="13" font-weight="bold" fill="#4F46E5">순전파:</text>
    <text x="310" y="20" text-anchor="middle" font-family="'Nanum Gothic', 'Apple SD Gothic Neo', sans-serif" font-size="12" fill="#475569">입력 데이터가 앞으로 흐르며 예측값 생성</text>
    <text x="560" y="20" text-anchor="middle" font-family="'Nanum Gothic', 'Apple SD Gothic Neo', sans-serif" font-size="13" font-weight="bold" fill="#EF4444">역전파:</text>
    <text x="730" y="20" text-anchor="middle" font-family="'Nanum Gothic', 'Apple SD Gothic Neo', sans-serif" font-size="12" fill="#475569">오차가 뒤로 흐르며 가중치 수정</text>
    <text x="450" y="42" text-anchor="middle" font-family="'Nanum Gothic', 'Apple SD Gothic Neo', sans-serif" font-size="12" font-weight="bold" fill="#3730A3">각 가중치의 "책임 비율"을 계산하여 정확히 수정합니다</text>
  </g>
</svg>