<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 550">
  <style>@import url("https://fonts.googleapis.com/css2?family=Nanum+Gothic:wght@400;700&amp;display=swap");</style>
  <defs>
    <filter id="shadow" x="-5%" y="-5%" width="115%" height="115%">
      <feDropShadow dx="1" dy="2" stdDeviation="3" flood-color="#000" flood-opacity="0.08"/>
    </filter>
    <linearGradient id="centerGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4F46E5;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#818CF8;stop-opacity:1"/>
    </linearGradient>
  </defs>
  <!-- Background -->
  <rect width="900" height="550" rx="16" fill="#FAFBFF"/>
  <!-- Title -->
  <text x="450" y="40" text-anchor="middle" font-family="'Nanum Gothic', 'Apple SD Gothic Neo', sans-serif" font-size="22" font-weight="bold" fill="#1E293B">AI가 활용되는 8개 분야</text>
  <!-- Center circle -->
  <circle cx="450" cy="290" r="60" fill="url(#centerGrad)" filter="url(#shadow)"/>
  <text x="450" y="285" text-anchor="middle" font-family="'Nanum Gothic', 'Apple SD Gothic Neo', sans-serif" font-size="20" font-weight="bold" fill="#fff">AI</text>
  <text x="450" y="308" text-anchor="middle" font-family="'Nanum Gothic', 'Apple SD Gothic Neo', sans-serif" font-size="14" fill="#C7D2FE">인공지능</text>

  <!-- 8 fields arranged in octagon -->
  <!-- 1. 의료 (top) -->
  <line x1="450" y1="230" x2="450" y2="120" stroke="#C7D2FE" stroke-width="2" stroke-dasharray="4,3"/>
  <rect x="385" y="60" width="130" height="56" rx="12" fill="#E0E7FF" filter="url(#shadow)"/>
  <text x="415" y="85" font-family="'Nanum Gothic', 'Apple SD Gothic Neo', sans-serif" font-size="22" fill="#4F46E5">+</text>
  <text x="437" y="85" font-family="'Nanum Gothic', 'Apple SD Gothic Neo', sans-serif" font-size="15" font-weight="bold" fill="#4F46E5">의료</text>
  <text x="450" y="104" text-anchor="middle" font-family="'Nanum Gothic', 'Apple SD Gothic Neo', sans-serif" font-size="11" fill="#475569">X-ray 판독, 신약 탐색</text>

  <!-- 2. 법률 (top-right) -->
  <line x1="492" y1="248" x2="590" y2="140" stroke="#C7D2FE" stroke-width="2" stroke-dasharray="4,3"/>
  <rect x="560" y="80" width="130" height="56" rx="12" fill="#D1FAE5" filter="url(#shadow)"/>
  <text x="590" y="105" font-family="'Nanum Gothic', 'Apple SD Gothic Neo', sans-serif" font-size="22" fill="#10B981">S</text>
  <text x="612" y="105" font-family="'Nanum Gothic', 'Apple SD Gothic Neo', sans-serif" font-size="15" font-weight="bold" fill="#10B981">법률</text>
  <text x="625" y="124" text-anchor="middle" font-family="'Nanum Gothic', 'Apple SD Gothic Neo', sans-serif" font-size="11" fill="#475569">판례 검색, 계약서 분석</text>

  <!-- 3. 공학 (right) -->
  <line x1="510" y1="290" x2="630" y2="290" stroke="#C7D2FE" stroke-width="2" stroke-dasharray="4,3"/>
  <rect x="635" y="260" width="130" height="56" rx="12" fill="#D1FAE5" filter="url(#shadow)"/>
  <text x="665" y="285" font-family="'Nanum Gothic', 'Apple SD Gothic Neo', sans-serif" font-size="22" fill="#10B981">G</text>
  <text x="687" y="285" font-family="'Nanum Gothic', 'Apple SD Gothic Neo', sans-serif" font-size="15" font-weight="bold" fill="#10B981">공학</text>
  <text x="700" y="304" text-anchor="middle" font-family="'Nanum Gothic', 'Apple SD Gothic Neo', sans-serif" font-size="11" fill="#475569">자율주행, 로봇 제어</text>

  <!-- 4. 미디어 (bottom-right) -->
  <line x1="492" y1="332" x2="590" y2="420" stroke="#C7D2FE" stroke-width="2" stroke-dasharray="4,3"/>
  <rect x="560" y="400" width="130" height="56" rx="12" fill="#FEF3C7" filter="url(#shadow)"/>
  <text x="590" y="425" font-family="'Nanum Gothic', 'Apple SD Gothic Neo', sans-serif" font-size="22" fill="#F59E0B">M</text>
  <text x="612" y="425" font-family="'Nanum Gothic', 'Apple SD Gothic Neo', sans-serif" font-size="15" font-weight="bold" fill="#F59E0B">미디어</text>
  <text x="625" y="444" text-anchor="middle" font-family="'Nanum Gothic', 'Apple SD Gothic Neo', sans-serif" font-size="11" fill="#475569">자동 번역, 추천 시스템</text>

  <!-- 5. 경영 (bottom) -->
  <line x1="450" y1="350" x2="450" y2="440" stroke="#C7D2FE" stroke-width="2" stroke-dasharray="4,3"/>
  <rect x="385" y="445" width="130" height="56" rx="12" fill="#EDE9FE" filter="url(#shadow)"/>
  <text x="415" y="470" font-family="'Nanum Gothic', 'Apple SD Gothic Neo', sans-serif" font-size="22" fill="#8B5CF6">B</text>
  <text x="437" y="470" font-family="'Nanum Gothic', 'Apple SD Gothic Neo', sans-serif" font-size="15" font-weight="bold" fill="#8B5CF6">경영</text>
  <text x="450" y="489" text-anchor="middle" font-family="'Nanum Gothic', 'Apple SD Gothic Neo', sans-serif" font-size="11" fill="#475569">수요 예측, 행동 분석</text>

  <!-- 6. 교육 (bottom-left) -->
  <line x1="408" y1="332" x2="310" y2="420" stroke="#C7D2FE" stroke-width="2" stroke-dasharray="4,3"/>
  <rect x="210" y="400" width="130" height="56" rx="12" fill="#FEF3C7" filter="url(#shadow)"/>
  <text x="240" y="425" font-family="'Nanum Gothic', 'Apple SD Gothic Neo', sans-serif" font-size="22" fill="#F59E0B">E</text>
  <text x="262" y="425" font-family="'Nanum Gothic', 'Apple SD Gothic Neo', sans-serif" font-size="15" font-weight="bold" fill="#F59E0B">교육</text>
  <text x="275" y="444" text-anchor="middle" font-family="'Nanum Gothic', 'Apple SD Gothic Neo', sans-serif" font-size="11" fill="#475569">맞춤 학습, 자동 채점</text>

  <!-- 7. 예술 (left) -->
  <line x1="390" y1="290" x2="270" y2="290" stroke="#C7D2FE" stroke-width="2" stroke-dasharray="4,3"/>
  <rect x="135" y="260" width="130" height="56" rx="12" fill="#EDE9FE" filter="url(#shadow)"/>
  <text x="165" y="285" font-family="'Nanum Gothic', 'Apple SD Gothic Neo', sans-serif" font-size="22" fill="#8B5CF6">A</text>
  <text x="187" y="285" font-family="'Nanum Gothic', 'Apple SD Gothic Neo', sans-serif" font-size="15" font-weight="bold" fill="#8B5CF6">예술</text>
  <text x="200" y="304" text-anchor="middle" font-family="'Nanum Gothic', 'Apple SD Gothic Neo', sans-serif" font-size="11" fill="#475569">AI 작곡, 이미지 생성</text>

  <!-- 8. 과학 (top-left) -->
  <line x1="408" y1="248" x2="310" y2="140" stroke="#C7D2FE" stroke-width="2" stroke-dasharray="4,3"/>
  <rect x="210" y="80" width="130" height="56" rx="12" fill="#E0E7FF" filter="url(#shadow)"/>
  <text x="240" y="105" font-family="'Nanum Gothic', 'Apple SD Gothic Neo', sans-serif" font-size="22" fill="#4F46E5">R</text>
  <text x="262" y="105" font-family="'Nanum Gothic', 'Apple SD Gothic Neo', sans-serif" font-size="15" font-weight="bold" fill="#4F46E5">과학</text>
  <text x="275" y="124" text-anchor="middle" font-family="'Nanum Gothic', 'Apple SD Gothic Neo', sans-serif" font-size="11" fill="#475569">단백질 예측, 기후 모델</text>

  <!-- Bottom note -->
  <text x="450" y="536" text-anchor="middle" font-family="'Nanum Gothic', 'Apple SD Gothic Neo', sans-serif" font-size="13" fill="#94A3B8">AI는 특정 분야가 아닌 모든 분야에 스며들고 있습니다</text>
</svg>