<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500">
  <style>@import url("https://fonts.googleapis.com/css2?family=Nanum+Gothic:wght@400;700&amp;display=swap");</style>
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#F8FAFC"/>
      <stop offset="100%" stop-color="#E2E8F0"/>
    </linearGradient>
    <linearGradient id="curveGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#3B82F6"/>
      <stop offset="100%" stop-color="#8B5CF6"/>
    </linearGradient>
    <marker id="arrowRed" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#EF4444"/>
    </marker>
    <marker id="arrowGreen" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#10B981"/>
    </marker>
    <filter id="shadow">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-opacity="0.1"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="500" fill="url(#bgGrad)" rx="12"/>

  <!-- Title -->
  <text x="400" y="42" text-anchor="middle" font-family="'Nanum Gothic', 'Apple SD Gothic Neo', sans-serif" font-size="22" font-weight="bold" fill="#1E293B">왜 기울기의 반대 방향으로 이동하는가?</text>

  <!-- Axes -->
  <line x1="90" y1="400" x2="760" y2="400" stroke="#CBD5E1" stroke-width="2"/>
  <line x1="90" y1="60" x2="90" y2="400" stroke="#CBD5E1" stroke-width="2"/>

  <!-- Y-axis label -->
  <text x="55" y="230" text-anchor="middle" font-family="'Nanum Gothic', 'Apple SD Gothic Neo', sans-serif" font-size="16" font-weight="bold" fill="#64748B" transform="rotate(-90 55 230)">손실 (Loss)</text>

  <!-- Loss curve (U-shape valley: high → low → high) -->
  <path d="M 100,100 Q 160,105 200,140 Q 260,190 300,260 Q 340,330 380,360 Q 420,380 440,385 Q 460,380 500,360 Q 540,330 580,270 Q 620,200 680,130 Q 720,100 760,90"
        fill="none" stroke="url(#curveGrad)" stroke-width="4" stroke-linecap="round"/>

  <!-- Minimum point (at the bottom of the valley) -->
  <circle cx="440" cy="387" r="8" fill="#10B981" stroke="#FFF" stroke-width="2"/>
  <text x="440" y="415" text-anchor="middle" font-family="'Nanum Gothic', 'Apple SD Gothic Neo', sans-serif" font-size="13" font-weight="bold" fill="#10B981">최솟값</text>

  <!-- Current position dot (on the LEFT slope, partway down) -->
  <circle cx="260" cy="190" r="12" fill="#F59E0B" stroke="#FFF" stroke-width="3" filter="url(#shadow)"/>
  <text x="260" y="170" text-anchor="middle" font-family="'Nanum Gothic', 'Apple SD Gothic Neo', sans-serif" font-size="14" font-weight="bold" fill="#F59E0B">현재 위치</text>

  <!-- Gradient arrow (pointing LEFT+UP = steepest ascent = loss increases most) -->
  <line x1="250" y1="185" x2="180" y2="135" stroke="#EF4444" stroke-width="4" marker-end="url(#arrowRed)"/>
  <rect x="85" y="90" width="145" height="52" rx="8" fill="#FEE2E2" stroke="#EF4444" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="157" y="111" text-anchor="middle" font-family="'Nanum Gothic', 'Apple SD Gothic Neo', sans-serif" font-size="13" font-weight="bold" fill="#EF4444">기울기 방향</text>
  <text x="157" y="131" text-anchor="middle" font-family="'Nanum Gothic', 'Apple SD Gothic Neo', sans-serif" font-size="11" fill="#DC2626">(손실이 가장 빠르게 증가)</text>

  <!-- Movement arrow (pointing RIGHT+DOWN = opposite of gradient = toward minimum) -->
  <line x1="272" y1="196" x2="360" y2="310" stroke="#10B981" stroke-width="4" marker-end="url(#arrowGreen)"/>
  <rect x="370" y="260" width="175" height="52" rx="8" fill="#D1FAE5" stroke="#10B981" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="457" y="281" text-anchor="middle" font-family="'Nanum Gothic', 'Apple SD Gothic Neo', sans-serif" font-size="13" font-weight="bold" fill="#10B981">이동 방향 (반대!)</text>
  <text x="457" y="301" text-anchor="middle" font-family="'Nanum Gothic', 'Apple SD Gothic Neo', sans-serif" font-size="11" fill="#059669">(손실이 줄어드는 방향)</text>

  <!-- Dashed path showing the descent trajectory -->
  <path d="M 270,195 Q 320,280 370,340 Q 410,370 440,385" fill="none" stroke="#10B981" stroke-width="2" stroke-dasharray="6,4" opacity="0.4"/>

  <!-- Bottom explanation boxes -->
  <rect x="50" y="435" width="220" height="55" rx="8" fill="#FEF3C7" stroke="#F59E0B" stroke-width="1.5"/>
  <text x="160" y="458" text-anchor="middle" font-family="'Nanum Gothic', 'Apple SD Gothic Neo', sans-serif" font-size="13" font-weight="bold" fill="#92400E">기울기가 음수(-) 이면</text>
  <text x="160" y="478" text-anchor="middle" font-family="'Nanum Gothic', 'Apple SD Gothic Neo', sans-serif" font-size="12" fill="#92400E">오른쪽(+)으로 이동 = 반대</text>

  <rect x="290" y="435" width="220" height="55" rx="8" fill="#FEE2E2" stroke="#EF4444" stroke-width="1.5"/>
  <text x="400" y="458" text-anchor="middle" font-family="'Nanum Gothic', 'Apple SD Gothic Neo', sans-serif" font-size="13" font-weight="bold" fill="#991B1B">기울기가 양수(+) 이면</text>
  <text x="400" y="478" text-anchor="middle" font-family="'Nanum Gothic', 'Apple SD Gothic Neo', sans-serif" font-size="12" fill="#991B1B">왼쪽(-)으로 이동 = 반대</text>

  <rect x="530" y="435" width="220" height="55" rx="8" fill="#D1FAE5" stroke="#10B981" stroke-width="1.5"/>
  <text x="640" y="458" text-anchor="middle" font-family="'Nanum Gothic', 'Apple SD Gothic Neo', sans-serif" font-size="13" font-weight="bold" fill="#065F46">결론</text>
  <text x="640" y="478" text-anchor="middle" font-family="'Nanum Gothic', 'Apple SD Gothic Neo', sans-serif" font-size="12" fill="#065F46">항상 반대 = 항상 손실 감소!</text>
</svg>