<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 300" font-family="'Nanum Gothic', 'Apple SD Gothic Neo', sans-serif">
  <style>@import url("https://fonts.googleapis.com/css2?family=Nanum+Gothic:wght@400;700&amp;display=swap");</style>
  <rect width="800" height="300" rx="16" fill="#1a1b26" opacity="0.95"/>

  <text x="400" y="30" text-anchor="middle" fill="#e2e8f0" font-size="18" font-weight="700">학습률(Learning Rate)에 따른 차이</text>

  <!-- Panel 1: Too Small -->
  <rect x="20" y="50" width="240" height="240" rx="12" fill="rgba(239,68,68,0.08)" stroke="#ef4444" stroke-width="1" stroke-opacity="0.3"/>
  <text x="140" y="75" text-anchor="middle" fill="#fca5a5" font-size="14" font-weight="600">너무 작음 (0.001)</text>

  <!-- U-shaped valley 1 -->
  <path d="M 50,90 Q 70,95 85,110 Q 100,130 115,160 Q 130,195 140,220 Q 145,230 150,232" stroke="#475569" stroke-width="1.5" fill="none"/>
  <path d="M 150,232 Q 155,230 160,220 Q 170,195 185,160 Q 200,130 215,110 Q 230,95 250,90" stroke="#475569" stroke-width="1.5" fill="none"/>

  <!-- Ball positions - tiny steps near the top-left of valley -->
  <circle cx="75" cy="100" r="5" fill="#ef4444"/>
  <circle cx="80" cy="105" r="4" fill="#ef4444" opacity="0.8"/>
  <circle cx="85" cy="110" r="4" fill="#ef4444" opacity="0.6"/>
  <circle cx="89" cy="115" r="3" fill="#ef4444" opacity="0.4"/>
  <line x1="75" y1="100" x2="89" y2="115" stroke="#ef4444" stroke-width="1.5" stroke-dasharray="3,2" opacity="0.5"/>

  <text x="140" y="260" text-anchor="middle" fill="#ef4444" font-size="11" font-weight="600">수렴이 너무 느림!</text>
  <text x="140" y="276" text-anchor="middle" fill="#94a3b8" font-size="10">최소점까지 도달 못 함</text>

  <!-- Panel 2: Just Right -->
  <rect x="280" y="50" width="240" height="240" rx="12" fill="rgba(16,185,129,0.08)" stroke="#10b981" stroke-width="1.5" stroke-opacity="0.5"/>
  <text x="400" y="75" text-anchor="middle" fill="#6ee7b7" font-size="14" font-weight="600">적당함 (0.1)</text>

  <!-- U-shaped valley 2 -->
  <path d="M 310,90 Q 330,95 345,110 Q 360,130 375,160 Q 390,195 400,220 Q 405,230 410,232" stroke="#475569" stroke-width="1.5" fill="none"/>
  <path d="M 410,232 Q 415,230 420,220 Q 430,195 445,160 Q 460,130 475,110 Q 490,95 510,90" stroke="#475569" stroke-width="1.5" fill="none"/>

  <!-- Ball positions - smooth descent to minimum -->
  <circle cx="335" cy="100" r="5" fill="#10b981"/>
  <line x1="335" y1="100" x2="360" y2="132" stroke="#10b981" stroke-width="1.5" opacity="0.6"/>
  <circle cx="360" cy="132" r="4.5" fill="#10b981" opacity="0.85"/>
  <line x1="360" y1="132" x2="380" y2="175" stroke="#10b981" stroke-width="1.5" opacity="0.5"/>
  <circle cx="380" cy="175" r="4" fill="#10b981" opacity="0.7"/>
  <line x1="380" y1="175" x2="398" y2="215" stroke="#10b981" stroke-width="1.5" opacity="0.4"/>
  <circle cx="398" cy="215" r="3.5" fill="#10b981" opacity="0.6"/>

  <!-- Star at minimum -->
  <circle cx="410" cy="232" r="6" fill="#10b981" opacity="0.3"/>
  <text x="410" y="240" text-anchor="middle" fill="#6ee7b7" font-size="16">&#x2605;</text>

  <text x="400" y="260" text-anchor="middle" fill="#10b981" font-size="11" font-weight="600">안정적으로 수렴!</text>
  <text x="400" y="276" text-anchor="middle" fill="#94a3b8" font-size="10">최적의 학습 속도</text>

  <!-- Panel 3: Too Large -->
  <rect x="540" y="50" width="240" height="240" rx="12" fill="rgba(245,158,11,0.08)" stroke="#f59e0b" stroke-width="1" stroke-opacity="0.3"/>
  <text x="660" y="75" text-anchor="middle" fill="#fcd34d" font-size="14" font-weight="600">너무 큼 (2.0)</text>

  <!-- U-shaped valley 3 -->
  <path d="M 570,90 Q 590,95 605,110 Q 620,130 635,160 Q 650,195 660,220 Q 665,230 670,232" stroke="#475569" stroke-width="1.5" fill="none"/>
  <path d="M 670,232 Q 675,230 680,220 Q 690,195 705,160 Q 720,130 735,110 Q 750,95 770,90" stroke="#475569" stroke-width="1.5" fill="none"/>

  <!-- Ball positions - oscillating across the valley -->
  <circle cx="600" cy="118" r="5" fill="#f59e0b"/>
  <line x1="600" y1="118" x2="730" y2="108" stroke="#f59e0b" stroke-width="1.5" stroke-dasharray="4,3" opacity="0.5"/>
  <circle cx="730" cy="108" r="5" fill="#f59e0b" opacity="0.8"/>
  <line x1="730" y1="108" x2="585" y2="100" stroke="#f59e0b" stroke-width="1.5" stroke-dasharray="4,3" opacity="0.4"/>
  <circle cx="585" cy="100" r="5" fill="#f59e0b" opacity="0.6"/>
  <line x1="585" y1="100" x2="750" y2="92" stroke="#f59e0b" stroke-width="1.5" stroke-dasharray="4,3" opacity="0.3"/>

  <text x="660" y="260" text-anchor="middle" fill="#f59e0b" font-size="11" font-weight="600">발산! 점점 벌어짐</text>
  <text x="660" y="276" text-anchor="middle" fill="#94a3b8" font-size="10">최소점을 뛰어넘음</text>
</svg>