<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500">
  <style>@import url("https://fonts.googleapis.com/css2?family=Nanum+Gothic:wght@400;700&amp;display=swap");</style>
  <defs>
    <linearGradient id="bg2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#F8FAFC"/>
      <stop offset="100%" stop-color="#E2E8F0"/>
    </linearGradient>
    <filter id="sh2">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-opacity="0.12"/>
    </filter>
    <marker id="moveArrow" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#3B82F6"/>
    </marker>
  </defs>

  <rect width="800" height="500" fill="url(#bg2)" rx="12"/>

  <!-- Title -->
  <text x="400" y="32" text-anchor="middle" font-family="'Nanum Gothic', 'Apple SD Gothic Neo', sans-serif" font-size="20" font-weight="bold" fill="#1E293B">모멘텀의 직관: 공이 언덕을 넘을 수 있을까?</text>

  <!-- ===== LEFT SIDE: No momentum ===== -->
  <rect x="55" y="50" width="240" height="28" rx="6" fill="#FEE2E2" stroke="#EF4444" stroke-width="1.5"/>
  <text x="175" y="69" text-anchor="middle" font-family="'Nanum Gothic', 'Apple SD Gothic Neo', sans-serif" font-size="14" font-weight="bold" fill="#EF4444">모멘텀 = 0 (관성 없음)</text>

  <!-- Terrain with two valleys: shallow (local) and deep (global) -->
  <!-- Left terrain: ball stuck in shallow valley -->
  <path d="M 30,150 Q 60,130 90,170 Q 120,210 155,195 Q 175,185 195,195 Q 215,205 235,175 Q 260,130 290,100 Q 320,130 350,180 Q 370,220 380,280"
        fill="none" stroke="#94A3B8" stroke-width="4" stroke-linecap="round"/>
  <!-- Fill under terrain -->
  <path d="M 30,150 Q 60,130 90,170 Q 120,210 155,195 Q 175,185 195,195 Q 215,205 235,175 Q 260,130 290,100 Q 320,130 350,180 Q 370,220 380,280 L 380,300 L 30,300 Z"
        fill="#F1F5F9" opacity="0.6"/>

  <!-- Ball stuck in local minimum (shallow valley) -->
  <circle cx="175" cy="180" r="12" fill="#EF4444" stroke="#FFF" stroke-width="2.5"/>
  <line x1="169" y1="174" x2="181" y2="186" stroke="#FFF" stroke-width="2.5"/>
  <line x1="181" y1="174" x2="169" y2="186" stroke="#FFF" stroke-width="2.5"/>

  <!-- Labels for left terrain -->
  <rect x="115" y="90" width="120" height="26" rx="6" fill="#FEE2E2" stroke="#EF4444" stroke-width="1"/>
  <text x="175" y="108" text-anchor="middle" font-family="'Nanum Gothic', 'Apple SD Gothic Neo', sans-serif" font-size="11" font-weight="bold" fill="#EF4444">여기서 멈춤!</text>
  <line x1="175" y1="116" x2="175" y2="168" stroke="#EF4444" stroke-width="1.5" stroke-dasharray="4,3"/>

  <!-- Local minimum label -->
  <text x="175" y="230" text-anchor="middle" font-family="'Nanum Gothic', 'Apple SD Gothic Neo', sans-serif" font-size="11" fill="#F59E0B" font-weight="bold">로컬 미니마</text>
  <text x="175" y="245" text-anchor="middle" font-family="'Nanum Gothic', 'Apple SD Gothic Neo', sans-serif" font-size="10" fill="#F59E0B">(얕은 골짜기)</text>

  <!-- Global minimum label (unreachable) -->
  <text x="340" y="270" text-anchor="middle" font-family="'Nanum Gothic', 'Apple SD Gothic Neo', sans-serif" font-size="11" fill="#94A3B8">글로벌 미니마</text>
  <text x="340" y="283" text-anchor="middle" font-family="'Nanum Gothic', 'Apple SD Gothic Neo', sans-serif" font-size="10" fill="#94A3B8">(도달 못 함)</text>

  <!-- Hill between two valleys -->
  <text x="260" y="92" text-anchor="middle" font-family="'Nanum Gothic', 'Apple SD Gothic Neo', sans-serif" font-size="10" fill="#94A3B8">언덕</text>
  <line x1="260" y1="96" x2="260" y2="118" stroke="#CBD5E1" stroke-width="1" stroke-dasharray="3,2"/>

  <!-- ===== RIGHT SIDE: With momentum ===== -->
  <rect x="470" y="50" width="240" height="28" rx="6" fill="#D1FAE5" stroke="#10B981" stroke-width="1.5"/>
  <text x="590" y="69" text-anchor="middle" font-family="'Nanum Gothic', 'Apple SD Gothic Neo', sans-serif" font-size="14" font-weight="bold" fill="#10B981">모멘텀 > 0 (관성 있음)</text>

  <!-- Same terrain shape -->
  <path d="M 420,150 Q 450,130 480,170 Q 510,210 545,195 Q 565,185 585,195 Q 605,205 625,175 Q 650,130 680,100 Q 710,130 740,180 Q 760,220 770,280"
        fill="none" stroke="#94A3B8" stroke-width="4" stroke-linecap="round"/>
  <path d="M 420,150 Q 450,130 480,170 Q 510,210 545,195 Q 565,185 585,195 Q 605,205 625,175 Q 650,130 680,100 Q 710,130 740,180 Q 760,220 770,280 L 770,300 L 420,300 Z"
        fill="#F1F5F9" opacity="0.6"/>

  <!-- Ball trajectory: passing through local min and over the hill -->
  <!-- Ghost ball at local min (passed through) -->
  <circle cx="565" cy="183" r="8" fill="#10B981" opacity="0.2" stroke="#10B981" stroke-width="1" stroke-dasharray="2,2"/>

  <!-- Ghost ball going up hill -->
  <circle cx="620" cy="165" r="8" fill="#10B981" opacity="0.35"/>

  <!-- Ghost ball at hill top -->
  <circle cx="655" cy="125" r="9" fill="#10B981" opacity="0.5"/>

  <!-- Ball arriving at global minimum! -->
  <circle cx="740" cy="178" r="12" fill="#10B981" stroke="#FFF" stroke-width="2.5"/>
  <text x="740" y="183" text-anchor="middle" font-family="'Nanum Gothic', 'Apple SD Gothic Neo', sans-serif" font-size="10" fill="white" font-weight="bold">!</text>

  <!-- Momentum arrow over the hill -->
  <path d="M 575,175 Q 620,100 665,115" fill="none" stroke="#3B82F6" stroke-width="2.5" marker-end="url(#moveArrow)" stroke-dasharray="6,3"/>

  <!-- Success label -->
  <rect x="485" y="90" width="210" height="26" rx="6" fill="#D1FAE5" stroke="#10B981" stroke-width="1"/>
  <text x="590" y="108" text-anchor="middle" font-family="'Nanum Gothic', 'Apple SD Gothic Neo', sans-serif" font-size="11" font-weight="bold" fill="#10B981">관성으로 언덕을 넘어간다!</text>

  <!-- Local minimum label -->
  <text x="565" y="230" text-anchor="middle" font-family="'Nanum Gothic', 'Apple SD Gothic Neo', sans-serif" font-size="11" fill="#F59E0B" font-weight="bold">로컬 미니마</text>
  <text x="565" y="245" text-anchor="middle" font-family="'Nanum Gothic', 'Apple SD Gothic Neo', sans-serif" font-size="10" fill="#F59E0B">(지나침!)</text>

  <!-- Global minimum label -->
  <rect x="695" y="255" width="100" height="35" rx="6" fill="#D1FAE5" stroke="#10B981" stroke-width="1.5"/>
  <text x="745" y="272" text-anchor="middle" font-family="'Nanum Gothic', 'Apple SD Gothic Neo', sans-serif" font-size="11" fill="#065F46" font-weight="bold">글로벌 미니마</text>
  <text x="745" y="285" text-anchor="middle" font-family="'Nanum Gothic', 'Apple SD Gothic Neo', sans-serif" font-size="10" fill="#065F46">(도달 성공!)</text>

  <!-- Hill label -->
  <text x="650" y="92" text-anchor="middle" font-family="'Nanum Gothic', 'Apple SD Gothic Neo', sans-serif" font-size="10" fill="#94A3B8">언덕</text>
  <line x1="650" y1="96" x2="650" y2="118" stroke="#CBD5E1" stroke-width="1" stroke-dasharray="3,2"/>

  <!-- ===== BOTTOM: Comparison boxes ===== -->
  <rect x="30" y="320" width="370" height="160" rx="12" fill="#FEF2F2" stroke="#EF4444" stroke-width="1.5" filter="url(#sh2)"/>
  <text x="215" y="348" text-anchor="middle" font-family="'Nanum Gothic', 'Apple SD Gothic Neo', sans-serif" font-size="15" font-weight="bold" fill="#EF4444">모멘텀 없이 (일반 경사하강법)</text>
  <line x1="80" y1="358" x2="350" y2="358" stroke="#FECACA" stroke-width="1"/>
  <text x="215" y="382" text-anchor="middle" font-family="'Nanum Gothic', 'Apple SD Gothic Neo', sans-serif" font-size="12" fill="#64748B">현재 기울기만 보고 한 걸음 이동</text>
  <text x="215" y="402" text-anchor="middle" font-family="'Nanum Gothic', 'Apple SD Gothic Neo', sans-serif" font-size="12" fill="#64748B">주변이 모두 오르막이면 → 멈춤</text>
  <text x="215" y="428" text-anchor="middle" font-family="'Nanum Gothic', 'Apple SD Gothic Neo', sans-serif" font-size="13" fill="#64748B">얕은 골짜기를 벗어나지 못하고</text>
  <text x="215" y="450" text-anchor="middle" font-family="'Nanum Gothic', 'Apple SD Gothic Neo', sans-serif" font-size="15" font-weight="bold" fill="#EF4444">가짜 바닥에서 멈춤 😫</text>

  <rect x="420" y="320" width="370" height="160" rx="12" fill="#ECFDF5" stroke="#10B981" stroke-width="1.5" filter="url(#sh2)"/>
  <text x="605" y="348" text-anchor="middle" font-family="'Nanum Gothic', 'Apple SD Gothic Neo', sans-serif" font-size="15" font-weight="bold" fill="#10B981">모멘텀 있을 때</text>
  <line x1="470" y1="358" x2="740" y2="358" stroke="#A7F3D0" stroke-width="1"/>
  <text x="605" y="382" text-anchor="middle" font-family="'Nanum Gothic', 'Apple SD Gothic Neo', sans-serif" font-size="12" fill="#64748B">이전 방향의 관성을 기억하며 이동</text>
  <text x="605" y="402" text-anchor="middle" font-family="'Nanum Gothic', 'Apple SD Gothic Neo', sans-serif" font-size="12" fill="#64748B">오르막을 만나도 → 관성으로 넘어감</text>
  <text x="605" y="428" text-anchor="middle" font-family="'Nanum Gothic', 'Apple SD Gothic Neo', sans-serif" font-size="13" fill="#64748B">얕은 골짜기를 통과하여</text>
  <text x="605" y="450" text-anchor="middle" font-family="'Nanum Gothic', 'Apple SD Gothic Neo', sans-serif" font-size="15" font-weight="bold" fill="#10B981">진짜 바닥까지 도달! 🎉</text>
</svg>