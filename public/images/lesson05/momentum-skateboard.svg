<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500">
  <style>@import url("https://fonts.googleapis.com/css2?family=Nanum+Gothic:wght@400;700&amp;display=swap");</style>
  <defs>
    <linearGradient id="bg2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#F8FAFC"/>
      <stop offset="100%" stop-color="#E2E8F0"/>
    </linearGradient>
    <filter id="sh2">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-opacity="0.12"/>
    </filter>
    <marker id="moveArrow" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#3B82F6"/>
    </marker>
  </defs>

  <rect width="800" height="500" fill="url(#bg2)" rx="12"/>

  <!-- Title -->
  <text x="400" y="32" text-anchor="middle" font-family="'Nanum Gothic', 'Apple SD Gothic Neo', sans-serif" font-size="20" font-weight="bold" fill="#1E293B">모멘텀의 직관: 스케이트보드와 반파이프</text>

  <!-- ===== LEFT SIDE: No momentum ===== -->
  <!-- Section label -->
  <rect x="80" y="48" width="230" height="28" rx="6" fill="#FEE2E2" stroke="#EF4444" stroke-width="1"/>
  <text x="195" y="67" text-anchor="middle" font-family="'Nanum Gothic', 'Apple SD Gothic Neo', sans-serif" font-size="14" font-weight="bold" fill="#EF4444">모멘텀 = 0 (관성 없음)</text>

  <!-- U-shaped half-pipe left (pushed down, smaller) -->
  <path d="M 55,310 Q 55,230 90,190 Q 130,150 195,140 Q 260,150 300,190 Q 335,230 335,310" fill="none" stroke="#94A3B8" stroke-width="5" stroke-linecap="round"/>
  <line x1="55" y1="310" x2="335" y2="310" stroke="#CBD5E1" stroke-width="2"/>

  <!-- Ball stuck at top of pipe -->
  <circle cx="195" cy="136" r="10" fill="#EF4444" stroke="#FFF" stroke-width="2"/>
  <line x1="189" y1="130" x2="201" y2="142" stroke="#FFF" stroke-width="2"/>
  <line x1="201" y1="130" x2="189" y2="142" stroke="#FFF" stroke-width="2"/>

  <!-- Stuck label with arrow -->
  <rect x="110" y="90" width="170" height="28" rx="6" fill="#FEE2E2" stroke="#EF4444" stroke-width="1.5"/>
  <text x="195" y="109" text-anchor="middle" font-family="'Nanum Gothic', 'Apple SD Gothic Neo', sans-serif" font-size="12" font-weight="bold" fill="#EF4444">여기서 멈춤! (갇힘)</text>
  <line x1="195" y1="118" x2="195" y2="126" stroke="#EF4444" stroke-width="1.5"/>
  <polygon points="190,126 200,126 195,132" fill="#EF4444"/>

  <!-- Local minimum bump -->
  <path d="M 140,200 Q 160,220 175,210 Q 190,200 195,195 Q 200,200 215,210 Q 230,220 250,200" fill="none" stroke="#F59E0B" stroke-width="2" stroke-dasharray="4,3"/>
  <text x="195" y="245" text-anchor="middle" font-family="'Nanum Gothic', 'Apple SD Gothic Neo', sans-serif" font-size="12" fill="#F59E0B" font-weight="bold">로컬 미니마</text>

  <!-- ===== RIGHT SIDE: With momentum ===== -->
  <!-- Section label -->
  <rect x="490" y="48" width="230" height="28" rx="6" fill="#D1FAE5" stroke="#10B981" stroke-width="1"/>
  <text x="605" y="67" text-anchor="middle" font-family="'Nanum Gothic', 'Apple SD Gothic Neo', sans-serif" font-size="14" font-weight="bold" fill="#10B981">모멘텀 > 0 (관성 있음)</text>

  <!-- U-shaped half-pipe right -->
  <path d="M 455,310 Q 455,230 490,190 Q 530,150 595,140 Q 660,150 700,190 Q 735,230 735,310" fill="none" stroke="#94A3B8" stroke-width="5" stroke-linecap="round"/>
  <line x1="455" y1="310" x2="735" y2="310" stroke="#CBD5E1" stroke-width="2"/>

  <!-- Ball rolling with momentum -->
  <circle cx="560" cy="170" r="10" fill="#10B981" stroke="#FFF" stroke-width="2"/>

  <!-- Motion trail -->
  <circle cx="520" cy="190" r="5" fill="#10B981" opacity="0.25"/>
  <circle cx="540" cy="180" r="7" fill="#10B981" opacity="0.45"/>

  <!-- Arrow showing momentum -->
  <line x1="565" y1="165" x2="630" y2="130" stroke="#3B82F6" stroke-width="3" marker-end="url(#moveArrow)"/>

  <!-- Success label -->
  <rect x="510" y="90" width="190" height="28" rx="6" fill="#D1FAE5" stroke="#10B981" stroke-width="1.5"/>
  <text x="605" y="109" text-anchor="middle" font-family="'Nanum Gothic', 'Apple SD Gothic Neo', sans-serif" font-size="12" font-weight="bold" fill="#10B981">관성으로 로컬 미니마를 넘어감!</text>
  <line x1="580" y1="118" x2="565" y2="160" stroke="#10B981" stroke-width="1.5" stroke-dasharray="3,2"/>

  <!-- Local minimum bump -->
  <path d="M 540,200 Q 560,220 575,210 Q 590,200 595,195 Q 600,200 615,210 Q 630,220 650,200" fill="none" stroke="#F59E0B" stroke-width="2" stroke-dasharray="4,3"/>
  <text x="595" y="245" text-anchor="middle" font-family="'Nanum Gothic', 'Apple SD Gothic Neo', sans-serif" font-size="12" fill="#F59E0B" font-weight="bold">로컬 미니마</text>

  <!-- Global minimum marker -->
  <circle cx="690" cy="200" r="9" fill="#3B82F6" stroke="#FFF" stroke-width="2"/>
  <text x="690" y="204" text-anchor="middle" font-family="'Nanum Gothic', 'Apple SD Gothic Neo', sans-serif" font-size="8" fill="white" font-weight="bold">G</text>
  <text x="690" y="225" text-anchor="middle" font-family="'Nanum Gothic', 'Apple SD Gothic Neo', sans-serif" font-size="11" fill="#3B82F6" font-weight="bold">글로벌 미니마</text>

  <!-- ===== BOTTOM: Comparison boxes ===== -->
  <rect x="30" y="335" width="360" height="145" rx="10" fill="#FEF2F2" stroke="#EF4444" stroke-width="1.5" filter="url(#sh2)"/>
  <text x="210" y="362" text-anchor="middle" font-family="'Nanum Gothic', 'Apple SD Gothic Neo', sans-serif" font-size="15" font-weight="bold" fill="#EF4444">모멘텀 없이 (일반 경사하강법)</text>
  <line x1="110" y1="372" x2="310" y2="372" stroke="#FECACA" stroke-width="1"/>
  <text x="210" y="395" text-anchor="middle" font-family="'Nanum Gothic', 'Apple SD Gothic Neo', sans-serif" font-size="12" fill="#64748B">현재 기울기만 보고 이동</text>
  <text x="210" y="415" text-anchor="middle" font-family="'Nanum Gothic', 'Apple SD Gothic Neo', sans-serif" font-size="12" fill="#64748B">작은 언덕(로컬 미니마)에 갇히기 쉬움</text>
  <text x="210" y="445" text-anchor="middle" font-family="'Nanum Gothic', 'Apple SD Gothic Neo', sans-serif" font-size="14" font-weight="bold" fill="#EF4444">결과: 가짜 바닥에서 멈춤</text>
  <text x="210" y="468" text-anchor="middle" font-family="'Nanum Gothic', 'Apple SD Gothic Neo', sans-serif" font-size="20">😫</text>

  <rect x="420" y="335" width="360" height="145" rx="10" fill="#ECFDF5" stroke="#10B981" stroke-width="1.5" filter="url(#sh2)"/>
  <text x="600" y="362" text-anchor="middle" font-family="'Nanum Gothic', 'Apple SD Gothic Neo', sans-serif" font-size="15" font-weight="bold" fill="#10B981">모멘텀 있을 때</text>
  <line x1="500" y1="372" x2="700" y2="372" stroke="#A7F3D0" stroke-width="1"/>
  <text x="600" y="395" text-anchor="middle" font-family="'Nanum Gothic', 'Apple SD Gothic Neo', sans-serif" font-size="12" fill="#64748B">이전 이동 방향의 관성을 유지</text>
  <text x="600" y="415" text-anchor="middle" font-family="'Nanum Gothic', 'Apple SD Gothic Neo', sans-serif" font-size="12" fill="#64748B">굴러온 힘으로 작은 언덕을 넘어감</text>
  <text x="600" y="445" text-anchor="middle" font-family="'Nanum Gothic', 'Apple SD Gothic Neo', sans-serif" font-size="14" font-weight="bold" fill="#10B981">결과: 진짜 바닥까지 도달!</text>
  <text x="600" y="468" text-anchor="middle" font-family="'Nanum Gothic', 'Apple SD Gothic Neo', sans-serif" font-size="20">🎉</text>
</svg>