<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" font-family="'Nanum Gothic', 'Apple SD Gothic Neo', sans-serif">
  <style>@import url("https://fonts.googleapis.com/css2?family=Nanum+Gothic:wght@400;700&amp;display=swap");</style>
  <rect width="800" height="400" rx="16" fill="#1a1b26" opacity="0.95"/>

  <text x="400" y="32" text-anchor="middle" fill="#e2e8f0" font-size="18" font-weight="700">가우스에서 AI까지: 최소제곱법의 진화</text>
  <text x="400" y="52" text-anchor="middle" fill="#94a3b8" font-size="13">같은 원리, 다른 규모</text>

  <!-- Table Header -->
  <rect x="40" y="75" width="180" height="45" rx="8" fill="rgba(129,140,248,0.2)" stroke="#818cf8" stroke-width="1.5"/>
  <text x="130" y="102" text-anchor="middle" fill="#c7d2fe" font-size="14" font-weight="700">가우스 (1801년)</text>

  <rect x="230" y="75" width="180" height="45" rx="8" fill="rgba(16,185,129,0.2)" stroke="#10b981" stroke-width="1.5"/>
  <text x="320" y="102" text-anchor="middle" fill="#6ee7b7" font-size="14" font-weight="700">여러분 (오늘)</text>

  <rect x="420" y="75" width="180" height="45" rx="8" fill="rgba(245,158,11,0.2)" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="510" y="102" text-anchor="middle" fill="#fcd34d" font-size="14" font-weight="700">AI (현재)</text>

  <!-- Row labels column -->
  <rect x="610" y="75" width="160" height="45" rx="8" fill="rgba(71,85,105,0.3)" stroke="#475569" stroke-width="1"/>
  <text x="690" y="102" text-anchor="middle" fill="#94a3b8" font-size="13" font-weight="600">비교 항목</text>

  <!-- Row 1: Data -->
  <rect x="610" y="130" width="160" height="55" rx="6" fill="rgba(71,85,105,0.15)" stroke="#475569" stroke-width="0.5"/>
  <text x="690" y="162" text-anchor="middle" fill="#94a3b8" font-size="12" font-weight="600">데이터</text>

  <rect x="40" y="130" width="180" height="55" rx="6" fill="rgba(129,140,248,0.08)"/>
  <text x="130" y="155" text-anchor="middle" fill="#c7d2fe" font-size="13">천체 관측 데이터</text>
  <text x="130" y="173" text-anchor="middle" fill="#94a3b8" font-size="11">19개 관측점</text>

  <rect x="230" y="130" width="180" height="55" rx="6" fill="rgba(16,185,129,0.08)"/>
  <text x="320" y="155" text-anchor="middle" fill="#6ee7b7" font-size="13">데이터 점 10개</text>
  <text x="320" y="173" text-anchor="middle" fill="#94a3b8" font-size="11">슬라이더로 조절</text>

  <rect x="420" y="130" width="180" height="55" rx="6" fill="rgba(245,158,11,0.08)"/>
  <text x="510" y="155" text-anchor="middle" fill="#fcd34d" font-size="13">수백만~수십억</text>
  <text x="510" y="173" text-anchor="middle" fill="#94a3b8" font-size="11">인터넷 전체 텍스트</text>

  <!-- Row 2: Parameters -->
  <rect x="610" y="195" width="160" height="55" rx="6" fill="rgba(71,85,105,0.15)" stroke="#475569" stroke-width="0.5"/>
  <text x="690" y="227" text-anchor="middle" fill="#94a3b8" font-size="12" font-weight="600">파라미터</text>

  <rect x="40" y="195" width="180" height="55" rx="6" fill="rgba(129,140,248,0.08)"/>
  <text x="130" y="220" text-anchor="middle" fill="#c7d2fe" font-size="13">궤도 파라미터 6개</text>
  <text x="130" y="238" text-anchor="middle" fill="#94a3b8" font-size="11">타원 궤도 요소</text>

  <rect x="230" y="195" width="180" height="55" rx="6" fill="rgba(16,185,129,0.08)"/>
  <text x="320" y="220" text-anchor="middle" fill="#6ee7b7" font-size="13">w, b (2개)</text>
  <text x="320" y="238" text-anchor="middle" fill="#94a3b8" font-size="11">기울기와 절편</text>

  <rect x="420" y="195" width="180" height="55" rx="6" fill="rgba(245,158,11,0.08)"/>
  <text x="510" y="220" text-anchor="middle" fill="#fcd34d" font-size="13">수천억 파라미터</text>
  <text x="510" y="238" text-anchor="middle" fill="#94a3b8" font-size="11">GPT-4: ~1.8T</text>

  <!-- Row 3: Loss -->
  <rect x="610" y="260" width="160" height="55" rx="6" fill="rgba(71,85,105,0.15)" stroke="#475569" stroke-width="0.5"/>
  <text x="690" y="292" text-anchor="middle" fill="#94a3b8" font-size="12" font-weight="600">손실 측정</text>

  <rect x="40" y="260" width="180" height="55" rx="6" fill="rgba(129,140,248,0.08)"/>
  <text x="130" y="285" text-anchor="middle" fill="#c7d2fe" font-size="13">(관측-예측)&#xb2; 합</text>
  <text x="130" y="303" text-anchor="middle" fill="#94a3b8" font-size="11">최소제곱법</text>

  <rect x="230" y="260" width="180" height="55" rx="6" fill="rgba(16,185,129,0.08)"/>
  <text x="320" y="285" text-anchor="middle" fill="#6ee7b7" font-size="13">MSE</text>
  <text x="320" y="303" text-anchor="middle" fill="#94a3b8" font-size="11">평균 제곱 오차</text>

  <rect x="420" y="260" width="180" height="55" rx="6" fill="rgba(245,158,11,0.08)"/>
  <text x="510" y="285" text-anchor="middle" fill="#fcd34d" font-size="13">다양한 손실함수</text>
  <text x="510" y="303" text-anchor="middle" fill="#94a3b8" font-size="11">Cross-Entropy 등</text>

  <!-- Row 4: Method -->
  <rect x="610" y="325" width="160" height="55" rx="6" fill="rgba(71,85,105,0.15)" stroke="#475569" stroke-width="0.5"/>
  <text x="690" y="357" text-anchor="middle" fill="#94a3b8" font-size="12" font-weight="600">최적화 방법</text>

  <rect x="40" y="325" width="180" height="55" rx="6" fill="rgba(129,140,248,0.08)"/>
  <text x="130" y="350" text-anchor="middle" fill="#c7d2fe" font-size="13">손으로 계산</text>
  <text x="130" y="368" text-anchor="middle" fill="#94a3b8" font-size="11">연립방정식 풀이</text>

  <rect x="230" y="325" width="180" height="55" rx="6" fill="rgba(16,185,129,0.08)"/>
  <text x="320" y="350" text-anchor="middle" fill="#6ee7b7" font-size="13">슬라이더 조절</text>
  <text x="320" y="368" text-anchor="middle" fill="#94a3b8" font-size="11">직접 탐색</text>

  <rect x="420" y="325" width="180" height="55" rx="6" fill="rgba(245,158,11,0.08)"/>
  <text x="510" y="350" text-anchor="middle" fill="#fcd34d" font-size="13">경사하강법</text>
  <text x="510" y="368" text-anchor="middle" fill="#94a3b8" font-size="11">자동 최적화</text>
</svg>