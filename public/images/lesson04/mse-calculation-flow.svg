<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 350" font-family="'Nanum Gothic', 'Apple SD Gothic Neo', sans-serif">
  <style>@import url("https://fonts.googleapis.com/css2?family=Nanum+Gothic:wght@400;700&amp;display=swap");</style>
  <rect width="800" height="350" rx="16" fill="#1a1b26" opacity="0.95"/>

  <text x="400" y="32" text-anchor="middle" fill="#e2e8f0" font-size="18" font-weight="700">MSE 계산 과정</text>
  <text x="400" y="52" text-anchor="middle" fill="#94a3b8" font-size="13">y = 2x + 1 모델로 3개 데이터 점의 평균 제곱 오차 구하기</text>

  <!-- Step 1: Data Points -->
  <rect x="20" y="80" width="110" height="90" rx="10" fill="rgba(129,140,248,0.15)" stroke="#818cf8" stroke-width="1.5"/>
  <text x="75" y="100" text-anchor="middle" fill="#c7d2fe" font-size="12" font-weight="600">데이터 점들</text>
  <text x="75" y="120" text-anchor="middle" fill="#94a3b8" font-size="11">(1, 3.2)</text>
  <text x="75" y="136" text-anchor="middle" fill="#94a3b8" font-size="11">(2, 4.8)</text>
  <text x="75" y="152" text-anchor="middle" fill="#94a3b8" font-size="11">(3, 7.1)</text>

  <!-- Arrow 1 -->
  <line x1="135" y1="125" x2="160" y2="125" stroke="#60a5fa" stroke-width="2" marker-end="url(#arrowBlue)"/>

  <!-- Step 2: Predictions -->
  <rect x="165" y="80" width="110" height="90" rx="10" fill="rgba(96,165,250,0.15)" stroke="#60a5fa" stroke-width="1.5"/>
  <text x="220" y="100" text-anchor="middle" fill="#93c5fd" font-size="12" font-weight="600">예측값 (2x+1)</text>
  <text x="220" y="120" text-anchor="middle" fill="#94a3b8" font-size="11">&#x177; = 3.0</text>
  <text x="220" y="136" text-anchor="middle" fill="#94a3b8" font-size="11">&#x177; = 5.0</text>
  <text x="220" y="152" text-anchor="middle" fill="#94a3b8" font-size="11">&#x177; = 7.0</text>

  <!-- Arrow 2 -->
  <line x1="280" y1="125" x2="305" y2="125" stroke="#60a5fa" stroke-width="2" marker-end="url(#arrowBlue)"/>

  <!-- Step 3: Errors -->
  <rect x="310" y="80" width="110" height="90" rx="10" fill="rgba(16,185,129,0.15)" stroke="#10b981" stroke-width="1.5"/>
  <text x="365" y="100" text-anchor="middle" fill="#6ee7b7" font-size="12" font-weight="600">오차 (예측-실제)</text>
  <text x="365" y="120" text-anchor="middle" fill="#94a3b8" font-size="11">3.0 - 3.2 = -0.2</text>
  <text x="365" y="136" text-anchor="middle" fill="#94a3b8" font-size="11">5.0 - 4.8 = +0.2</text>
  <text x="365" y="152" text-anchor="middle" fill="#94a3b8" font-size="11">7.0 - 7.1 = -0.1</text>

  <!-- Arrow 3 -->
  <line x1="425" y1="125" x2="450" y2="125" stroke="#60a5fa" stroke-width="2" marker-end="url(#arrowBlue)"/>

  <!-- Step 4: Squared -->
  <rect x="455" y="80" width="100" height="90" rx="10" fill="rgba(245,158,11,0.15)" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="505" y="100" text-anchor="middle" fill="#fcd34d" font-size="12" font-weight="600">제곱</text>
  <text x="505" y="120" text-anchor="middle" fill="#94a3b8" font-size="11">(-0.2)&#xb2; = 0.04</text>
  <text x="505" y="136" text-anchor="middle" fill="#94a3b8" font-size="11">(+0.2)&#xb2; = 0.04</text>
  <text x="505" y="152" text-anchor="middle" fill="#94a3b8" font-size="11">(-0.1)&#xb2; = 0.01</text>

  <!-- Arrow 4 -->
  <line x1="560" y1="125" x2="585" y2="125" stroke="#60a5fa" stroke-width="2" marker-end="url(#arrowBlue)"/>

  <!-- Step 5: Sum -->
  <rect x="590" y="85" width="80" height="80" rx="10" fill="rgba(239,68,68,0.15)" stroke="#ef4444" stroke-width="1.5"/>
  <text x="630" y="108" text-anchor="middle" fill="#fca5a5" font-size="12" font-weight="600">합산</text>
  <text x="630" y="130" text-anchor="middle" fill="#94a3b8" font-size="11">0.04</text>
  <text x="630" y="144" text-anchor="middle" fill="#94a3b8" font-size="11">+ 0.04</text>
  <text x="630" y="158" text-anchor="middle" fill="#94a3b8" font-size="11">+ 0.01</text>

  <!-- Arrow 5 -->
  <line x1="675" y1="125" x2="700" y2="125" stroke="#60a5fa" stroke-width="2" marker-end="url(#arrowBlue)"/>

  <!-- Step 6: Average = MSE -->
  <rect x="705" y="90" width="80" height="70" rx="10" fill="rgba(129,140,248,0.25)" stroke="#818cf8" stroke-width="2"/>
  <text x="745" y="115" text-anchor="middle" fill="#c7d2fe" font-size="12" font-weight="600">평균</text>
  <text x="745" y="138" text-anchor="middle" fill="#e2e8f0" font-size="14" font-weight="700">0.03</text>

  <!-- Arrow marker -->
  <defs>
    <marker id="arrowBlue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#60a5fa"/>
    </marker>
  </defs>

  <!-- Bottom formula box -->
  <rect x="150" y="200" width="500" height="70" rx="12" fill="rgba(71,85,105,0.25)" stroke="#475569" stroke-width="1"/>
  <text x="400" y="228" text-anchor="middle" fill="#e2e8f0" font-size="15" font-weight="700">MSE = (1/n) &#xd7; &#x2211;(&#x177;&#x1d62; - y&#x1d62;)&#xb2;</text>
  <text x="400" y="252" text-anchor="middle" fill="#94a3b8" font-size="12">= (0.04 + 0.04 + 0.01) / 3 = 0.09 / 3 = 0.03</text>

  <!-- Bottom note -->
  <text x="400" y="310" text-anchor="middle" fill="#818cf8" font-size="13" font-weight="600">MSE가 0에 가까울수록 모델이 데이터에 잘 맞는 것!</text>
  <text x="400" y="335" text-anchor="middle" fill="#64748b" font-size="11">MSE = 0.03이면 평균적으로 각 예측이 실제값에서 약 0.17만큼 벗어남 (&#x221a;0.03 &#x2248; 0.17)</text>
</svg>