<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 170" font-family="'Nanum Gothic', 'Apple SD Gothic Neo', sans-serif">
  <style>@import url("https://fonts.googleapis.com/css2?family=Nanum+Gothic:wght@400;700&amp;display=swap");</style>
  <rect width="760" height="170" rx="16" fill="#1a1b26" opacity="0.95"/>

  <!-- Main line -->
  <line x1="50" y1="80" x2="710" y2="80" stroke="#475569" stroke-width="2"/>

  <!-- 1950 - Turing Test -->
  <circle cx="80" cy="80" r="8" fill="#6366f1"/>
  <text x="80" y="58" text-anchor="middle" fill="#a5b4fc" font-size="13" font-weight="700">1950</text>
  <text x="80" y="108" text-anchor="middle" fill="#cbd5e1" font-size="10">튜링 테스트</text>
  <text x="80" y="122" text-anchor="middle" fill="#94a3b8" font-size="9">앨런 튜링</text>

  <!-- 1956 - Dartmouth -->
  <circle cx="190" cy="80" r="8" fill="#8b5cf6"/>
  <text x="190" y="58" text-anchor="middle" fill="#c4b5fd" font-size="13" font-weight="700">1956</text>
  <text x="190" y="108" text-anchor="middle" fill="#cbd5e1" font-size="10">다트머스 회의</text>
  <text x="190" y="122" text-anchor="middle" fill="#94a3b8" font-size="9">"AI" 이름 탄생</text>

  <!-- 1966 - ELIZA -->
  <circle cx="290" cy="80" r="8" fill="#06b6d4"/>
  <text x="290" y="58" text-anchor="middle" fill="#67e8f9" font-size="13" font-weight="700">1966</text>
  <text x="290" y="108" text-anchor="middle" fill="#cbd5e1" font-size="10">ELIZA</text>
  <text x="290" y="122" text-anchor="middle" fill="#94a3b8" font-size="9">최초의 챗봇</text>

  <!-- 1980 - Chinese Room -->
  <circle cx="395" cy="80" r="8" fill="#ec4899"/>
  <text x="395" y="58" text-anchor="middle" fill="#f9a8d4" font-size="13" font-weight="700">1980</text>
  <text x="395" y="108" text-anchor="middle" fill="#cbd5e1" font-size="10">중국어 방</text>
  <text x="395" y="122" text-anchor="middle" fill="#94a3b8" font-size="9">존 설</text>

  <!-- 1997 - Deep Blue -->
  <circle cx="500" cy="80" r="8" fill="#f59e0b"/>
  <text x="500" y="58" text-anchor="middle" fill="#fcd34d" font-size="13" font-weight="700">1997</text>
  <text x="500" y="108" text-anchor="middle" fill="#cbd5e1" font-size="10">딥 블루</text>
  <text x="500" y="122" text-anchor="middle" fill="#94a3b8" font-size="9">체스 세계 챔피언 격파</text>

  <!-- 2016 - AlphaGo -->
  <circle cx="600" cy="80" r="8" fill="#10b981"/>
  <text x="600" y="58" text-anchor="middle" fill="#6ee7b7" font-size="13" font-weight="700">2016</text>
  <text x="600" y="108" text-anchor="middle" fill="#cbd5e1" font-size="10">알파고</text>
  <text x="600" y="122" text-anchor="middle" fill="#94a3b8" font-size="9">바둑 이세돌 9단 격파</text>

  <!-- 2022 - ChatGPT -->
  <circle cx="690" cy="80" r="10" fill="#ef4444" stroke="#e2e8f0" stroke-width="2"/>
  <text x="690" y="58" text-anchor="middle" fill="#fca5a5" font-size="13" font-weight="700">2022</text>
  <text x="690" y="108" text-anchor="middle" fill="#fca5a5" font-size="10" font-weight="600">ChatGPT</text>
  <text x="690" y="122" text-anchor="middle" fill="#fca5a5" font-size="9">LLM 시대 개막</text>

  <!-- Title -->
  <text x="380" y="155" text-anchor="middle" fill="#64748b" font-size="11">"기계가 생각할 수 있는가?" — 72년의 여정 (Russell &amp; Norvig, AIMA 기준 주요 마일스톤)</text>
</svg>