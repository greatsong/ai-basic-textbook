<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500">
  <style>@import url("https://fonts.googleapis.com/css2?family=Nanum+Gothic:wght@400;700&amp;display=swap");</style>
  <defs>
    <filter id="shadow" x="-5%" y="-5%" width="115%" height="115%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-opacity="0.08"/>
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#4F46E5"/>
    </marker>
    <marker id="arrowOrange" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#F59E0B"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="800" height="500" rx="16" fill="#FAFBFF"/>

  <!-- Title -->
  <text x="400" y="36" text-anchor="middle" font-family="'Nanum Gothic', 'Apple SD Gothic Neo', sans-serif" font-size="20" font-weight="bold" fill="#1E293B">중국어 방 사고실험 프로세스</text>
  <rect x="280" y="46" width="240" height="3" rx="1.5" fill="#818CF8"/>

  <!-- Outside person (left) -->
  <rect x="20" y="100" width="160" height="200" rx="14" fill="white" stroke="#10B981" stroke-width="2" filter="url(#shadow)"/>
  <circle cx="100" cy="146" r="30" fill="#D1FAE5"/>
  <text x="100" y="154" text-anchor="middle" font-family="'Nanum Gothic', 'Apple SD Gothic Neo', sans-serif" font-size="26">&#x1F9D1;</text>
  <text x="100" y="196" text-anchor="middle" font-family="'Nanum Gothic', 'Apple SD Gothic Neo', sans-serif" font-size="14" font-weight="bold" fill="#10B981">밖의 사람</text>
  <text x="100" y="216" text-anchor="middle" font-family="'Nanum Gothic', 'Apple SD Gothic Neo', sans-serif" font-size="12" fill="#475569">중국어를</text>
  <text x="100" y="234" text-anchor="middle" font-family="'Nanum Gothic', 'Apple SD Gothic Neo', sans-serif" font-size="12" fill="#475569">잘하는 사람</text>

  <!-- Input arrow -->
  <line x1="185" y1="160" x2="265" y2="160" stroke="#4F46E5" stroke-width="2.5" marker-end="url(#arrow)"/>
  <rect x="192" y="132" width="68" height="22" rx="6" fill="#E0E7FF"/>
  <text x="226" y="148" text-anchor="middle" font-family="'Nanum Gothic', 'Apple SD Gothic Neo', sans-serif" font-size="11" font-weight="bold" fill="#4F46E5">중국어 질문</text>

  <!-- The Room (center, big) -->
  <rect x="270" y="68" width="280" height="280" rx="18" fill="#FFF7ED" stroke="#F59E0B" stroke-width="3" filter="url(#shadow)"/>
  <rect x="270" y="68" width="280" height="44" rx="18" fill="#F59E0B"/>
  <rect x="270" y="94" width="280" height="18" fill="#F59E0B"/>
  <text x="410" y="97" text-anchor="middle" font-family="'Nanum Gothic', 'Apple SD Gothic Neo', sans-serif" font-size="16" font-weight="bold" fill="white">밀폐된 방</text>

  <!-- Person inside -->
  <circle cx="360" cy="164" r="26" fill="#FEE2E2"/>
  <text x="360" y="172" text-anchor="middle" font-family="'Nanum Gothic', 'Apple SD Gothic Neo', sans-serif" font-size="22">&#x1F468;</text>
  <text x="360" y="204" text-anchor="middle" font-family="'Nanum Gothic', 'Apple SD Gothic Neo', sans-serif" font-size="12" font-weight="bold" fill="#EF4444">중국어 모름!</text>

  <!-- Manual book -->
  <rect x="410" y="138" width="120" height="70" rx="10" fill="white" stroke="#C7D2FE" stroke-width="2"/>
  <text x="470" y="162" text-anchor="middle" font-family="'Nanum Gothic', 'Apple SD Gothic Neo', sans-serif" font-size="11" font-weight="bold" fill="#4F46E5">규칙 매뉴얼</text>
  <text x="470" y="180" text-anchor="middle" font-family="'Nanum Gothic', 'Apple SD Gothic Neo', sans-serif" font-size="10" fill="#475569">"이 글자 → 저 글자"</text>
  <text x="470" y="196" text-anchor="middle" font-family="'Nanum Gothic', 'Apple SD Gothic Neo', sans-serif" font-size="10" fill="#475569">패턴 매칭 규칙</text>

  <!-- Process steps inside room -->
  <rect x="295" y="225" width="230" height="28" rx="6" fill="#FEF3C7"/>
  <text x="410" y="244" text-anchor="middle" font-family="'Nanum Gothic', 'Apple SD Gothic Neo', sans-serif" font-size="12" fill="#92400E">1. 글자 모양 비교</text>

  <rect x="295" y="260" width="230" height="28" rx="6" fill="#FEF3C7"/>
  <text x="410" y="279" text-anchor="middle" font-family="'Nanum Gothic', 'Apple SD Gothic Neo', sans-serif" font-size="12" fill="#92400E">2. 매뉴얼에서 규칙 찾기</text>

  <rect x="295" y="295" width="230" height="28" rx="6" fill="#FEF3C7"/>
  <text x="410" y="314" text-anchor="middle" font-family="'Nanum Gothic', 'Apple SD Gothic Neo', sans-serif" font-size="12" fill="#92400E">3. 대응하는 글자 출력</text>

  <!-- Output arrow -->
  <line x1="555" y1="200" x2="615" y2="200" stroke="#F59E0B" stroke-width="2.5" marker-end="url(#arrowOrange)"/>
  <rect x="555" y="172" width="68" height="22" rx="6" fill="#FEF3C7"/>
  <text x="589" y="188" text-anchor="middle" font-family="'Nanum Gothic', 'Apple SD Gothic Neo', sans-serif" font-size="11" font-weight="bold" fill="#F59E0B">중국어 답변</text>

  <!-- Outside person (right) -->
  <rect x="620" y="100" width="160" height="200" rx="14" fill="white" stroke="#10B981" stroke-width="2" filter="url(#shadow)"/>
  <circle cx="700" cy="146" r="30" fill="#D1FAE5"/>
  <text x="700" y="154" text-anchor="middle" font-family="'Nanum Gothic', 'Apple SD Gothic Neo', sans-serif" font-size="26">&#x1F9D1;</text>
  <text x="700" y="196" text-anchor="middle" font-family="'Nanum Gothic', 'Apple SD Gothic Neo', sans-serif" font-size="14" font-weight="bold" fill="#10B981">밖의 사람</text>
  <text x="700" y="216" text-anchor="middle" font-family="'Nanum Gothic', 'Apple SD Gothic Neo', sans-serif" font-size="12" fill="#475569">"중국어를</text>
  <text x="700" y="234" text-anchor="middle" font-family="'Nanum Gothic', 'Apple SD Gothic Neo', sans-serif" font-size="12" fill="#475569">잘하네!"</text>

  <!-- Key question box -->
  <rect x="60" y="374" width="680" height="110" rx="14" fill="white" stroke="#8B5CF6" stroke-width="2" filter="url(#shadow)"/>

  <rect x="76" y="390" width="120" height="28" rx="14" fill="#8B5CF6"/>
  <text x="136" y="409" text-anchor="middle" font-family="'Nanum Gothic', 'Apple SD Gothic Neo', sans-serif" font-size="13" font-weight="bold" fill="white">핵심 질문</text>

  <text x="400" y="436" text-anchor="middle" font-family="'Nanum Gothic', 'Apple SD Gothic Neo', sans-serif" font-size="16" font-weight="bold" fill="#1E293B">방 안의 사람은 중국어를 "이해"하는 것일까?</text>
  <text x="400" y="462" text-anchor="middle" font-family="'Nanum Gothic', 'Apple SD Gothic Neo', sans-serif" font-size="14" fill="#475569">행동(결과)은 완벽하지만, 이해(의미 파악)는 전혀 없다 → 이것이 현재 AI의 모습?</text>
</svg>