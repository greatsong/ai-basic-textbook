<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500">
  <style>@import url("https://fonts.googleapis.com/css2?family=Nanum+Gothic:wght@400;700&amp;display=swap");</style>
  <defs>
    <filter id="shadow" x="-5%" y="-5%" width="115%" height="115%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-opacity="0.08"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="500" rx="16" fill="#FAFBFF"/>

  <!-- Title -->
  <text x="400" y="36" text-anchor="middle" font-family="'Nanum Gothic', 'Apple SD Gothic Neo', sans-serif" font-size="20" font-weight="bold" fill="#1E293B">"기계가 생각할 수 있는가?" 논쟁 지도</text>
  <rect x="260" y="46" width="280" height="3" rx="1.5" fill="#818CF8"/>

  <!-- Center question -->
  <circle cx="400" cy="140" r="52" fill="#E0E7FF" stroke="#4F46E5" stroke-width="3" filter="url(#shadow)"/>
  <text x="400" y="134" text-anchor="middle" font-family="'Nanum Gothic', 'Apple SD Gothic Neo', sans-serif" font-size="13" font-weight="bold" fill="#3730A3">기계가</text>
  <text x="400" y="152" text-anchor="middle" font-family="'Nanum Gothic', 'Apple SD Gothic Neo', sans-serif" font-size="13" font-weight="bold" fill="#3730A3">생각할 수</text>
  <text x="400" y="170" text-anchor="middle" font-family="'Nanum Gothic', 'Apple SD Gothic Neo', sans-serif" font-size="13" font-weight="bold" fill="#3730A3">있는가?</text>

  <!-- Left branch: YES (Turing) -->
  <line x1="352" y1="158" x2="180" y2="220" stroke="#4F46E5" stroke-width="2"/>
  <rect x="40" y="196" width="280" height="60" rx="14" fill="#4F46E5" filter="url(#shadow)"/>
  <text x="180" y="224" text-anchor="middle" font-family="'Nanum Gothic', 'Apple SD Gothic Neo', sans-serif" font-size="16" font-weight="bold" fill="white">YES - 튜링 테스트 지지</text>
  <text x="180" y="244" text-anchor="middle" font-family="'Nanum Gothic', 'Apple SD Gothic Neo', sans-serif" font-size="12" fill="#C7D2FE">앨런 튜링 (1950)</text>

  <!-- Left sub-arguments -->
  <line x1="100" y1="256" x2="100" y2="280" stroke="#818CF8" stroke-width="1.5"/>

  <rect x="24" y="280" width="180" height="52" rx="10" fill="#F0F4FF" stroke="#C7D2FE" stroke-width="1.5"/>
  <text x="114" y="300" text-anchor="middle" font-family="'Nanum Gothic', 'Apple SD Gothic Neo', sans-serif" font-size="12" font-weight="bold" fill="#4F46E5">행동주의 관점</text>
  <text x="114" y="318" text-anchor="middle" font-family="'Nanum Gothic', 'Apple SD Gothic Neo', sans-serif" font-size="11" fill="#475569">결과가 같으면 같은 것</text>

  <line x1="260" y1="256" x2="260" y2="280" stroke="#818CF8" stroke-width="1.5"/>

  <rect x="175" y="280" width="180" height="52" rx="10" fill="#F0F4FF" stroke="#C7D2FE" stroke-width="1.5"/>
  <text x="265" y="300" text-anchor="middle" font-family="'Nanum Gothic', 'Apple SD Gothic Neo', sans-serif" font-size="12" font-weight="bold" fill="#4F46E5">실용적 관점</text>
  <text x="265" y="318" text-anchor="middle" font-family="'Nanum Gothic', 'Apple SD Gothic Neo', sans-serif" font-size="11" fill="#475569">내부는 알 수 없다</text>

  <!-- Left example -->
  <rect x="40" y="348" width="280" height="44" rx="8" fill="#D1FAE5"/>
  <text x="180" y="375" text-anchor="middle" font-family="'Nanum Gothic', 'Apple SD Gothic Neo', sans-serif" font-size="12" fill="#065F46">예: ChatGPT의 자연스러운 대화가 증거</text>

  <!-- Right branch: NO (Searle) -->
  <line x1="448" y1="158" x2="620" y2="220" stroke="#8B5CF6" stroke-width="2"/>
  <rect x="480" y="196" width="280" height="60" rx="14" fill="#8B5CF6" filter="url(#shadow)"/>
  <text x="620" y="224" text-anchor="middle" font-family="'Nanum Gothic', 'Apple SD Gothic Neo', sans-serif" font-size="16" font-weight="bold" fill="white">NO - 중국어 방 지지</text>
  <text x="620" y="244" text-anchor="middle" font-family="'Nanum Gothic', 'Apple SD Gothic Neo', sans-serif" font-size="12" fill="#DDD6FE">존 설 (1980)</text>

  <!-- Right sub-arguments -->
  <line x1="540" y1="256" x2="540" y2="280" stroke="#A78BFA" stroke-width="1.5"/>

  <rect x="452" y="280" width="180" height="52" rx="10" fill="#F5F3FF" stroke="#DDD6FE" stroke-width="1.5"/>
  <text x="542" y="300" text-anchor="middle" font-family="'Nanum Gothic', 'Apple SD Gothic Neo', sans-serif" font-size="12" font-weight="bold" fill="#8B5CF6">의미론적 관점</text>
  <text x="542" y="318" text-anchor="middle" font-family="'Nanum Gothic', 'Apple SD Gothic Neo', sans-serif" font-size="11" fill="#475569">흉내 ≠ 이해</text>

  <line x1="700" y1="256" x2="700" y2="280" stroke="#A78BFA" stroke-width="1.5"/>

  <rect x="612" y="280" width="180" height="52" rx="10" fill="#F5F3FF" stroke="#DDD6FE" stroke-width="1.5"/>
  <text x="702" y="300" text-anchor="middle" font-family="'Nanum Gothic', 'Apple SD Gothic Neo', sans-serif" font-size="12" font-weight="bold" fill="#8B5CF6">철학적 관점</text>
  <text x="702" y="318" text-anchor="middle" font-family="'Nanum Gothic', 'Apple SD Gothic Neo', sans-serif" font-size="11" fill="#475569">의식 없이는 불가</text>

  <!-- Right example -->
  <rect x="480" y="348" width="280" height="44" rx="8" fill="#FEE2E2"/>
  <text x="620" y="375" text-anchor="middle" font-family="'Nanum Gothic', 'Apple SD Gothic Neo', sans-serif" font-size="12" fill="#991B1B">예: 중국어 방의 사람은 이해하지 못함</text>

  <!-- Bottom: Open question -->
  <rect x="140" y="416" width="520" height="68" rx="14" fill="white" stroke="#F59E0B" stroke-width="2" filter="url(#shadow)"/>
  <rect x="155" y="428" width="100" height="24" rx="12" fill="#F59E0B"/>
  <text x="205" y="445" text-anchor="middle" font-family="'Nanum Gothic', 'Apple SD Gothic Neo', sans-serif" font-size="12" font-weight="bold" fill="white">열린 질문</text>
  <text x="400" y="464" text-anchor="middle" font-family="'Nanum Gothic', 'Apple SD Gothic Neo', sans-serif" font-size="14" font-weight="bold" fill="#1E293B">이 논쟁은 40년 넘게 계속 중 — 여러분의 입장은?</text>
</svg>