<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540">
  <style>@import url("https://fonts.googleapis.com/css2?family=Nanum+Gothic:wght@400;700&amp;display=swap");</style>
  <defs>
    <linearGradient id="bgGrad3" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FAFBFF"/>
      <stop offset="100%" stop-color="#F0F4FF"/>
    </linearGradient>
    <linearGradient id="curveGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#10B981"/>
      <stop offset="30%" stop-color="#4F46E5"/>
      <stop offset="50%" stop-color="#F59E0B"/>
      <stop offset="70%" stop-color="#EF4444"/>
      <stop offset="100%" stop-color="#94A3B8"/>
    </linearGradient>
    <filter id="shadow3" x="-5%" y="-5%" width="110%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#000" flood-opacity="0.1"/>
    </filter>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="glow"/>
      <feMerge>
        <feMergeNode in="glow"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="960" height="540" fill="url(#bgGrad3)"/>
  <rect x="0" y="0" width="960" height="4" fill="#4F46E5"/>

  <!-- Title -->
  <text x="480" y="40" font-family="'Nanum Gothic', 'Apple SD Gothic Neo', sans-serif" font-size="22" font-weight="bold" fill="#1E293B" text-anchor="middle">퍼셉트론의 흥망성쇠: 기대에서 AI 겨울까지</text>
  <line x1="320" y1="50" x2="640" y2="50" stroke="#818CF8" stroke-width="3"/>

  <!-- Axes -->
  <line x1="80" y1="420" x2="900" y2="420" stroke="#94A3B8" stroke-width="1.5"/>
  <line x1="80" y1="420" x2="80" y2="80" stroke="#94A3B8" stroke-width="1.5"/>
  <text x="40" y="250" font-family="'Nanum Gothic', 'Apple SD Gothic Neo', sans-serif" font-size="13" fill="#475569" text-anchor="middle" transform="rotate(-90 40 250)">관심도 / 연구비</text>
  <text x="490" y="455" font-family="'Nanum Gothic', 'Apple SD Gothic Neo', sans-serif" font-size="13" fill="#475569" text-anchor="middle">시간</text>

  <!-- Year labels on x-axis -->
  <text x="130" y="440" font-family="'Nanum Gothic', 'Apple SD Gothic Neo', sans-serif" font-size="11" fill="#94A3B8" text-anchor="middle">1943</text>
  <text x="270" y="440" font-family="'Nanum Gothic', 'Apple SD Gothic Neo', sans-serif" font-size="11" fill="#94A3B8" text-anchor="middle">1958</text>
  <text x="440" y="440" font-family="'Nanum Gothic', 'Apple SD Gothic Neo', sans-serif" font-size="11" fill="#94A3B8" text-anchor="middle">1960</text>
  <text x="590" y="440" font-family="'Nanum Gothic', 'Apple SD Gothic Neo', sans-serif" font-size="11" fill="#94A3B8" text-anchor="middle">1969</text>
  <text x="800" y="440" font-family="'Nanum Gothic', 'Apple SD Gothic Neo', sans-serif" font-size="11" fill="#94A3B8" text-anchor="middle">1980s</text>

  <!-- The curve -->
  <path d="M 130 380 C 160 370, 200 350, 270 200 C 310 130, 370 100, 440 110 C 490 115, 530 130, 590 300 C 630 370, 700 395, 800 400"
        stroke="url(#curveGrad)" stroke-width="4" fill="none" stroke-linecap="round"/>

  <!-- Area fill under curve -->
  <path d="M 130 380 C 160 370, 200 350, 270 200 C 310 130, 370 100, 440 110 C 490 115, 530 130, 590 300 C 630 370, 700 395, 800 400 L 800 420 L 130 420 Z"
        fill="url(#curveGrad)" opacity="0.08"/>

  <!-- Event 1: McCulloch-Pitts -->
  <circle cx="130" cy="380" r="8" fill="#10B981" filter="url(#glow)"/>
  <rect x="90" y="460" width="160" height="65" rx="8" fill="white" stroke="#10B981" stroke-width="1.5" filter="url(#shadow3)"/>
  <text x="170" y="480" font-family="'Nanum Gothic', 'Apple SD Gothic Neo', sans-serif" font-size="12" font-weight="bold" fill="#10B981" text-anchor="middle">1943 맥컬록-피츠</text>
  <text x="170" y="498" font-family="'Nanum Gothic', 'Apple SD Gothic Neo', sans-serif" font-size="11" fill="#475569" text-anchor="middle">뉴런을 수학으로 표현</text>
  <text x="170" y="515" font-family="'Nanum Gothic', 'Apple SD Gothic Neo', sans-serif" font-size="11" fill="#475569" text-anchor="middle">(학습 기능 없음)</text>
  <line x1="130" y1="388" x2="145" y2="460" stroke="#10B981" stroke-width="1" stroke-dasharray="4,3"/>

  <!-- Event 2: Perceptron -->
  <circle cx="270" cy="200" r="8" fill="#4F46E5" filter="url(#glow)"/>
  <rect x="195" y="70" width="150" height="65" rx="8" fill="white" stroke="#4F46E5" stroke-width="1.5" filter="url(#shadow3)"/>
  <text x="270" y="90" font-family="'Nanum Gothic', 'Apple SD Gothic Neo', sans-serif" font-size="12" font-weight="bold" fill="#4F46E5" text-anchor="middle">1958 퍼셉트론</text>
  <text x="270" y="108" font-family="'Nanum Gothic', 'Apple SD Gothic Neo', sans-serif" font-size="11" fill="#475569" text-anchor="middle">로젠블랫의 혁신</text>
  <text x="270" y="125" font-family="'Nanum Gothic', 'Apple SD Gothic Neo', sans-serif" font-size="11" fill="#475569" text-anchor="middle">"스스로 배우는 기계!"</text>
  <line x1="270" y1="135" x2="270" y2="192" stroke="#4F46E5" stroke-width="1" stroke-dasharray="4,3"/>

  <!-- Event 3: NYT Peak -->
  <circle cx="440" cy="110" r="10" fill="#F59E0B" filter="url(#glow)"/>
  <text x="440" y="115" font-family="'Nanum Gothic', 'Apple SD Gothic Neo', sans-serif" font-size="10" font-weight="bold" fill="white" text-anchor="middle">!</text>
  <rect x="370" y="60" width="140" height="30" rx="6" fill="#FEF3C7" stroke="#F59E0B" stroke-width="1.5"/>
  <text x="440" y="80" font-family="'Nanum Gothic', 'Apple SD Gothic Neo', sans-serif" font-size="12" font-weight="bold" fill="#F59E0B" text-anchor="middle">NYT 1면 보도!</text>

  <!-- Hype bubble -->
  <rect x="350" y="140" width="180" height="50" rx="10" fill="#FEF3C7" stroke="#F59E0B" stroke-width="1" stroke-dasharray="4,2" filter="url(#shadow3)"/>
  <text x="440" y="160" font-family="'Nanum Gothic', 'Apple SD Gothic Neo', sans-serif" font-size="11" fill="#F59E0B" font-weight="bold" text-anchor="middle">"걷고, 말하고, 보는 기계"</text>
  <text x="440" y="178" font-family="'Nanum Gothic', 'Apple SD Gothic Neo', sans-serif" font-size="10" fill="#475569" text-anchor="middle">과장된 기대의 정점</text>

  <!-- Event 4: Minsky Book -->
  <circle cx="590" cy="300" r="8" fill="#EF4444" filter="url(#glow)"/>
  <rect x="520" y="210" width="160" height="65" rx="8" fill="white" stroke="#EF4444" stroke-width="1.5" filter="url(#shadow3)"/>
  <text x="600" y="230" font-family="'Nanum Gothic', 'Apple SD Gothic Neo', sans-serif" font-size="12" font-weight="bold" fill="#EF4444" text-anchor="middle">1969 "Perceptrons"</text>
  <text x="600" y="248" font-family="'Nanum Gothic', 'Apple SD Gothic Neo', sans-serif" font-size="11" fill="#475569" text-anchor="middle">민스키 & 파퍼트</text>
  <text x="600" y="265" font-family="'Nanum Gothic', 'Apple SD Gothic Neo', sans-serif" font-size="11" fill="#EF4444" font-weight="bold" text-anchor="middle">"XOR 불가능" 증명</text>
  <line x1="590" y1="275" x2="590" y2="292" stroke="#EF4444" stroke-width="1" stroke-dasharray="4,3"/>

  <!-- Event 5: AI Winter -->
  <rect x="700" y="330" width="180" height="75" rx="10" fill="#F0F4FF" stroke="#94A3B8" stroke-width="1.5" filter="url(#shadow3)"/>
  <text x="790" y="352" font-family="'Nanum Gothic', 'Apple SD Gothic Neo', sans-serif" font-size="14" font-weight="bold" fill="#94A3B8" text-anchor="middle">AI 겨울</text>
  <text x="790" y="372" font-family="'Nanum Gothic', 'Apple SD Gothic Neo', sans-serif" font-size="11" fill="#475569" text-anchor="middle">연구비 삭감</text>
  <text x="790" y="389" font-family="'Nanum Gothic', 'Apple SD Gothic Neo', sans-serif" font-size="11" fill="#475569" text-anchor="middle">학계의 외면 (~20년)</text>

  <!-- Snowflake icons for AI winter -->
  <text x="715" y="355" font-family="'Nanum Gothic', 'Apple SD Gothic Neo', sans-serif" font-size="16" fill="#94A3B8">*</text>
  <text x="860" y="370" font-family="'Nanum Gothic', 'Apple SD Gothic Neo', sans-serif" font-size="16" fill="#94A3B8">*</text>
  <text x="855" y="395" font-family="'Nanum Gothic', 'Apple SD Gothic Neo', sans-serif" font-size="12" fill="#94A3B8">*</text>

  <!-- Key Lesson Box -->
  <rect x="100" y="490" width="760" height="40" rx="10" fill="#4F46E5" filter="url(#shadow3)"/>
  <text x="480" y="516" font-family="'Nanum Gothic', 'Apple SD Gothic Neo', sans-serif" font-size="15" font-weight="bold" fill="white" text-anchor="middle">교훈: 기술의 한계를 정직하게 인정하는 것이 과학의 발전 방식이다</text>
</svg>