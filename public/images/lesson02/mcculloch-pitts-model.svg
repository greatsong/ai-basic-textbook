<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540">
  <style>@import url("https://fonts.googleapis.com/css2?family=Nanum+Gothic:wght@400;700&amp;display=swap");</style>
  <defs>
    <linearGradient id="bgGrad2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FAFBFF"/>
      <stop offset="100%" stop-color="#F0F4FF"/>
    </linearGradient>
    <filter id="shadow2" x="-5%" y="-5%" width="110%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#000" flood-opacity="0.1"/>
    </filter>
    <marker id="arr2" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#4F46E5"/>
    </marker>
  </defs>

  <rect width="960" height="540" fill="url(#bgGrad2)"/>
  <rect x="0" y="0" width="960" height="4" fill="#4F46E5"/>

  <!-- Title -->
  <text x="480" y="40" font-family="'Nanum Gothic', 'Apple SD Gothic Neo', sans-serif" font-size="22" font-weight="bold" fill="#1E293B" text-anchor="middle">맥컬록-피츠 모델로 AND/OR 구현하기</text>
  <line x1="340" y1="50" x2="620" y2="50" stroke="#818CF8" stroke-width="3"/>

  <!-- ===== LEFT: AND Gate ===== -->
  <text x="240" y="85" font-family="'Nanum Gothic', 'Apple SD Gothic Neo', sans-serif" font-size="18" font-weight="bold" fill="#4F46E5" text-anchor="middle">AND 게이트</text>

  <!-- Input x1 -->
  <rect x="40" y="110" width="80" height="40" rx="8" fill="#E0E7FF" stroke="#4F46E5" stroke-width="1.5"/>
  <text x="80" y="135" font-family="'Nanum Gothic', 'Apple SD Gothic Neo', sans-serif" font-size="14" font-weight="bold" fill="#3730A3" text-anchor="middle">x1</text>

  <!-- Input x2 -->
  <rect x="40" y="180" width="80" height="40" rx="8" fill="#E0E7FF" stroke="#4F46E5" stroke-width="1.5"/>
  <text x="80" y="205" font-family="'Nanum Gothic', 'Apple SD Gothic Neo', sans-serif" font-size="14" font-weight="bold" fill="#3730A3" text-anchor="middle">x2</text>

  <!-- Weights -->
  <line x1="120" y1="130" x2="200" y2="165" stroke="#4F46E5" stroke-width="2" marker-end="url(#arr2)"/>
  <text x="148" y="138" font-family="'Nanum Gothic', 'Apple SD Gothic Neo', sans-serif" font-size="12" font-weight="bold" fill="#4F46E5">w=1</text>
  <line x1="120" y1="200" x2="200" y2="175" stroke="#4F46E5" stroke-width="2" marker-end="url(#arr2)"/>
  <text x="148" y="208" font-family="'Nanum Gothic', 'Apple SD Gothic Neo', sans-serif" font-size="12" font-weight="bold" fill="#4F46E5">w=1</text>

  <!-- Neuron (sum) -->
  <circle cx="240" cy="170" r="35" fill="white" stroke="#4F46E5" stroke-width="2.5" filter="url(#shadow2)"/>
  <text x="240" y="165" font-family="'Nanum Gothic', 'Apple SD Gothic Neo', sans-serif" font-size="13" font-weight="bold" fill="#3730A3" text-anchor="middle">합산</text>
  <text x="240" y="182" font-family="'Nanum Gothic', 'Apple SD Gothic Neo', sans-serif" font-size="11" fill="#475569" text-anchor="middle">임계값=1.5</text>

  <!-- Output arrow -->
  <line x1="275" y1="170" x2="340" y2="170" stroke="#4F46E5" stroke-width="2" marker-end="url(#arr2)"/>

  <!-- Output -->
  <rect x="350" y="150" width="80" height="40" rx="8" fill="#4F46E5" filter="url(#shadow2)"/>
  <text x="390" y="175" font-family="'Nanum Gothic', 'Apple SD Gothic Neo', sans-serif" font-size="14" font-weight="bold" fill="white" text-anchor="middle">출력</text>

  <!-- AND Truth Table -->
  <rect x="40" y="250" width="400" height="170" rx="8" fill="white" stroke="#E0E7FF" stroke-width="1.5" filter="url(#shadow2)"/>
  <rect x="40" y="250" width="400" height="35" rx="8" fill="#4F46E5"/>
  <text x="100" y="273" font-family="'Nanum Gothic', 'Apple SD Gothic Neo', sans-serif" font-size="12" font-weight="bold" fill="white" text-anchor="middle">x1</text>
  <text x="180" y="273" font-family="'Nanum Gothic', 'Apple SD Gothic Neo', sans-serif" font-size="12" font-weight="bold" fill="white" text-anchor="middle">x2</text>
  <text x="270" y="273" font-family="'Nanum Gothic', 'Apple SD Gothic Neo', sans-serif" font-size="12" font-weight="bold" fill="white" text-anchor="middle">합산</text>
  <text x="370" y="273" font-family="'Nanum Gothic', 'Apple SD Gothic Neo', sans-serif" font-size="12" font-weight="bold" fill="white" text-anchor="middle">출력</text>

  <!-- Row 1: 0,0 -->
  <text x="100" y="308" font-family="'Nanum Gothic', 'Apple SD Gothic Neo', sans-serif" font-size="13" fill="#1E293B" text-anchor="middle">0</text>
  <text x="180" y="308" font-family="'Nanum Gothic', 'Apple SD Gothic Neo', sans-serif" font-size="13" fill="#1E293B" text-anchor="middle">0</text>
  <text x="270" y="308" font-family="'Nanum Gothic', 'Apple SD Gothic Neo', sans-serif" font-size="13" fill="#475569" text-anchor="middle">0 &lt; 1.5</text>
  <circle cx="370" cy="303" r="10" fill="#EF4444" opacity="0.15"/>
  <text x="370" y="308" font-family="'Nanum Gothic', 'Apple SD Gothic Neo', sans-serif" font-size="13" font-weight="bold" fill="#EF4444" text-anchor="middle">0</text>

  <!-- Row 2: 0,1 -->
  <rect x="40" y="320" width="400" height="30" fill="#F0F4FF"/>
  <text x="100" y="340" font-family="'Nanum Gothic', 'Apple SD Gothic Neo', sans-serif" font-size="13" fill="#1E293B" text-anchor="middle">0</text>
  <text x="180" y="340" font-family="'Nanum Gothic', 'Apple SD Gothic Neo', sans-serif" font-size="13" fill="#1E293B" text-anchor="middle">1</text>
  <text x="270" y="340" font-family="'Nanum Gothic', 'Apple SD Gothic Neo', sans-serif" font-size="13" fill="#475569" text-anchor="middle">1 &lt; 1.5</text>
  <circle cx="370" cy="335" r="10" fill="#EF4444" opacity="0.15"/>
  <text x="370" y="340" font-family="'Nanum Gothic', 'Apple SD Gothic Neo', sans-serif" font-size="13" font-weight="bold" fill="#EF4444" text-anchor="middle">0</text>

  <!-- Row 3: 1,0 -->
  <text x="100" y="370" font-family="'Nanum Gothic', 'Apple SD Gothic Neo', sans-serif" font-size="13" fill="#1E293B" text-anchor="middle">1</text>
  <text x="180" y="370" font-family="'Nanum Gothic', 'Apple SD Gothic Neo', sans-serif" font-size="13" fill="#1E293B" text-anchor="middle">0</text>
  <text x="270" y="370" font-family="'Nanum Gothic', 'Apple SD Gothic Neo', sans-serif" font-size="13" fill="#475569" text-anchor="middle">1 &lt; 1.5</text>
  <circle cx="370" cy="365" r="10" fill="#EF4444" opacity="0.15"/>
  <text x="370" y="370" font-family="'Nanum Gothic', 'Apple SD Gothic Neo', sans-serif" font-size="13" font-weight="bold" fill="#EF4444" text-anchor="middle">0</text>

  <!-- Row 4: 1,1 -->
  <rect x="40" y="383" width="400" height="30" fill="#D1FAE5"/>
  <text x="100" y="403" font-family="'Nanum Gothic', 'Apple SD Gothic Neo', sans-serif" font-size="13" fill="#1E293B" text-anchor="middle">1</text>
  <text x="180" y="403" font-family="'Nanum Gothic', 'Apple SD Gothic Neo', sans-serif" font-size="13" fill="#1E293B" text-anchor="middle">1</text>
  <text x="270" y="403" font-family="'Nanum Gothic', 'Apple SD Gothic Neo', sans-serif" font-size="13" fill="#475569" text-anchor="middle">2 > 1.5</text>
  <circle cx="370" cy="398" r="10" fill="#10B981" opacity="0.15"/>
  <text x="370" y="403" font-family="'Nanum Gothic', 'Apple SD Gothic Neo', sans-serif" font-size="13" font-weight="bold" fill="#10B981" text-anchor="middle">1</text>

  <!-- Checkmark -->
  <text x="240" y="440" font-family="'Nanum Gothic', 'Apple SD Gothic Neo', sans-serif" font-size="14" font-weight="bold" fill="#10B981" text-anchor="middle">둘 다 1일 때만 출력 1!</text>

  <!-- ===== RIGHT: OR Gate ===== -->
  <text x="720" y="85" font-family="'Nanum Gothic', 'Apple SD Gothic Neo', sans-serif" font-size="18" font-weight="bold" fill="#818CF8" text-anchor="middle">OR 게이트</text>

  <!-- Input x1 -->
  <rect x="520" y="110" width="80" height="40" rx="8" fill="#E0E7FF" stroke="#818CF8" stroke-width="1.5"/>
  <text x="560" y="135" font-family="'Nanum Gothic', 'Apple SD Gothic Neo', sans-serif" font-size="14" font-weight="bold" fill="#3730A3" text-anchor="middle">x1</text>

  <!-- Input x2 -->
  <rect x="520" y="180" width="80" height="40" rx="8" fill="#E0E7FF" stroke="#818CF8" stroke-width="1.5"/>
  <text x="560" y="205" font-family="'Nanum Gothic', 'Apple SD Gothic Neo', sans-serif" font-size="14" font-weight="bold" fill="#3730A3" text-anchor="middle">x2</text>

  <!-- Weights -->
  <line x1="600" y1="130" x2="680" y2="165" stroke="#818CF8" stroke-width="2" marker-end="url(#arr2)"/>
  <text x="628" y="138" font-family="'Nanum Gothic', 'Apple SD Gothic Neo', sans-serif" font-size="12" font-weight="bold" fill="#818CF8">w=1</text>
  <line x1="600" y1="200" x2="680" y2="175" stroke="#818CF8" stroke-width="2" marker-end="url(#arr2)"/>
  <text x="628" y="208" font-family="'Nanum Gothic', 'Apple SD Gothic Neo', sans-serif" font-size="12" font-weight="bold" fill="#818CF8">w=1</text>

  <!-- Neuron (sum) -->
  <circle cx="720" cy="170" r="35" fill="white" stroke="#818CF8" stroke-width="2.5" filter="url(#shadow2)"/>
  <text x="720" y="165" font-family="'Nanum Gothic', 'Apple SD Gothic Neo', sans-serif" font-size="13" font-weight="bold" fill="#3730A3" text-anchor="middle">합산</text>
  <text x="720" y="182" font-family="'Nanum Gothic', 'Apple SD Gothic Neo', sans-serif" font-size="11" fill="#475569" text-anchor="middle">임계값=0.5</text>

  <!-- Output arrow -->
  <line x1="755" y1="170" x2="820" y2="170" stroke="#818CF8" stroke-width="2" marker-end="url(#arr2)"/>

  <!-- Output -->
  <rect x="830" y="150" width="80" height="40" rx="8" fill="#818CF8" filter="url(#shadow2)"/>
  <text x="870" y="175" font-family="'Nanum Gothic', 'Apple SD Gothic Neo', sans-serif" font-size="14" font-weight="bold" fill="white" text-anchor="middle">출력</text>

  <!-- OR Truth Table -->
  <rect x="520" y="250" width="400" height="170" rx="8" fill="white" stroke="#E0E7FF" stroke-width="1.5" filter="url(#shadow2)"/>
  <rect x="520" y="250" width="400" height="35" rx="8" fill="#818CF8"/>
  <text x="580" y="273" font-family="'Nanum Gothic', 'Apple SD Gothic Neo', sans-serif" font-size="12" font-weight="bold" fill="white" text-anchor="middle">x1</text>
  <text x="660" y="273" font-family="'Nanum Gothic', 'Apple SD Gothic Neo', sans-serif" font-size="12" font-weight="bold" fill="white" text-anchor="middle">x2</text>
  <text x="750" y="273" font-family="'Nanum Gothic', 'Apple SD Gothic Neo', sans-serif" font-size="12" font-weight="bold" fill="white" text-anchor="middle">합산</text>
  <text x="850" y="273" font-family="'Nanum Gothic', 'Apple SD Gothic Neo', sans-serif" font-size="12" font-weight="bold" fill="white" text-anchor="middle">출력</text>

  <!-- Row 1: 0,0 -->
  <text x="580" y="308" font-family="'Nanum Gothic', 'Apple SD Gothic Neo', sans-serif" font-size="13" fill="#1E293B" text-anchor="middle">0</text>
  <text x="660" y="308" font-family="'Nanum Gothic', 'Apple SD Gothic Neo', sans-serif" font-size="13" fill="#1E293B" text-anchor="middle">0</text>
  <text x="750" y="308" font-family="'Nanum Gothic', 'Apple SD Gothic Neo', sans-serif" font-size="13" fill="#475569" text-anchor="middle">0 &lt; 0.5</text>
  <circle cx="850" cy="303" r="10" fill="#EF4444" opacity="0.15"/>
  <text x="850" y="308" font-family="'Nanum Gothic', 'Apple SD Gothic Neo', sans-serif" font-size="13" font-weight="bold" fill="#EF4444" text-anchor="middle">0</text>

  <!-- Row 2: 0,1 -->
  <rect x="520" y="320" width="400" height="30" fill="#D1FAE5"/>
  <text x="580" y="340" font-family="'Nanum Gothic', 'Apple SD Gothic Neo', sans-serif" font-size="13" fill="#1E293B" text-anchor="middle">0</text>
  <text x="660" y="340" font-family="'Nanum Gothic', 'Apple SD Gothic Neo', sans-serif" font-size="13" fill="#1E293B" text-anchor="middle">1</text>
  <text x="750" y="340" font-family="'Nanum Gothic', 'Apple SD Gothic Neo', sans-serif" font-size="13" fill="#475569" text-anchor="middle">1 > 0.5</text>
  <circle cx="850" cy="335" r="10" fill="#10B981" opacity="0.15"/>
  <text x="850" y="340" font-family="'Nanum Gothic', 'Apple SD Gothic Neo', sans-serif" font-size="13" font-weight="bold" fill="#10B981" text-anchor="middle">1</text>

  <!-- Row 3: 1,0 -->
  <rect x="520" y="350" width="400" height="30" fill="#D1FAE5"/>
  <text x="580" y="370" font-family="'Nanum Gothic', 'Apple SD Gothic Neo', sans-serif" font-size="13" fill="#1E293B" text-anchor="middle">1</text>
  <text x="660" y="370" font-family="'Nanum Gothic', 'Apple SD Gothic Neo', sans-serif" font-size="13" fill="#1E293B" text-anchor="middle">0</text>
  <text x="750" y="370" font-family="'Nanum Gothic', 'Apple SD Gothic Neo', sans-serif" font-size="13" fill="#475569" text-anchor="middle">1 > 0.5</text>
  <circle cx="850" cy="365" r="10" fill="#10B981" opacity="0.15"/>
  <text x="850" y="370" font-family="'Nanum Gothic', 'Apple SD Gothic Neo', sans-serif" font-size="13" font-weight="bold" fill="#10B981" text-anchor="middle">1</text>

  <!-- Row 4: 1,1 -->
  <rect x="520" y="383" width="400" height="30" fill="#D1FAE5"/>
  <text x="580" y="403" font-family="'Nanum Gothic', 'Apple SD Gothic Neo', sans-serif" font-size="13" fill="#1E293B" text-anchor="middle">1</text>
  <text x="660" y="403" font-family="'Nanum Gothic', 'Apple SD Gothic Neo', sans-serif" font-size="13" fill="#1E293B" text-anchor="middle">1</text>
  <text x="750" y="403" font-family="'Nanum Gothic', 'Apple SD Gothic Neo', sans-serif" font-size="13" fill="#475569" text-anchor="middle">2 > 0.5</text>
  <circle cx="850" cy="398" r="10" fill="#10B981" opacity="0.15"/>
  <text x="850" y="403" font-family="'Nanum Gothic', 'Apple SD Gothic Neo', sans-serif" font-size="13" font-weight="bold" fill="#10B981" text-anchor="middle">1</text>

  <!-- Checkmark -->
  <text x="720" y="440" font-family="'Nanum Gothic', 'Apple SD Gothic Neo', sans-serif" font-size="14" font-weight="bold" fill="#10B981" text-anchor="middle">하나라도 1이면 출력 1!</text>

  <!-- Bottom key insight -->
  <rect x="120" y="470" width="720" height="55" rx="12" fill="#E0E7FF" stroke="#4F46E5" stroke-width="1.5" filter="url(#shadow2)"/>
  <text x="480" y="495" font-family="'Nanum Gothic', 'Apple SD Gothic Neo', sans-serif" font-size="15" font-weight="bold" fill="#3730A3" text-anchor="middle">핵심: 가중치는 같고, 임계값만 다르다!</text>
  <text x="480" y="515" font-family="'Nanum Gothic', 'Apple SD Gothic Neo', sans-serif" font-size="13" fill="#475569" text-anchor="middle">AND: 임계값 = 1.5 (둘 다 넘어야)  |  OR: 임계값 = 0.5 (하나만 넘어도)</text>
</svg>