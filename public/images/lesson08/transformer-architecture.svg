<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" font-family="'Nanum Gothic', 'Apple SD Gothic Neo', sans-serif">
  <style>@import url("https://fonts.googleapis.com/css2?family=Nanum+Gothic:wght@400;700&amp;display=swap");</style>
  <rect width="800" height="450" rx="16" fill="#1a1b26" opacity="0.95"/>

  <text x="400" y="30" text-anchor="middle" fill="#e2e8f0" font-size="18" font-weight="700">트랜스포머 아키텍처 (간략)</text>
  <text x="400" y="50" text-anchor="middle" fill="#94a3b8" font-size="12">"Attention Is All You Need" (2017) 의 핵심 구조</text>

  <!-- Input tokens at bottom -->
  <text x="400" y="430" text-anchor="middle" fill="#94a3b8" font-size="11">입력: "오늘 점심에 나는"</text>

  <rect x="170" y="385" width="55" height="28" rx="6" fill="rgba(129,140,248,0.3)" stroke="#818cf8" stroke-width="1"/>
  <text x="197" y="404" text-anchor="middle" fill="#c7d2fe" font-size="11">오늘</text>

  <rect x="240" y="385" width="65" height="28" rx="6" fill="rgba(129,140,248,0.3)" stroke="#818cf8" stroke-width="1"/>
  <text x="272" y="404" text-anchor="middle" fill="#c7d2fe" font-size="11">점심에</text>

  <rect x="320" y="385" width="55" height="28" rx="6" fill="rgba(129,140,248,0.3)" stroke="#818cf8" stroke-width="1"/>
  <text x="347" y="404" text-anchor="middle" fill="#c7d2fe" font-size="11">나는</text>

  <!-- Step 1: Embedding -->
  <rect x="140" y="330" width="260" height="40" rx="8" fill="rgba(139,92,246,0.15)" stroke="#8b5cf6" stroke-width="1.5"/>
  <text x="270" y="346" text-anchor="middle" fill="#c4b5fd" font-size="11" font-weight="600">1. 임베딩 + 위치 인코딩</text>
  <text x="270" y="362" text-anchor="middle" fill="#94a3b8" font-size="9">단어 -> 숫자 벡터 + 순서 정보</text>

  <!-- Arrows up from tokens to embedding -->
  <line x1="197" y1="385" x2="220" y2="370" stroke="#8b5cf6" stroke-width="1" opacity="0.5"/>
  <line x1="272" y1="385" x2="270" y2="370" stroke="#8b5cf6" stroke-width="1" opacity="0.5"/>
  <line x1="347" y1="385" x2="320" y2="370" stroke="#8b5cf6" stroke-width="1" opacity="0.5"/>

  <!-- Step 2: Multi-Head Attention -->
  <rect x="100" y="240" width="340" height="75" rx="10" fill="rgba(245,158,11,0.1)" stroke="#f59e0b" stroke-width="2"/>
  <text x="270" y="262" text-anchor="middle" fill="#fcd34d" font-size="12" font-weight="700">2. 멀티헤드 어텐션</text>
  <text x="270" y="280" text-anchor="middle" fill="#94a3b8" font-size="10">여러 관점에서 동시에 단어 간 관련성 계산</text>

  <!-- Mini attention heads -->
  <rect x="120" y="290" width="50" height="18" rx="4" fill="rgba(245,158,11,0.2)" stroke="#f59e0b" stroke-width="0.8"/>
  <text x="145" y="303" text-anchor="middle" fill="#fcd34d" font-size="8">문법</text>
  <rect x="180" y="290" width="50" height="18" rx="4" fill="rgba(16,185,129,0.2)" stroke="#10b981" stroke-width="0.8"/>
  <text x="205" y="303" text-anchor="middle" fill="#6ee7b7" font-size="8">의미</text>
  <rect x="240" y="290" width="50" height="18" rx="4" fill="rgba(139,92,246,0.2)" stroke="#8b5cf6" stroke-width="0.8"/>
  <text x="265" y="303" text-anchor="middle" fill="#c4b5fd" font-size="8">맥락</text>
  <rect x="300" y="290" width="50" height="18" rx="4" fill="rgba(79,70,229,0.2)" stroke="#4f46e5" stroke-width="0.8"/>
  <text x="325" y="303" text-anchor="middle" fill="#a5b4fc" font-size="8">관계</text>
  <rect x="360" y="290" width="60" height="18" rx="4" fill="rgba(129,140,248,0.1)" stroke="#818cf8" stroke-width="0.8" opacity="0.5"/>
  <text x="390" y="303" text-anchor="middle" fill="#94a3b8" font-size="8">...x96</text>

  <!-- Arrow -->
  <line x1="270" y1="330" x2="270" y2="315" stroke="#f59e0b" stroke-width="1.5"/>
  <polygon points="265,317 270,310 275,317" fill="#f59e0b"/>

  <!-- Step 3: Feed Forward -->
  <rect x="140" y="190" width="260" height="38" rx="8" fill="rgba(16,185,129,0.12)" stroke="#10b981" stroke-width="1.5"/>
  <text x="270" y="206" text-anchor="middle" fill="#6ee7b7" font-size="11" font-weight="600">3. 피드포워드 신경망</text>
  <text x="270" y="222" text-anchor="middle" fill="#94a3b8" font-size="9">비선형 변환 (ReLU 활성화)</text>

  <line x1="270" y1="240" x2="270" y2="228" stroke="#10b981" stroke-width="1.5"/>
  <polygon points="265,230 270,223 275,230" fill="#10b981"/>

  <!-- Repeat bracket -->
  <rect x="85" y="185" width="370" height="140" rx="12" fill="none" stroke="#475569" stroke-width="1" stroke-dasharray="5,4" opacity="0.4"/>
  <text x="460" y="260" fill="#94a3b8" font-size="10" font-weight="600">x 96층</text>
  <text x="460" y="275" fill="#94a3b8" font-size="9">반복!</text>

  <!-- Step 4: Output -->
  <rect x="140" y="120" width="260" height="50" rx="8" fill="rgba(79,70,229,0.15)" stroke="#4f46e5" stroke-width="1.5"/>
  <text x="270" y="140" text-anchor="middle" fill="#a5b4fc" font-size="11" font-weight="600">4. 확률 출력 (소프트맥스)</text>
  <text x="270" y="158" text-anchor="middle" fill="#94a3b8" font-size="9">모든 단어에 대한 확률 계산</text>

  <line x1="270" y1="190" x2="270" y2="170" stroke="#4f46e5" stroke-width="1.5"/>
  <polygon points="265,172 270,165 275,172" fill="#4f46e5"/>

  <!-- Predicted word -->
  <rect x="195" y="75" width="150" height="35" rx="8" fill="rgba(16,185,129,0.25)" stroke="#10b981" stroke-width="2"/>
  <text x="270" y="90" text-anchor="middle" fill="#6ee7b7" font-size="10">예측 결과</text>
  <text x="270" y="105" text-anchor="middle" fill="#10b981" font-size="14" font-weight="700">"밥" (35%)</text>

  <line x1="270" y1="120" x2="270" y2="110" stroke="#10b981" stroke-width="1.5"/>
  <polygon points="265,112 270,105 275,112" fill="#10b981"/>

  <!-- Right side: Key innovations -->
  <rect x="510" y="70" width="270" height="300" rx="12" fill="rgba(79,70,229,0.06)" stroke="#4f46e5" stroke-width="1" stroke-opacity="0.3"/>
  <text x="645" y="95" text-anchor="middle" fill="#e2e8f0" font-size="13" font-weight="700">핵심 혁신</text>

  <rect x="525" y="110" width="240" height="55" rx="8" fill="rgba(245,158,11,0.08)" stroke="#f59e0b" stroke-width="1"/>
  <text x="645" y="130" text-anchor="middle" fill="#fcd34d" font-size="11" font-weight="600">병렬 처리</text>
  <text x="645" y="148" text-anchor="middle" fill="#94a3b8" font-size="10">모든 단어를 동시에 처리</text>
  <text x="645" y="160" text-anchor="middle" fill="#94a3b8" font-size="9">(RNN: 순서대로 -> 느림)</text>

  <rect x="525" y="175" width="240" height="55" rx="8" fill="rgba(16,185,129,0.08)" stroke="#10b981" stroke-width="1"/>
  <text x="645" y="195" text-anchor="middle" fill="#6ee7b7" font-size="11" font-weight="600">긴 문장도 OK</text>
  <text x="645" y="213" text-anchor="middle" fill="#94a3b8" font-size="10">어텐션으로 멀리 있는 단어도</text>
  <text x="645" y="225" text-anchor="middle" fill="#94a3b8" font-size="9">직접 연결 (정보 손실 없음)</text>

  <rect x="525" y="240" width="240" height="55" rx="8" fill="rgba(139,92,246,0.08)" stroke="#8b5cf6" stroke-width="1"/>
  <text x="645" y="260" text-anchor="middle" fill="#c4b5fd" font-size="11" font-weight="600">확장 가능</text>
  <text x="645" y="278" text-anchor="middle" fill="#94a3b8" font-size="10">층을 쌓을수록 더 똑똑해짐</text>
  <text x="645" y="290" text-anchor="middle" fill="#94a3b8" font-size="9">GPT-4: 수천억 파라미터</text>

  <rect x="525" y="310" width="240" height="45" rx="8" fill="rgba(79,70,229,0.1)" stroke="#4f46e5" stroke-width="1"/>
  <text x="645" y="330" text-anchor="middle" fill="#a5b4fc" font-size="11" font-weight="600">2017 -> 2024</text>
  <text x="645" y="348" text-anchor="middle" fill="#94a3b8" font-size="10">이 구조 하나로 AI 혁명 시작!</text>
</svg>