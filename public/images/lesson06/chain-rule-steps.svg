<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520">
  <style>@import url("https://fonts.googleapis.com/css2?family=Nanum+Gothic:wght@400;700&amp;display=swap");</style>
  <defs>
    <linearGradient id="bg2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FAFBFF;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#F0F4FF;stop-opacity:1"/>
    </linearGradient>
    <marker id="chain-arrow" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#4F46E5"/>
    </marker>
    <filter id="sh2">
      <feDropShadow dx="1" dy="2" stdDeviation="3" flood-color="#000" flood-opacity="0.08"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="900" height="520" fill="url(#bg2)" rx="12"/>

  <!-- Title -->
  <text x="450" y="40" font-family="'Nanum Gothic', 'Apple SD Gothic Neo', sans-serif" font-size="22" font-weight="bold" fill="#1E293B" text-anchor="middle">연쇄법칙: 단계별 곱하기</text>
  <text x="450" y="62" font-family="'Nanum Gothic', 'Apple SD Gothic Neo', sans-serif" font-size="13" fill="#475569" text-anchor="middle">dE/dw₁ = 각 단계의 변화율을 차례로 곱한다</text>

  <!-- Chain of boxes -->
  <!-- Step 1: dE/dŷ -->
  <rect x="30" y="90" width="150" height="100" rx="12" fill="white" stroke="#EF4444" stroke-width="2" filter="url(#sh2)"/>
  <rect x="30" y="90" width="150" height="28" rx="12" fill="#EF4444"/>
  <rect x="30" y="106" width="150" height="12" fill="#EF4444"/>
  <text x="105" y="110" font-family="'Nanum Gothic', 'Apple SD Gothic Neo', sans-serif" font-size="11" font-weight="bold" fill="white" text-anchor="middle">Step 1</text>
  <text x="105" y="140" font-family="'Nanum Gothic', 'Apple SD Gothic Neo', sans-serif" font-size="12" font-weight="bold" fill="#1E293B" text-anchor="middle">dE/dŷ</text>
  <text x="105" y="158" font-family="'Nanum Gothic', 'Apple SD Gothic Neo', sans-serif" font-size="10" fill="#475569" text-anchor="middle">오차 변화율</text>
  <text x="105" y="178" font-family="'Nanum Gothic', 'Apple SD Gothic Neo', sans-serif" font-size="16" font-weight="bold" fill="#EF4444" text-anchor="middle">−0.736</text>

  <!-- Multiply sign -->
  <text x="200" y="148" font-family="Georgia, serif" font-size="24" fill="#4F46E5" text-anchor="middle" font-weight="bold">×</text>

  <!-- Step 2: dŷ/dz2 -->
  <rect x="220" y="90" width="150" height="100" rx="12" fill="white" stroke="#F59E0B" stroke-width="2" filter="url(#sh2)"/>
  <rect x="220" y="90" width="150" height="28" rx="12" fill="#F59E0B"/>
  <rect x="220" y="106" width="150" height="12" fill="#F59E0B"/>
  <text x="295" y="110" font-family="'Nanum Gothic', 'Apple SD Gothic Neo', sans-serif" font-size="11" font-weight="bold" fill="white" text-anchor="middle">Step 2</text>
  <text x="295" y="140" font-family="'Nanum Gothic', 'Apple SD Gothic Neo', sans-serif" font-size="12" font-weight="bold" fill="#1E293B" text-anchor="middle">dŷ/dz₂</text>
  <text x="295" y="158" font-family="'Nanum Gothic', 'Apple SD Gothic Neo', sans-serif" font-size="10" fill="#475569" text-anchor="middle">Sigmoid 미분</text>
  <text x="295" y="178" font-family="'Nanum Gothic', 'Apple SD Gothic Neo', sans-serif" font-size="16" font-weight="bold" fill="#F59E0B" text-anchor="middle">0.233</text>

  <!-- Multiply sign -->
  <text x="390" y="148" font-family="Georgia, serif" font-size="24" fill="#4F46E5" text-anchor="middle" font-weight="bold">×</text>

  <!-- Step 3: dz2/da1 -->
  <rect x="410" y="90" width="150" height="100" rx="12" fill="white" stroke="#8B5CF6" stroke-width="2" filter="url(#sh2)"/>
  <rect x="410" y="90" width="150" height="28" rx="12" fill="#8B5CF6"/>
  <rect x="410" y="106" width="150" height="12" fill="#8B5CF6"/>
  <text x="485" y="110" font-family="'Nanum Gothic', 'Apple SD Gothic Neo', sans-serif" font-size="11" font-weight="bold" fill="white" text-anchor="middle">Step 3</text>
  <text x="485" y="140" font-family="'Nanum Gothic', 'Apple SD Gothic Neo', sans-serif" font-size="12" font-weight="bold" fill="#1E293B" text-anchor="middle">dz₂/da₁</text>
  <text x="485" y="158" font-family="'Nanum Gothic', 'Apple SD Gothic Neo', sans-serif" font-size="10" fill="#475569" text-anchor="middle">출력 가중치 w₃</text>
  <text x="485" y="178" font-family="'Nanum Gothic', 'Apple SD Gothic Neo', sans-serif" font-size="16" font-weight="bold" fill="#8B5CF6" text-anchor="middle">0.5</text>

  <!-- Multiply sign -->
  <text x="580" y="148" font-family="Georgia, serif" font-size="24" fill="#4F46E5" text-anchor="middle" font-weight="bold">×</text>

  <!-- Step 4: da1/dz1 -->
  <rect x="600" y="90" width="150" height="100" rx="12" fill="white" stroke="#10B981" stroke-width="2" filter="url(#sh2)"/>
  <rect x="600" y="90" width="150" height="28" rx="12" fill="#10B981"/>
  <rect x="600" y="106" width="150" height="12" fill="#10B981"/>
  <text x="675" y="110" font-family="'Nanum Gothic', 'Apple SD Gothic Neo', sans-serif" font-size="11" font-weight="bold" fill="white" text-anchor="middle">Step 4</text>
  <text x="675" y="140" font-family="'Nanum Gothic', 'Apple SD Gothic Neo', sans-serif" font-size="12" font-weight="bold" fill="#1E293B" text-anchor="middle">da₁/dz₁</text>
  <text x="675" y="158" font-family="'Nanum Gothic', 'Apple SD Gothic Neo', sans-serif" font-size="10" fill="#475569" text-anchor="middle">Sigmoid 미분</text>
  <text x="675" y="178" font-family="'Nanum Gothic', 'Apple SD Gothic Neo', sans-serif" font-size="16" font-weight="bold" fill="#10B981" text-anchor="middle">0.218</text>

  <!-- Multiply sign -->
  <text x="770" y="148" font-family="Georgia, serif" font-size="24" fill="#4F46E5" text-anchor="middle" font-weight="bold">×</text>

  <!-- Step 5: dz1/dw1 -->
  <rect x="790" y="90" width="90" height="100" rx="12" fill="white" stroke="#4F46E5" stroke-width="2" filter="url(#sh2)"/>
  <rect x="790" y="90" width="90" height="28" rx="12" fill="#4F46E5"/>
  <rect x="790" y="106" width="90" height="12" fill="#4F46E5"/>
  <text x="835" y="110" font-family="'Nanum Gothic', 'Apple SD Gothic Neo', sans-serif" font-size="11" font-weight="bold" fill="white" text-anchor="middle">Step 5</text>
  <text x="835" y="140" font-family="'Nanum Gothic', 'Apple SD Gothic Neo', sans-serif" font-size="12" font-weight="bold" fill="#1E293B" text-anchor="middle">dz₁/dw₁</text>
  <text x="835" y="158" font-family="'Nanum Gothic', 'Apple SD Gothic Neo', sans-serif" font-size="10" fill="#475569" text-anchor="middle">입력 x₁</text>
  <text x="835" y="178" font-family="'Nanum Gothic', 'Apple SD Gothic Neo', sans-serif" font-size="16" font-weight="bold" fill="#4F46E5" text-anchor="middle">1.0</text>

  <!-- Result arrow -->
  <line x1="100" y1="210" x2="100" y2="250" stroke="#4F46E5" stroke-width="2"/>
  <line x1="100" y1="250" x2="800" y2="250" stroke="#4F46E5" stroke-width="2"/>
  <line x1="800" y1="250" x2="800" y2="210" stroke="#4F46E5" stroke-width="2"/>
  <line x1="450" y1="250" x2="450" y2="280" stroke="#4F46E5" stroke-width="3" marker-end="url(#chain-arrow)"/>

  <!-- Result box -->
  <rect x="200" y="290" width="500" height="70" rx="16" fill="#4F46E5" filter="url(#sh2)"/>
  <text x="450" y="318" font-family="'Nanum Gothic', 'Apple SD Gothic Neo', sans-serif" font-size="14" fill="#C7D2FE" text-anchor="middle">dE/dw₁ = (−0.736) × 0.233 × 0.5 × 0.218 × 1.0</text>
  <text x="450" y="345" font-family="'Nanum Gothic', 'Apple SD Gothic Neo', sans-serif" font-size="22" font-weight="bold" fill="white" text-anchor="middle">= −0.0187</text>

  <!-- Analogy section -->
  <rect x="50" y="385" width="800" height="120" rx="12" fill="white" stroke="#C7D2FE" stroke-width="1.5" filter="url(#sh2)"/>
  <text x="450" y="410" font-family="'Nanum Gothic', 'Apple SD Gothic Neo', sans-serif" font-size="14" font-weight="bold" fill="#4F46E5" text-anchor="middle">비유: 도미노 효과</text>

  <!-- Domino icons -->
  <rect x="120" y="425" width="30" height="50" rx="4" fill="#EF4444" transform="rotate(-15, 135, 450)"/>
  <text x="135" y="455" font-family="'Nanum Gothic', 'Apple SD Gothic Neo', sans-serif" font-size="8" fill="white" text-anchor="middle" transform="rotate(-15, 135, 450)">오차</text>

  <rect x="220" y="425" width="30" height="50" rx="4" fill="#F59E0B" transform="rotate(-10, 235, 450)"/>
  <text x="235" y="455" font-family="'Nanum Gothic', 'Apple SD Gothic Neo', sans-serif" font-size="7" fill="white" text-anchor="middle" transform="rotate(-10, 235, 450)">sigmoid</text>

  <rect x="320" y="425" width="30" height="50" rx="4" fill="#8B5CF6" transform="rotate(-5, 335, 450)"/>
  <text x="335" y="455" font-family="'Nanum Gothic', 'Apple SD Gothic Neo', sans-serif" font-size="8" fill="white" text-anchor="middle" transform="rotate(-5, 335, 450)">w₃</text>

  <rect x="420" y="428" width="30" height="50" rx="4" fill="#10B981" transform="rotate(-2, 435, 453)"/>
  <text x="435" y="458" font-family="'Nanum Gothic', 'Apple SD Gothic Neo', sans-serif" font-size="7" fill="white" text-anchor="middle" transform="rotate(-2, 435, 453)">sigmoid</text>

  <rect x="520" y="430" width="30" height="50" rx="4" fill="#4F46E5"/>
  <text x="535" y="460" font-family="'Nanum Gothic', 'Apple SD Gothic Neo', sans-serif" font-size="8" fill="white" text-anchor="middle">x₁</text>

  <text x="700" y="455" font-family="'Nanum Gothic', 'Apple SD Gothic Neo', sans-serif" font-size="12" fill="#475569" text-anchor="middle">각 단계의 영향이</text>
  <text x="700" y="475" font-family="'Nanum Gothic', 'Apple SD Gothic Neo', sans-serif" font-size="12" font-weight="bold" fill="#4F46E5" text-anchor="middle">차례로 전달됩니다</text>
</svg>