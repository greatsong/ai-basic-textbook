<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" font-family="system-ui, -apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif">
  <rect width="800" height="400" rx="16" fill="#1a1b26" opacity="0.95"/>

  <text x="400" y="30" text-anchor="middle" fill="#e2e8f0" font-size="18" font-weight="700">역전파 (Backpropagation)</text>
  <text x="400" y="50" text-anchor="middle" fill="#ef4444" font-size="13" font-weight="600">출력 &#x2190; 은닉층 &#x2190; 입력 (오차가 뒤로 흐름)</text>

  <defs>
    <marker id="backArrow" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 10 0 L 0 5 L 10 10 z" fill="#ef4444"/>
    </marker>
  </defs>

  <!-- Input layer -->
  <text x="120" y="80" text-anchor="middle" fill="#818cf8" font-size="13" font-weight="600">입력층</text>

  <!-- Input node 1 -->
  <circle cx="120" cy="140" r="30" fill="rgba(129,140,248,0.2)" stroke="#818cf8" stroke-width="2"/>
  <text x="120" y="136" text-anchor="middle" fill="#c7d2fe" font-size="12" font-weight="600">x&#x2081;</text>
  <text x="120" y="152" text-anchor="middle" fill="#818cf8" font-size="11">= 1.0</text>

  <!-- Input node 2 -->
  <circle cx="120" cy="260" r="30" fill="rgba(129,140,248,0.2)" stroke="#818cf8" stroke-width="2"/>
  <text x="120" y="256" text-anchor="middle" fill="#c7d2fe" font-size="12" font-weight="600">x&#x2082;</text>
  <text x="120" y="272" text-anchor="middle" fill="#818cf8" font-size="11">= 0.5</text>

  <!-- Hidden layer -->
  <text x="380" y="80" text-anchor="middle" fill="#10b981" font-size="13" font-weight="600">은닉층</text>

  <!-- Hidden node -->
  <circle cx="380" cy="200" r="35" fill="rgba(16,185,129,0.2)" stroke="#10b981" stroke-width="2"/>
  <text x="380" y="197" text-anchor="middle" fill="#6ee7b7" font-size="12">a&#x2081;</text>
  <text x="380" y="214" text-anchor="middle" fill="#10b981" font-size="11">= 0.679</text>

  <!-- Output layer -->
  <text x="640" y="80" text-anchor="middle" fill="#f59e0b" font-size="13" font-weight="600">출력층</text>

  <!-- Output node -->
  <circle cx="640" cy="200" r="35" fill="rgba(245,158,11,0.2)" stroke="#f59e0b" stroke-width="2"/>
  <text x="640" y="197" text-anchor="middle" fill="#fcd34d" font-size="12">&#x177;</text>
  <text x="640" y="214" text-anchor="middle" fill="#f59e0b" font-size="11">= 0.632</text>

  <!-- Error annotation at output -->
  <rect x="690" y="170" width="100" height="55" rx="8" fill="rgba(239,68,68,0.2)" stroke="#ef4444" stroke-width="1.5"/>
  <text x="740" y="190" text-anchor="middle" fill="#fca5a5" font-size="11" font-weight="600">정답: 1.0</text>
  <text x="740" y="210" text-anchor="middle" fill="#ef4444" font-size="13" font-weight="700">오차 = 0.135</text>

  <!-- Backward arrows (RED, dashed, right to left) -->
  <!-- Output to hidden (w3 gradient) -->
  <line x1="605" y1="195" x2="420" y2="195" stroke="#ef4444" stroke-width="2.5" stroke-dasharray="6,4" marker-end="url(#backArrow)" opacity="0.9"/>
  <rect x="475" y="168" width="80" height="22" rx="4" fill="rgba(239,68,68,0.15)"/>
  <text x="515" y="183" text-anchor="middle" fill="#fca5a5" font-size="10" font-weight="600">&#x2202;E/&#x2202;w&#x2083;</text>

  <!-- Hidden to x1 (w1 gradient) -->
  <line x1="345" y1="190" x2="155" y2="145" stroke="#ef4444" stroke-width="2" stroke-dasharray="6,4" marker-end="url(#backArrow)" opacity="0.7"/>
  <rect x="210" y="148" width="80" height="22" rx="4" fill="rgba(239,68,68,0.15)"/>
  <text x="250" y="163" text-anchor="middle" fill="#fca5a5" font-size="10" font-weight="600">&#x2202;E/&#x2202;w&#x2081;</text>

  <!-- Hidden to x2 (w2 gradient) -->
  <line x1="345" y1="210" x2="155" y2="255" stroke="#ef4444" stroke-width="2" stroke-dasharray="6,4" marker-end="url(#backArrow)" opacity="0.7"/>
  <rect x="210" y="238" width="80" height="22" rx="4" fill="rgba(239,68,68,0.15)"/>
  <text x="250" y="253" text-anchor="middle" fill="#fca5a5" font-size="10" font-weight="600">&#x2202;E/&#x2202;w&#x2082;</text>

  <!-- Weight update boxes -->
  <rect x="40" y="310" width="230" height="75" rx="10" fill="rgba(16,185,129,0.1)" stroke="#10b981" stroke-width="1"/>
  <text x="155" y="332" text-anchor="middle" fill="#6ee7b7" font-size="12" font-weight="600">가중치 업데이트</text>
  <text x="155" y="352" text-anchor="middle" fill="#94a3b8" font-size="11">w&#x2081;: 0.300 &#x2192; 0.309</text>
  <text x="155" y="368" text-anchor="middle" fill="#94a3b8" font-size="11">w&#x2082;: 0.700 &#x2192; 0.705</text>

  <rect x="290" y="310" width="220" height="75" rx="10" fill="rgba(245,158,11,0.1)" stroke="#f59e0b" stroke-width="1"/>
  <text x="400" y="332" text-anchor="middle" fill="#fcd34d" font-size="12" font-weight="600">가중치 업데이트</text>
  <text x="400" y="352" text-anchor="middle" fill="#94a3b8" font-size="11">w&#x2083;: 0.500 &#x2192; 0.516</text>
  <text x="400" y="368" text-anchor="middle" fill="#94a3b8" font-size="11">오차를 줄이는 방향!</text>

  <!-- Key insight box -->
  <rect x="530" y="310" width="240" height="75" rx="10" fill="rgba(239,68,68,0.1)" stroke="#ef4444" stroke-width="1"/>
  <text x="650" y="332" text-anchor="middle" fill="#fca5a5" font-size="12" font-weight="600">핵심 원리</text>
  <text x="650" y="352" text-anchor="middle" fill="#94a3b8" font-size="11">출력의 오차를 각 가중치에</text>
  <text x="650" y="368" text-anchor="middle" fill="#94a3b8" font-size="11">"얼마나 책임이 있는지" 분배</text>
</svg>