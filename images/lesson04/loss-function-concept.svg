<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500">
  <style>@import url("https://fonts.googleapis.com/css2?family=Nanum+Gothic:wght@400;700&amp;display=swap");</style>
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FAFBFF"/>
      <stop offset="100%" stop-color="#F0F4FF"/>
    </linearGradient>
    <linearGradient id="cardGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#E0E7FF"/>
      <stop offset="100%" stop-color="#C7D2FE"/>
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="2" dy="3" stdDeviation="4" flood-color="#000" flood-opacity="0.1"/>
    </filter>
    <marker id="arrowRight" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#4F46E5"/>
    </marker>
  </defs>
  <rect width="900" height="500" fill="url(#bgGrad)" rx="16"/>

  <!-- Title -->
  <text x="450" y="45" text-anchor="middle" font-family="'Nanum Gothic', 'Apple SD Gothic Neo', sans-serif" font-size="24" font-weight="bold" fill="#1E293B">손실함수(Loss Function)의 개념</text>

  <!-- Input: Real Data -->
  <rect x="30" y="80" width="160" height="120" rx="14" fill="#E0E7FF" stroke="#4F46E5" stroke-width="2" filter="url(#shadow)"/>
  <text x="110" y="115" text-anchor="middle" font-family="'Nanum Gothic', 'Apple SD Gothic Neo', sans-serif" font-size="15" font-weight="bold" fill="#4F46E5">실제값 (y)</text>
  <text x="110" y="145" text-anchor="middle" font-family="'Nanum Gothic', 'Apple SD Gothic Neo', sans-serif" font-size="28" font-weight="bold" fill="#1E293B">4, 5, 8</text>
  <text x="110" y="178" text-anchor="middle" font-family="'Nanum Gothic', 'Apple SD Gothic Neo', sans-serif" font-size="12" fill="#475569">관측된 데이터</text>

  <!-- Arrow 1 -->
  <line x1="200" y1="140" x2="255" y2="140" stroke="#4F46E5" stroke-width="2.5" marker-end="url(#arrowRight)"/>

  <!-- Model Prediction -->
  <rect x="265" y="80" width="160" height="120" rx="14" fill="#C7D2FE" stroke="#818CF8" stroke-width="2" filter="url(#shadow)"/>
  <text x="345" y="115" text-anchor="middle" font-family="'Nanum Gothic', 'Apple SD Gothic Neo', sans-serif" font-size="15" font-weight="bold" fill="#3730A3">예측값 (y&#x302;)</text>
  <text x="345" y="145" text-anchor="middle" font-family="'Nanum Gothic', 'Apple SD Gothic Neo', sans-serif" font-size="28" font-weight="bold" fill="#1E293B">3, 5, 7</text>
  <text x="345" y="178" text-anchor="middle" font-family="'Nanum Gothic', 'Apple SD Gothic Neo', sans-serif" font-size="12" fill="#475569">모델이 계산한 값</text>

  <!-- Arrow 2 -->
  <line x1="435" y1="140" x2="490" y2="140" stroke="#4F46E5" stroke-width="2.5" marker-end="url(#arrowRight)"/>

  <!-- Error Calculation -->
  <rect x="500" y="80" width="170" height="120" rx="14" fill="#FEF3C7" stroke="#F59E0B" stroke-width="2" filter="url(#shadow)"/>
  <text x="585" y="110" text-anchor="middle" font-family="'Nanum Gothic', 'Apple SD Gothic Neo', sans-serif" font-size="14" font-weight="bold" fill="#F59E0B">오차 계산</text>
  <text x="585" y="138" text-anchor="middle" font-family="'Nanum Gothic', 'Apple SD Gothic Neo', sans-serif" font-size="16" fill="#1E293B">(4-3)=1, (5-5)=0</text>
  <text x="585" y="162" text-anchor="middle" font-family="'Nanum Gothic', 'Apple SD Gothic Neo', sans-serif" font-size="16" fill="#1E293B">(8-7)=1</text>
  <text x="585" y="188" text-anchor="middle" font-family="'Nanum Gothic', 'Apple SD Gothic Neo', sans-serif" font-size="12" fill="#475569">실제 - 예측</text>

  <!-- Arrow 3 -->
  <line x1="680" y1="140" x2="720" y2="140" stroke="#4F46E5" stroke-width="2.5" marker-end="url(#arrowRight)"/>

  <!-- Loss Value -->
  <rect x="730" y="70" width="150" height="140" rx="20" fill="#4F46E5" filter="url(#shadow)"/>
  <text x="805" y="110" text-anchor="middle" font-family="'Nanum Gothic', 'Apple SD Gothic Neo', sans-serif" font-size="14" font-weight="bold" fill="#C7D2FE">손실값</text>
  <text x="805" y="155" text-anchor="middle" font-family="'Nanum Gothic', 'Apple SD Gothic Neo', sans-serif" font-size="44" font-weight="bold" fill="#FFFFFF">0.67</text>
  <text x="805" y="190" text-anchor="middle" font-family="'Nanum Gothic', 'Apple SD Gothic Neo', sans-serif" font-size="12" fill="#C7D2FE">숫자 하나로 요약!</text>

  <!-- Bottom: MSE Steps -->
  <rect x="30" y="240" width="840" height="240" rx="14" fill="white" stroke="#E0E7FF" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="450" y="275" text-anchor="middle" font-family="'Nanum Gothic', 'Apple SD Gothic Neo', sans-serif" font-size="18" font-weight="bold" fill="#3730A3">MSE(평균제곱오차) 4단계</text>

  <!-- Step 1 -->
  <circle cx="100" cy="345" r="30" fill="#4F46E5"/>
  <text x="100" y="352" text-anchor="middle" font-family="'Nanum Gothic', 'Apple SD Gothic Neo', sans-serif" font-size="20" font-weight="bold" fill="white">1</text>
  <text x="100" y="395" text-anchor="middle" font-family="'Nanum Gothic', 'Apple SD Gothic Neo', sans-serif" font-size="13" font-weight="bold" fill="#3730A3">오차 계산</text>
  <text x="100" y="415" text-anchor="middle" font-family="'Nanum Gothic', 'Apple SD Gothic Neo', sans-serif" font-size="12" fill="#475569">예측 - 실제</text>
  <text x="100" y="435" text-anchor="middle" font-family="'Nanum Gothic', 'Apple SD Gothic Neo', sans-serif" font-size="15" font-weight="bold" fill="#1E293B">1, 0, 1</text>

  <!-- Arrow -->
  <line x1="150" y1="345" x2="210" y2="345" stroke="#818CF8" stroke-width="2" marker-end="url(#arrowRight)"/>

  <!-- Step 2 -->
  <circle cx="280" cy="345" r="30" fill="#818CF8"/>
  <text x="280" y="352" text-anchor="middle" font-family="'Nanum Gothic', 'Apple SD Gothic Neo', sans-serif" font-size="20" font-weight="bold" fill="white">2</text>
  <text x="280" y="395" text-anchor="middle" font-family="'Nanum Gothic', 'Apple SD Gothic Neo', sans-serif" font-size="13" font-weight="bold" fill="#3730A3">제곱</text>
  <text x="280" y="415" text-anchor="middle" font-family="'Nanum Gothic', 'Apple SD Gothic Neo', sans-serif" font-size="12" fill="#475569">음수 방지 + 큰 오차 벌주기</text>
  <text x="280" y="435" text-anchor="middle" font-family="'Nanum Gothic', 'Apple SD Gothic Neo', sans-serif" font-size="15" font-weight="bold" fill="#1E293B">1, 0, 1</text>

  <!-- Arrow -->
  <line x1="330" y1="345" x2="390" y2="345" stroke="#818CF8" stroke-width="2" marker-end="url(#arrowRight)"/>

  <!-- Step 3 -->
  <circle cx="460" cy="345" r="30" fill="#8B5CF6"/>
  <text x="460" y="352" text-anchor="middle" font-family="'Nanum Gothic', 'Apple SD Gothic Neo', sans-serif" font-size="20" font-weight="bold" fill="white">3</text>
  <text x="460" y="395" text-anchor="middle" font-family="'Nanum Gothic', 'Apple SD Gothic Neo', sans-serif" font-size="13" font-weight="bold" fill="#3730A3">합산</text>
  <text x="460" y="415" text-anchor="middle" font-family="'Nanum Gothic', 'Apple SD Gothic Neo', sans-serif" font-size="12" fill="#475569">모두 더하기</text>
  <text x="460" y="435" text-anchor="middle" font-family="'Nanum Gothic', 'Apple SD Gothic Neo', sans-serif" font-size="15" font-weight="bold" fill="#1E293B">1+0+1 = 2</text>

  <!-- Arrow -->
  <line x1="510" y1="345" x2="570" y2="345" stroke="#818CF8" stroke-width="2" marker-end="url(#arrowRight)"/>

  <!-- Step 4 -->
  <circle cx="640" cy="345" r="30" fill="#4F46E5"/>
  <text x="640" y="352" text-anchor="middle" font-family="'Nanum Gothic', 'Apple SD Gothic Neo', sans-serif" font-size="20" font-weight="bold" fill="white">4</text>
  <text x="640" y="395" text-anchor="middle" font-family="'Nanum Gothic', 'Apple SD Gothic Neo', sans-serif" font-size="13" font-weight="bold" fill="#3730A3">평균 (1/n)</text>
  <text x="640" y="415" text-anchor="middle" font-family="'Nanum Gothic', 'Apple SD Gothic Neo', sans-serif" font-size="12" fill="#475569">데이터 수로 나누기</text>
  <text x="640" y="435" text-anchor="middle" font-family="'Nanum Gothic', 'Apple SD Gothic Neo', sans-serif" font-size="15" font-weight="bold" fill="#1E293B">2/3 = 0.67</text>

  <!-- Final Arrow -->
  <line x1="690" y1="345" x2="730" y2="345" stroke="#4F46E5" stroke-width="2.5" marker-end="url(#arrowRight)"/>

  <!-- Final Result -->
  <rect x="740" y="315" width="120" height="60" rx="12" fill="#10B981"/>
  <text x="800" y="340" text-anchor="middle" font-family="'Nanum Gothic', 'Apple SD Gothic Neo', sans-serif" font-size="12" fill="#D1FAE5">MSE =</text>
  <text x="800" y="363" text-anchor="middle" font-family="'Nanum Gothic', 'Apple SD Gothic Neo', sans-serif" font-size="24" font-weight="bold" fill="white">0.67</text>
</svg>