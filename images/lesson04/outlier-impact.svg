<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500">
  <style>@import url("https://fonts.googleapis.com/css2?family=Nanum+Gothic:wght@400;700&amp;display=swap");</style>
  <defs>
    <linearGradient id="bgG" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FAFBFF"/>
      <stop offset="100%" stop-color="#F0F4FF"/>
    </linearGradient>
    <filter id="sh" x="-3%" y="-3%" width="106%" height="110%">
      <feDropShadow dx="1" dy="2" stdDeviation="3" flood-color="#000" flood-opacity="0.08"/>
    </filter>
  </defs>
  <rect width="900" height="500" fill="url(#bgG)" rx="16"/>

  <text x="450" y="40" text-anchor="middle" font-family="'Nanum Gothic', 'Apple SD Gothic Neo', sans-serif" font-size="22" font-weight="bold" fill="#1E293B">이상치(Outlier)가 MSE에 미치는 영향</text>

  <!-- LEFT: Normal case -->
  <rect x="25" y="60" width="415" height="420" rx="14" fill="white" stroke="#10B981" stroke-width="2" filter="url(#sh)"/>
  <rect x="25" y="60" width="415" height="40" rx="14" fill="#10B981"/>
  <rect x="25" y="86" width="415" height="14" fill="#10B981"/>
  <text x="232" y="86" text-anchor="middle" font-family="'Nanum Gothic', 'Apple SD Gothic Neo', sans-serif" font-size="16" font-weight="bold" fill="white">이상치 없는 경우</text>

  <!-- Chart area left -->
  <line x1="80" y1="380" x2="400" y2="380" stroke="#94A3B8" stroke-width="1.5"/>
  <line x1="80" y1="130" x2="80" y2="380" stroke="#94A3B8" stroke-width="1.5"/>
  <text x="75" y="390" font-family="'Nanum Gothic', 'Apple SD Gothic Neo', sans-serif" font-size="10" fill="#94A3B8" text-anchor="end">0</text>
  <text x="75" y="320" font-family="'Nanum Gothic', 'Apple SD Gothic Neo', sans-serif" font-size="10" fill="#94A3B8" text-anchor="end">2</text>
  <text x="75" y="255" font-family="'Nanum Gothic', 'Apple SD Gothic Neo', sans-serif" font-size="10" fill="#94A3B8" text-anchor="end">4</text>
  <text x="75" y="190" font-family="'Nanum Gothic', 'Apple SD Gothic Neo', sans-serif" font-size="10" fill="#94A3B8" text-anchor="end">6</text>
  <text x="75" y="145" font-family="'Nanum Gothic', 'Apple SD Gothic Neo', sans-serif" font-size="10" fill="#94A3B8" text-anchor="end">8</text>

  <!-- Regression line left -->
  <line x1="100" y1="340" x2="380" y2="160" stroke="#4F46E5" stroke-width="2.5" stroke-dasharray="8,4"/>

  <!-- Data points left (normal) -->
  <circle cx="140" cy="310" r="8" fill="#4F46E5"/>
  <circle cx="200" cy="280" r="8" fill="#4F46E5"/>
  <circle cx="240" cy="240" r="8" fill="#4F46E5"/>
  <circle cx="300" cy="210" r="8" fill="#4F46E5"/>
  <circle cx="360" cy="170" r="8" fill="#4F46E5"/>

  <!-- Error lines left (small) -->
  <line x1="140" y1="310" x2="140" y2="318" stroke="#EF4444" stroke-width="2"/>
  <line x1="200" y1="280" x2="200" y2="273" stroke="#EF4444" stroke-width="2"/>
  <line x1="240" y1="240" x2="240" y2="248" stroke="#EF4444" stroke-width="2"/>
  <line x1="300" y1="210" x2="300" y2="203" stroke="#EF4444" stroke-width="2"/>
  <line x1="360" y1="170" x2="360" y2="178" stroke="#EF4444" stroke-width="2"/>

  <!-- MSE result left -->
  <rect x="90" y="410" width="300" height="55" rx="10" fill="#D1FAE5" stroke="#10B981" stroke-width="1.5"/>
  <text x="240" y="435" text-anchor="middle" font-family="'Nanum Gothic', 'Apple SD Gothic Neo', sans-serif" font-size="14" fill="#1E293B">오차: 1, -1, 1, -1, 1</text>
  <text x="240" y="455" text-anchor="middle" font-family="'Nanum Gothic', 'Apple SD Gothic Neo', sans-serif" font-size="16" font-weight="bold" fill="#10B981">MSE = 1.0</text>

  <!-- RIGHT: Outlier case -->
  <rect x="460" y="60" width="415" height="420" rx="14" fill="white" stroke="#EF4444" stroke-width="2" filter="url(#sh)"/>
  <rect x="460" y="60" width="415" height="40" rx="14" fill="#EF4444"/>
  <rect x="460" y="86" width="415" height="14" fill="#EF4444"/>
  <text x="667" y="86" text-anchor="middle" font-family="'Nanum Gothic', 'Apple SD Gothic Neo', sans-serif" font-size="16" font-weight="bold" fill="white">이상치 1개 포함</text>

  <!-- Chart area right -->
  <line x1="515" y1="380" x2="835" y2="380" stroke="#94A3B8" stroke-width="1.5"/>
  <line x1="515" y1="130" x2="515" y2="380" stroke="#94A3B8" stroke-width="1.5"/>
  <text x="510" y="390" font-family="'Nanum Gothic', 'Apple SD Gothic Neo', sans-serif" font-size="10" fill="#94A3B8" text-anchor="end">0</text>
  <text x="510" y="320" font-family="'Nanum Gothic', 'Apple SD Gothic Neo', sans-serif" font-size="10" fill="#94A3B8" text-anchor="end">2</text>
  <text x="510" y="255" font-family="'Nanum Gothic', 'Apple SD Gothic Neo', sans-serif" font-size="10" fill="#94A3B8" text-anchor="end">4</text>
  <text x="510" y="190" font-family="'Nanum Gothic', 'Apple SD Gothic Neo', sans-serif" font-size="10" fill="#94A3B8" text-anchor="end">6</text>
  <text x="510" y="145" font-family="'Nanum Gothic', 'Apple SD Gothic Neo', sans-serif" font-size="10" fill="#94A3B8" text-anchor="end">8</text>

  <!-- Regression line right (tilted by outlier) -->
  <line x1="535" y1="350" x2="815" y2="190" stroke="#4F46E5" stroke-width="2.5" stroke-dasharray="8,4"/>

  <!-- Data points right -->
  <circle cx="575" cy="310" r="8" fill="#4F46E5"/>
  <circle cx="635" cy="280" r="8" fill="#4F46E5"/>
  <circle cx="675" cy="240" r="8" fill="#4F46E5"/>
  <circle cx="735" cy="210" r="8" fill="#4F46E5"/>
  <!-- Outlier! -->
  <circle cx="795" cy="370" r="12" fill="#EF4444" stroke="#EF4444" stroke-width="3"/>
  <text x="795" y="375" text-anchor="middle" font-family="'Nanum Gothic', 'Apple SD Gothic Neo', sans-serif" font-size="11" font-weight="bold" fill="white">!</text>
  <text x="830" y="365" font-family="'Nanum Gothic', 'Apple SD Gothic Neo', sans-serif" font-size="11" font-weight="bold" fill="#EF4444">이상치</text>

  <!-- Error lines right -->
  <line x1="575" y1="310" x2="575" y2="330" stroke="#EF4444" stroke-width="2"/>
  <line x1="635" y1="280" x2="635" y2="295" stroke="#EF4444" stroke-width="2"/>
  <line x1="675" y1="240" x2="675" y2="265" stroke="#EF4444" stroke-width="2"/>
  <line x1="735" y1="210" x2="735" y2="230" stroke="#EF4444" stroke-width="2"/>
  <!-- Big error line for outlier -->
  <line x1="795" y1="370" x2="795" y2="200" stroke="#EF4444" stroke-width="4"/>
  <text x="810" y="285" font-family="'Nanum Gothic', 'Apple SD Gothic Neo', sans-serif" font-size="12" font-weight="bold" fill="#EF4444">오차=8</text>
  <text x="810" y="300" font-family="'Nanum Gothic', 'Apple SD Gothic Neo', sans-serif" font-size="11" fill="#EF4444">제곱=64!</text>

  <!-- MSE result right -->
  <rect x="525" y="410" width="300" height="55" rx="10" fill="#FEE2E2" stroke="#EF4444" stroke-width="1.5"/>
  <text x="675" y="435" text-anchor="middle" font-family="'Nanum Gothic', 'Apple SD Gothic Neo', sans-serif" font-size="14" fill="#1E293B">오차: 1, -1, 1, -1, <tspan font-weight="bold" fill="#EF4444">8</tspan></text>
  <text x="675" y="455" text-anchor="middle" font-family="'Nanum Gothic', 'Apple SD Gothic Neo', sans-serif" font-size="16" font-weight="bold" fill="#EF4444">MSE = 13.6 (13.6배!)</text>
</svg>