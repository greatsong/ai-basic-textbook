<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500">
  <style>@import url("https://fonts.googleapis.com/css2?family=Nanum+Gothic:wght@400;700&amp;display=swap");</style>
  <defs>
    <linearGradient id="bg3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FAFBFF;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#F0F4FF;stop-opacity:1"/>
    </linearGradient>
    <filter id="sh3">
      <feDropShadow dx="1" dy="2" stdDeviation="3" flood-color="#000" flood-opacity="0.08"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="900" height="500" fill="url(#bg3)" rx="12"/>

  <!-- Title -->
  <text x="450" y="38" font-family="'Nanum Gothic', 'Apple SD Gothic Neo', sans-serif" font-size="22" font-weight="bold" fill="#1E293B" text-anchor="middle">가중치 업데이트 비교: 출력층 vs 은닉층</text>
  <text x="450" y="58" font-family="'Nanum Gothic', 'Apple SD Gothic Neo', sans-serif" font-size="13" fill="#475569" text-anchor="middle">출력에 가까운 가중치일수록 더 많이 업데이트된다</text>

  <!-- Left: w3 (output layer) -->
  <rect x="40" y="80" width="400" height="200" rx="16" fill="white" stroke="#EF4444" stroke-width="2" filter="url(#sh3)"/>
  <rect x="40" y="80" width="400" height="36" rx="16" fill="#EF4444"/>
  <rect x="40" y="100" width="400" height="16" fill="#EF4444"/>
  <text x="240" y="104" font-family="'Nanum Gothic', 'Apple SD Gothic Neo', sans-serif" font-size="15" font-weight="bold" fill="white" text-anchor="middle">출력층 가중치 w₃</text>

  <text x="80" y="145" font-family="'Nanum Gothic', 'Apple SD Gothic Neo', sans-serif" font-size="13" fill="#475569">기울기 계산:</text>
  <text x="80" y="168" font-family="'Nanum Gothic', 'Apple SD Gothic Neo', sans-serif" font-size="14" font-weight="bold" fill="#1E293B">dE/dw₃ = dE/dŷ × dŷ/dz₂ × dz₂/dw₃</text>
  <text x="80" y="192" font-family="'Nanum Gothic', 'Apple SD Gothic Neo', sans-serif" font-size="13" fill="#475569">= (−0.736) × 0.233 × 0.679</text>
  <text x="80" y="218" font-family="'Nanum Gothic', 'Apple SD Gothic Neo', sans-serif" font-size="18" font-weight="bold" fill="#EF4444">= −0.1165</text>

  <!-- Bar for w3 -->
  <rect x="300" y="148" width="120" height="24" rx="6" fill="#FEE2E2"/>
  <rect x="300" y="148" width="120" height="24" rx="6" fill="#EF4444" opacity="0.8"/>
  <text x="360" y="165" font-family="'Nanum Gothic', 'Apple SD Gothic Neo', sans-serif" font-size="11" font-weight="bold" fill="white" text-anchor="middle">큰 업데이트</text>

  <text x="240" y="260" font-family="'Nanum Gothic', 'Apple SD Gothic Neo', sans-serif" font-size="13" fill="#475569" text-anchor="middle">w₃: 0.500 → </text>
  <text x="335" y="260" font-family="'Nanum Gothic', 'Apple SD Gothic Neo', sans-serif" font-size="16" font-weight="bold" fill="#EF4444" text-anchor="middle">0.558</text>
  <text x="395" y="260" font-family="'Nanum Gothic', 'Apple SD Gothic Neo', sans-serif" font-size="12" fill="#475569" text-anchor="middle">(+0.058)</text>

  <!-- Right: w1 (hidden layer) -->
  <rect x="460" y="80" width="400" height="200" rx="16" fill="white" stroke="#4F46E5" stroke-width="2" filter="url(#sh3)"/>
  <rect x="460" y="80" width="400" height="36" rx="16" fill="#4F46E5"/>
  <rect x="460" y="100" width="400" height="16" fill="#4F46E5"/>
  <text x="660" y="104" font-family="'Nanum Gothic', 'Apple SD Gothic Neo', sans-serif" font-size="15" font-weight="bold" fill="white" text-anchor="middle">은닉층 가중치 w₁</text>

  <text x="500" y="145" font-family="'Nanum Gothic', 'Apple SD Gothic Neo', sans-serif" font-size="13" fill="#475569">기울기 계산 (연쇄법칙 5단계):</text>
  <text x="500" y="168" font-family="'Nanum Gothic', 'Apple SD Gothic Neo', sans-serif" font-size="12" font-weight="bold" fill="#1E293B">dE/dw₁ = dE/dŷ × dŷ/dz₂ × dz₂/da₁ × da₁/dz₁ × dz₁/dw₁</text>
  <text x="500" y="192" font-family="'Nanum Gothic', 'Apple SD Gothic Neo', sans-serif" font-size="13" fill="#475569">= (−0.736) × 0.233 × 0.5 × 0.218 × 1.0</text>
  <text x="500" y="218" font-family="'Nanum Gothic', 'Apple SD Gothic Neo', sans-serif" font-size="18" font-weight="bold" fill="#4F46E5">= −0.0187</text>

  <!-- Bar for w1 (smaller) -->
  <rect x="740" y="148" width="40" height="24" rx="6" fill="#E0E7FF"/>
  <rect x="740" y="148" width="40" height="24" rx="6" fill="#4F46E5" opacity="0.8"/>
  <text x="760" y="165" font-family="'Nanum Gothic', 'Apple SD Gothic Neo', sans-serif" font-size="9" font-weight="bold" fill="white" text-anchor="middle">작은</text>

  <text x="660" y="260" font-family="'Nanum Gothic', 'Apple SD Gothic Neo', sans-serif" font-size="13" fill="#475569" text-anchor="middle">w₁: 0.300 → </text>
  <text x="755" y="260" font-family="'Nanum Gothic', 'Apple SD Gothic Neo', sans-serif" font-size="16" font-weight="bold" fill="#4F46E5" text-anchor="middle">0.309</text>
  <text x="815" y="260" font-family="'Nanum Gothic', 'Apple SD Gothic Neo', sans-serif" font-size="12" fill="#475569" text-anchor="middle">(+0.009)</text>

  <!-- Visual comparison bar chart -->
  <rect x="100" y="310" width="700" height="170" rx="12" fill="white" stroke="#C7D2FE" stroke-width="1.5" filter="url(#sh3)"/>
  <text x="450" y="340" font-family="'Nanum Gothic', 'Apple SD Gothic Neo', sans-serif" font-size="15" font-weight="bold" fill="#1E293B" text-anchor="middle">업데이트 크기 비교</text>

  <!-- w3 bar -->
  <text x="160" y="380" font-family="'Nanum Gothic', 'Apple SD Gothic Neo', sans-serif" font-size="13" font-weight="bold" fill="#1E293B" text-anchor="end">w₃ (출력층)</text>
  <rect x="180" y="367" width="420" height="22" rx="6" fill="#EF4444" opacity="0.85"/>
  <text x="610" y="383" font-family="'Nanum Gothic', 'Apple SD Gothic Neo', sans-serif" font-size="12" font-weight="bold" fill="#EF4444">0.1165</text>

  <!-- w2 bar -->
  <text x="160" y="415" font-family="'Nanum Gothic', 'Apple SD Gothic Neo', sans-serif" font-size="13" font-weight="bold" fill="#1E293B" text-anchor="end">w₂ (은닉층)</text>
  <rect x="180" y="402" width="50" height="22" rx="6" fill="#818CF8" opacity="0.85"/>
  <text x="240" y="418" font-family="'Nanum Gothic', 'Apple SD Gothic Neo', sans-serif" font-size="12" font-weight="bold" fill="#818CF8">0.0094</text>

  <!-- w1 bar -->
  <text x="160" y="450" font-family="'Nanum Gothic', 'Apple SD Gothic Neo', sans-serif" font-size="13" font-weight="bold" fill="#1E293B" text-anchor="end">w₁ (은닉층)</text>
  <rect x="180" y="437" width="68" height="22" rx="6" fill="#4F46E5" opacity="0.85"/>
  <text x="258" y="453" font-family="'Nanum Gothic', 'Apple SD Gothic Neo', sans-serif" font-size="12" font-weight="bold" fill="#4F46E5">0.0187</text>

  <!-- Insight -->
  <text x="570" y="460" font-family="'Nanum Gothic', 'Apple SD Gothic Neo', sans-serif" font-size="12" fill="#475569" text-anchor="middle">출력층 가중치가 약 </text>
  <text x="700" y="460" font-family="'Nanum Gothic', 'Apple SD Gothic Neo', sans-serif" font-size="14" font-weight="bold" fill="#EF4444" text-anchor="middle">6배</text>
  <text x="745" y="460" font-family="'Nanum Gothic', 'Apple SD Gothic Neo', sans-serif" font-size="12" fill="#475569" text-anchor="middle"> 더 크게 변합니다!</text>
</svg>