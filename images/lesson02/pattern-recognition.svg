<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 320" font-family="system-ui, -apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif">
  <rect width="760" height="320" rx="16" fill="#1a1b26" opacity="0.95"/>
  <text x="380" y="30" text-anchor="middle" fill="#e2e8f0" font-size="17" font-weight="700">퍼셉트론의 패턴 인식 — 글자 X와 O 구별</text>
  <text x="380" y="50" text-anchor="middle" fill="#94a3b8" font-size="12">5×5 그리드의 밝기를 입력으로 받아, "X인가 O인가"를 출력</text>

  <!-- Letter X grid (5x5) -->
  <text x="110" y="80" text-anchor="middle" fill="#6ee7b7" font-size="14" font-weight="700">입력: 글자 "X"</text>

  <!-- X pattern: black=filled, gray=empty -->
  <!-- Row 1: X _ _ _ X -->
  <rect x="50" y="95" width="22" height="22" rx="3" fill="#6ee7b7"/>
  <rect x="75" y="95" width="22" height="22" rx="3" fill="#1e293b" stroke="#334155" stroke-width="1"/>
  <rect x="100" y="95" width="22" height="22" rx="3" fill="#1e293b" stroke="#334155" stroke-width="1"/>
  <rect x="125" y="95" width="22" height="22" rx="3" fill="#1e293b" stroke="#334155" stroke-width="1"/>
  <rect x="150" y="95" width="22" height="22" rx="3" fill="#6ee7b7"/>
  <!-- Row 2: _ X _ X _ -->
  <rect x="50" y="120" width="22" height="22" rx="3" fill="#1e293b" stroke="#334155" stroke-width="1"/>
  <rect x="75" y="120" width="22" height="22" rx="3" fill="#6ee7b7"/>
  <rect x="100" y="120" width="22" height="22" rx="3" fill="#1e293b" stroke="#334155" stroke-width="1"/>
  <rect x="125" y="120" width="22" height="22" rx="3" fill="#6ee7b7"/>
  <rect x="150" y="120" width="22" height="22" rx="3" fill="#1e293b" stroke="#334155" stroke-width="1"/>
  <!-- Row 3: _ _ X _ _ -->
  <rect x="50" y="145" width="22" height="22" rx="3" fill="#1e293b" stroke="#334155" stroke-width="1"/>
  <rect x="75" y="145" width="22" height="22" rx="3" fill="#1e293b" stroke="#334155" stroke-width="1"/>
  <rect x="100" y="145" width="22" height="22" rx="3" fill="#6ee7b7"/>
  <rect x="125" y="145" width="22" height="22" rx="3" fill="#1e293b" stroke="#334155" stroke-width="1"/>
  <rect x="150" y="145" width="22" height="22" rx="3" fill="#1e293b" stroke="#334155" stroke-width="1"/>
  <!-- Row 4: _ X _ X _ -->
  <rect x="50" y="170" width="22" height="22" rx="3" fill="#1e293b" stroke="#334155" stroke-width="1"/>
  <rect x="75" y="170" width="22" height="22" rx="3" fill="#6ee7b7"/>
  <rect x="100" y="170" width="22" height="22" rx="3" fill="#1e293b" stroke="#334155" stroke-width="1"/>
  <rect x="125" y="170" width="22" height="22" rx="3" fill="#6ee7b7"/>
  <rect x="150" y="170" width="22" height="22" rx="3" fill="#1e293b" stroke="#334155" stroke-width="1"/>
  <!-- Row 5: X _ _ _ X -->
  <rect x="50" y="195" width="22" height="22" rx="3" fill="#6ee7b7"/>
  <rect x="75" y="195" width="22" height="22" rx="3" fill="#1e293b" stroke="#334155" stroke-width="1"/>
  <rect x="100" y="195" width="22" height="22" rx="3" fill="#1e293b" stroke="#334155" stroke-width="1"/>
  <rect x="125" y="195" width="22" height="22" rx="3" fill="#1e293b" stroke="#334155" stroke-width="1"/>
  <rect x="150" y="195" width="22" height="22" rx="3" fill="#6ee7b7"/>

  <!-- Arrow -->
  <text x="210" y="165" fill="#94a3b8" font-size="28">→</text>

  <!-- Perceptron box -->
  <rect x="240" y="110" width="120" height="100" rx="12" fill="rgba(168,85,247,0.1)" stroke="#a855f7" stroke-width="2"/>
  <text x="300" y="145" text-anchor="middle" fill="#d8b4fe" font-size="14" font-weight="700">퍼셉트론</text>
  <text x="300" y="165" text-anchor="middle" fill="#94a3b8" font-size="11">25개 입력</text>
  <text x="300" y="182" text-anchor="middle" fill="#94a3b8" font-size="11">25개 가중치</text>
  <text x="300" y="199" text-anchor="middle" fill="#94a3b8" font-size="11">→ 출력 1개</text>

  <!-- Arrow -->
  <text x="390" y="165" fill="#94a3b8" font-size="28">→</text>

  <!-- Output -->
  <rect x="415" y="135" width="90" height="50" rx="10" fill="rgba(16,185,129,0.15)" stroke="#10b981" stroke-width="2"/>
  <text x="460" y="166" text-anchor="middle" fill="#6ee7b7" font-size="18" font-weight="700">"X"</text>

  <!-- Divider -->
  <line x1="530" y1="80" x2="530" y2="280" stroke="#334155" stroke-width="1" stroke-dasharray="4,4"/>

  <!-- Letter O grid (5x5) -->
  <text x="640" y="80" text-anchor="middle" fill="#93c5fd" font-size="14" font-weight="700">입력: 글자 "O"</text>

  <!-- O pattern -->
  <!-- Row 1: _ X X X _ -->
  <rect x="580" y="95" width="22" height="22" rx="3" fill="#1e293b" stroke="#334155" stroke-width="1"/>
  <rect x="605" y="95" width="22" height="22" rx="3" fill="#93c5fd"/>
  <rect x="630" y="95" width="22" height="22" rx="3" fill="#93c5fd"/>
  <rect x="655" y="95" width="22" height="22" rx="3" fill="#93c5fd"/>
  <rect x="680" y="95" width="22" height="22" rx="3" fill="#1e293b" stroke="#334155" stroke-width="1"/>
  <!-- Row 2: X _ _ _ X -->
  <rect x="580" y="120" width="22" height="22" rx="3" fill="#93c5fd"/>
  <rect x="605" y="120" width="22" height="22" rx="3" fill="#1e293b" stroke="#334155" stroke-width="1"/>
  <rect x="630" y="120" width="22" height="22" rx="3" fill="#1e293b" stroke="#334155" stroke-width="1"/>
  <rect x="655" y="120" width="22" height="22" rx="3" fill="#1e293b" stroke="#334155" stroke-width="1"/>
  <rect x="680" y="120" width="22" height="22" rx="3" fill="#93c5fd"/>
  <!-- Row 3: X _ _ _ X -->
  <rect x="580" y="145" width="22" height="22" rx="3" fill="#93c5fd"/>
  <rect x="605" y="145" width="22" height="22" rx="3" fill="#1e293b" stroke="#334155" stroke-width="1"/>
  <rect x="630" y="145" width="22" height="22" rx="3" fill="#1e293b" stroke="#334155" stroke-width="1"/>
  <rect x="655" y="145" width="22" height="22" rx="3" fill="#1e293b" stroke="#334155" stroke-width="1"/>
  <rect x="680" y="145" width="22" height="22" rx="3" fill="#93c5fd"/>
  <!-- Row 4: X _ _ _ X -->
  <rect x="580" y="170" width="22" height="22" rx="3" fill="#93c5fd"/>
  <rect x="605" y="170" width="22" height="22" rx="3" fill="#1e293b" stroke="#334155" stroke-width="1"/>
  <rect x="630" y="170" width="22" height="22" rx="3" fill="#1e293b" stroke="#334155" stroke-width="1"/>
  <rect x="655" y="170" width="22" height="22" rx="3" fill="#1e293b" stroke="#334155" stroke-width="1"/>
  <rect x="680" y="170" width="22" height="22" rx="3" fill="#93c5fd"/>
  <!-- Row 5: _ X X X _ -->
  <rect x="580" y="195" width="22" height="22" rx="3" fill="#1e293b" stroke="#334155" stroke-width="1"/>
  <rect x="605" y="195" width="22" height="22" rx="3" fill="#93c5fd"/>
  <rect x="630" y="195" width="22" height="22" rx="3" fill="#93c5fd"/>
  <rect x="655" y="195" width="22" height="22" rx="3" fill="#93c5fd"/>
  <rect x="680" y="195" width="22" height="22" rx="3" fill="#1e293b" stroke="#334155" stroke-width="1"/>

  <!-- Result annotation -->
  <rect x="70" y="245" width="620" height="55" rx="10" fill="rgba(30,41,59,0.6)"/>
  <text x="380" y="268" text-anchor="middle" fill="#cbd5e1" font-size="13" font-weight="600">실제 실험 결과 (1960년 시연)</text>
  <text x="380" y="288" text-anchor="middle" fill="#94a3b8" font-size="12">X vs O 구별: 학습 이미지 20장으로 <tspan fill="#6ee7b7" font-weight="700">100% 정확도</tspan> | E vs F 구별: 60장으로 <tspan fill="#93c5fd" font-weight="700">80% 이상</tspan></text>
</svg>