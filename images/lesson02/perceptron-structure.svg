<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 360" font-family="system-ui, -apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif">
  <rect width="760" height="360" rx="16" fill="#1a1b26" opacity="0.95"/>
  <text x="380" y="35" text-anchor="middle" fill="#e2e8f0" font-size="18" font-weight="700">퍼셉트론의 구조</text>
  <text x="380" y="57" text-anchor="middle" fill="#94a3b8" font-size="13">"직선의 위치를 결정하는 기계"</text>

  <!-- Input node 1 -->
  <circle cx="100" cy="130" r="36" fill="rgba(59,130,246,0.12)" stroke="#3b82f6" stroke-width="2.5"/>
  <text x="100" y="125" text-anchor="middle" fill="#93c5fd" font-size="24" font-weight="700">x₁</text>
  <text x="100" y="150" text-anchor="middle" fill="#64748b" font-size="12">입력 1</text>

  <!-- Input node 2 -->
  <circle cx="100" cy="260" r="36" fill="rgba(59,130,246,0.12)" stroke="#3b82f6" stroke-width="2.5"/>
  <text x="100" y="255" text-anchor="middle" fill="#93c5fd" font-size="24" font-weight="700">x₂</text>
  <text x="100" y="280" text-anchor="middle" fill="#64748b" font-size="12">입력 2</text>

  <!-- Weight arrows -->
  <line x1="138" y1="130" x2="290" y2="178" stroke="#f97316" stroke-width="3" marker-end="url(#ao)"/>
  <rect x="175" y="125" width="80" height="28" rx="6" fill="rgba(249,115,22,0.15)" stroke="#f97316" stroke-width="1"/>
  <text x="215" y="144" text-anchor="middle" fill="#fdba74" font-size="14" font-weight="700">× w₁</text>

  <line x1="138" y1="260" x2="290" y2="210" stroke="#f97316" stroke-width="3" marker-end="url(#ao)"/>
  <rect x="175" y="245" width="80" height="28" rx="6" fill="rgba(249,115,22,0.15)" stroke="#f97316" stroke-width="1"/>
  <text x="215" y="264" text-anchor="middle" fill="#fdba74" font-size="14" font-weight="700">× w₂</text>

  <text x="215" y="200" text-anchor="middle" fill="#94a3b8" font-size="12">가중치</text>

  <!-- Summation node -->
  <circle cx="330" cy="195" r="40" fill="rgba(168,85,247,0.12)" stroke="#a855f7" stroke-width="2.5"/>
  <text x="330" y="190" text-anchor="middle" fill="#d8b4fe" font-size="32" font-weight="700">Σ</text>
  <text x="330" y="215" text-anchor="middle" fill="#c4b5fd" font-size="12">합산</text>

  <!-- Bias -->
  <line x1="330" y1="300" x2="330" y2="238" stroke="#ef4444" stroke-width="2.5" stroke-dasharray="6,3" marker-end="url(#ar)"/>
  <rect x="298" y="304" width="64" height="30" rx="8" fill="rgba(239,68,68,0.15)" stroke="#ef4444" stroke-width="1.5"/>
  <text x="330" y="324" text-anchor="middle" fill="#fca5a5" font-size="15" font-weight="700">+ b</text>
  <text x="330" y="348" text-anchor="middle" fill="#94a3b8" font-size="12">편향</text>

  <!-- Arrow to activation -->
  <line x1="372" y1="195" x2="460" y2="195" stroke="#94a3b8" stroke-width="2.5" marker-end="url(#ag)"/>

  <!-- Activation function -->
  <rect x="465" y="163" width="120" height="65" rx="14" fill="rgba(16,185,129,0.12)" stroke="#10b981" stroke-width="2.5"/>
  <text x="525" y="192" text-anchor="middle" fill="#6ee7b7" font-size="18" font-weight="700">f( · )</text>
  <text x="525" y="215" text-anchor="middle" fill="#94a3b8" font-size="12">활성화함수</text>

  <!-- Arrow to output -->
  <line x1="587" y1="195" x2="650" y2="195" stroke="#94a3b8" stroke-width="2.5" marker-end="url(#ag)"/>

  <!-- Output node -->
  <circle cx="690" cy="195" r="36" fill="rgba(16,185,129,0.15)" stroke="#10b981" stroke-width="2.5"/>
  <text x="690" y="190" text-anchor="middle" fill="#6ee7b7" font-size="26" font-weight="700">y</text>
  <text x="690" y="215" text-anchor="middle" fill="#94a3b8" font-size="12">출력</text>
  <text x="690" y="248" text-anchor="middle" fill="#cbd5e1" font-size="13">0 또는 1</text>

  <defs>
    <marker id="ao" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#f97316"/>
    </marker>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#ef4444"/>
    </marker>
    <marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#94a3b8"/>
    </marker>
  </defs>
</svg>