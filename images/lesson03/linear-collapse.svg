<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 300" font-family="'Nanum Gothic', 'Apple SD Gothic Neo', sans-serif">
  <style>@import url("https://fonts.googleapis.com/css2?family=Nanum+Gothic:wght@400;700&amp;display=swap");</style>
  <rect width="760" height="300" rx="16" fill="#1a1b26" opacity="0.95"/>

  <text x="380" y="32" text-anchor="middle" fill="#e2e8f0" font-size="18" font-weight="700">활성화함수 없이 층을 쌓으면?</text>

  <!-- Left section: 2-layer network diagram -->
  <text x="145" y="62" text-anchor="middle" fill="#94a3b8" font-size="13" font-weight="600">2층 네트워크</text>

  <!-- Input nodes -->
  <circle cx="60" cy="120" r="16" fill="rgba(99,102,241,0.2)" stroke="#818cf8" stroke-width="2"/>
  <text x="60" y="125" text-anchor="middle" fill="#c7d2fe" font-size="12" font-weight="600">x</text>

  <circle cx="60" cy="200" r="16" fill="rgba(99,102,241,0.2)" stroke="#818cf8" stroke-width="2"/>
  <text x="60" y="205" text-anchor="middle" fill="#c7d2fe" font-size="12" font-weight="600">1</text>

  <!-- Hidden nodes -->
  <circle cx="145" cy="100" r="16" fill="rgba(16,185,129,0.2)" stroke="#10b981" stroke-width="2"/>
  <text x="145" y="105" text-anchor="middle" fill="#6ee7b7" font-size="10">h1</text>

  <circle cx="145" cy="160" r="16" fill="rgba(16,185,129,0.2)" stroke="#10b981" stroke-width="2"/>
  <text x="145" y="165" text-anchor="middle" fill="#6ee7b7" font-size="10">h2</text>

  <circle cx="145" cy="220" r="16" fill="rgba(16,185,129,0.2)" stroke="#10b981" stroke-width="2"/>
  <text x="145" y="225" text-anchor="middle" fill="#6ee7b7" font-size="10">b1</text>

  <!-- Output node -->
  <circle cx="230" cy="160" r="16" fill="rgba(245,158,11,0.2)" stroke="#f59e0b" stroke-width="2"/>
  <text x="230" y="165" text-anchor="middle" fill="#fcd34d" font-size="12" font-weight="600">y</text>

  <!-- Connections: input to hidden -->
  <line x1="76" y1="120" x2="129" y2="100" stroke="#818cf8" stroke-width="1.5" opacity="0.5"/>
  <line x1="76" y1="120" x2="129" y2="160" stroke="#818cf8" stroke-width="1.5" opacity="0.5"/>
  <line x1="76" y1="200" x2="129" y2="100" stroke="#818cf8" stroke-width="1.5" opacity="0.3"/>
  <line x1="76" y1="200" x2="129" y2="160" stroke="#818cf8" stroke-width="1.5" opacity="0.3"/>
  <line x1="76" y1="200" x2="129" y2="220" stroke="#818cf8" stroke-width="1.5" opacity="0.3"/>

  <!-- Connections: hidden to output -->
  <line x1="161" y1="100" x2="214" y2="160" stroke="#10b981" stroke-width="1.5" opacity="0.5"/>
  <line x1="161" y1="160" x2="214" y2="160" stroke="#10b981" stroke-width="1.5" opacity="0.5"/>
  <line x1="161" y1="220" x2="214" y2="160" stroke="#10b981" stroke-width="1.5" opacity="0.3"/>

  <!-- Layer labels -->
  <text x="60" y="248" text-anchor="middle" fill="#818cf8" font-size="10">입력층</text>
  <text x="145" y="258" text-anchor="middle" fill="#6ee7b7" font-size="10">은닉층</text>
  <text x="230" y="248" text-anchor="middle" fill="#fcd34d" font-size="10">출력층</text>

  <!-- Middle section: equals sign and formula -->
  <text x="310" y="130" text-anchor="middle" fill="#e2e8f0" font-size="28" font-weight="700">=</text>

  <!-- Math formula box -->
  <rect x="340" y="85" width="200" height="100" rx="10" fill="rgba(71,85,105,0.25)" stroke="#475569" stroke-width="1"/>

  <text x="440" y="115" text-anchor="middle" fill="#c7d2fe" font-size="13">y = W&#x2082;(W&#x2081;x + b&#x2081;) + b&#x2082;</text>

  <!-- Down arrow -->
  <text x="440" y="140" text-anchor="middle" fill="#f59e0b" font-size="18">&#x2193;</text>

  <text x="440" y="165" text-anchor="middle" fill="#fcd34d" font-size="15" font-weight="700">y = Wx + B</text>

  <text x="440" y="210" text-anchor="middle" fill="#ef4444" font-size="12" font-weight="600">곱하기와 더하기의 반복은</text>
  <text x="440" y="228" text-anchor="middle" fill="#ef4444" font-size="12" font-weight="600">결국 하나의 곱하기 + 더하기!</text>

  <!-- Right section: simple line graph -->
  <text x="640" y="62" text-anchor="middle" fill="#94a3b8" font-size="13" font-weight="600">결과: 직선 하나</text>

  <!-- Small coordinate system -->
  <line x1="580" y1="250" x2="700" y2="250" stroke="#475569" stroke-width="1.5"/>
  <line x1="580" y1="250" x2="580" y2="90" stroke="#475569" stroke-width="1.5"/>

  <!-- Straight line -->
  <line x1="590" y1="230" x2="690" y2="110" stroke="#f59e0b" stroke-width="3" stroke-linecap="round"/>

  <!-- Label on graph -->
  <text x="665" y="140" fill="#fcd34d" font-size="12" font-weight="600">y = Wx + B</text>

  <!-- Axis labels -->
  <text x="700" y="266" fill="#94a3b8" font-size="11">x</text>
  <text x="568" y="90" fill="#94a3b8" font-size="11">y</text>

  <!-- XOR impossible -->
  <text x="640" y="280" text-anchor="middle" fill="#ef4444" font-size="12" font-weight="600">XOR 분류 불가능!</text>

  <!-- Bottom note -->
  <text x="380" y="290" text-anchor="middle" fill="#64748b" font-size="11">10층을 쌓아도, 100층을 쌓아도 &#x2014; 활성화함수 없이는 직선 하나와 같습니다</text>
</svg>