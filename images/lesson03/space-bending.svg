<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 280" font-family="'Pretendard Variable', Pretendard, -apple-system, sans-serif">
  <defs>
    <linearGradient id="gridBg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="bendGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#8b5cf6" stop-opacity="0.3"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="720" height="280" rx="12" fill="url(#gridBg)"/>

  <!-- Title -->
  <text x="360" y="28" text-anchor="middle" fill="#e2e8f0" font-size="15" font-weight="600">활성화함수가 공간을 구부린다</text>

  <!-- Panel 1: Linear (no activation) -->
  <g transform="translate(20,45)">
    <rect width="210" height="210" rx="8" fill="rgba(30,41,59,0.6)" stroke="rgba(71,85,105,0.3)" stroke-width="1"/>
    <text x="105" y="20" text-anchor="middle" fill="#94a3b8" font-size="11" font-weight="500">활성화함수 없음 (직선)</text>

    <!-- Grid -->
    <g stroke="rgba(71,85,105,0.15)" stroke-width="0.5">
      <line x1="25" y1="40" x2="25" y2="200"/>
      <line x1="65" y1="40" x2="65" y2="200"/>
      <line x1="105" y1="40" x2="105" y2="200"/>
      <line x1="145" y1="40" x2="145" y2="200"/>
      <line x1="185" y1="40" x2="185" y2="200"/>
      <line x1="25" y1="40" x2="185" y2="40"/>
      <line x1="25" y1="80" x2="185" y2="80"/>
      <line x1="25" y1="120" x2="185" y2="120"/>
      <line x1="25" y1="160" x2="185" y2="160"/>
      <line x1="25" y1="200" x2="185" y2="200"/>
    </g>

    <!-- XOR data points -->
    <circle cx="65" cy="160" r="8" fill="#ef4444" opacity="0.9"/>
    <circle cx="145" cy="80" r="8" fill="#ef4444" opacity="0.9"/>
    <circle cx="65" cy="80" r="8" fill="#3b82f6" opacity="0.9"/>
    <circle cx="145" cy="160" r="8" fill="#3b82f6" opacity="0.9"/>

    <!-- Linear boundary (can't separate) -->
    <line x1="25" y1="50" x2="185" y2="190" stroke="#f59e0b" stroke-width="2" stroke-dasharray="6,3" opacity="0.7"/>

    <!-- X mark -->
    <text x="105" y="205" text-anchor="middle" fill="#ef4444" font-size="20" font-weight="700">✕</text>
    <text x="160" y="205" text-anchor="start" fill="#ef4444" font-size="9">분리 불가</text>

    <!-- Labels -->
    <text x="65" cy="175" y="178" text-anchor="middle" fill="#fff" font-size="8">(0,0)=0</text>
    <text x="145" y="98" text-anchor="middle" fill="#fff" font-size="8">(1,1)=0</text>
    <text x="65" y="98" text-anchor="middle" fill="#fff" font-size="8">(0,1)=1</text>
    <text x="145" y="178" text-anchor="middle" fill="#fff" font-size="8">(1,0)=1</text>
  </g>

  <!-- Arrow 1 -->
  <g transform="translate(240,140)">
    <text x="0" y="-8" text-anchor="middle" fill="#8b5cf6" font-size="10" font-weight="600">활성화함수</text>
    <text x="0" y="6" text-anchor="middle" fill="#8b5cf6" font-size="10" font-weight="600">적용</text>
    <polygon points="-8,14 8,14 0,24" fill="#8b5cf6" opacity="0.8"/>
    <line x1="0" y1="14" x2="0" y2="24" stroke="#8b5cf6" stroke-width="0" opacity="0"/>
  </g>

  <!-- Panel 2: Activation bends space -->
  <g transform="translate(260,45)">
    <rect width="210" height="210" rx="8" fill="url(#bendGrad)" stroke="rgba(139,92,246,0.4)" stroke-width="1"/>
    <text x="105" y="20" text-anchor="middle" fill="#c4b5fd" font-size="11" font-weight="500">공간이 구부러진다</text>

    <!-- Curved grid (bent) -->
    <g stroke="rgba(139,92,246,0.2)" stroke-width="0.5" fill="none">
      <path d="M25,40 Q65,45 105,40 Q145,35 185,40"/>
      <path d="M25,80 Q65,90 105,80 Q145,70 185,80"/>
      <path d="M25,120 Q65,140 105,120 Q145,100 185,120"/>
      <path d="M25,160 Q65,175 105,160 Q145,145 185,160"/>
      <path d="M25,200 Q65,200 105,200 Q145,200 185,200"/>
      <path d="M25,40 Q30,80 25,120 Q20,160 25,200"/>
      <path d="M65,40 Q75,80 65,120 Q55,160 65,200"/>
      <path d="M105,40 Q110,80 105,120 Q100,160 105,200"/>
      <path d="M145,40 Q140,80 145,120 Q150,160 145,200"/>
      <path d="M185,40 Q180,80 185,120 Q190,160 185,200"/>
    </g>

    <!-- Moved data points (after bending) -->
    <circle cx="65" cy="165" r="8" fill="#ef4444" opacity="0.9"/>
    <circle cx="145" cy="65" r="8" fill="#ef4444" opacity="0.9"/>
    <circle cx="75" cy="90" r="8" fill="#3b82f6" opacity="0.9"/>
    <circle cx="135" cy="170" r="8" fill="#3b82f6" opacity="0.9"/>

    <!-- Curved boundary (now separable!) -->
    <path d="M25,130 Q105,60 185,130" stroke="#10b981" stroke-width="2.5" fill="none" opacity="0.8"/>

    <text x="105" y="205" text-anchor="middle" fill="#94a3b8" font-size="9" font-style="italic">격자가 구부러지면서 데이터가 이동</text>
  </g>

  <!-- Arrow 2 -->
  <g transform="translate(480,140)">
    <text x="0" y="-8" text-anchor="middle" fill="#10b981" font-size="10" font-weight="600">구부러진</text>
    <text x="0" y="6" text-anchor="middle" fill="#10b981" font-size="10" font-weight="600">공간에서</text>
    <polygon points="-8,14 8,14 0,24" fill="#10b981" opacity="0.8"/>
  </g>

  <!-- Panel 3: Result (linearly separable) -->
  <g transform="translate(500,45)">
    <rect width="210" height="210" rx="8" fill="rgba(30,41,59,0.6)" stroke="rgba(16,185,129,0.4)" stroke-width="1"/>
    <text x="105" y="20" text-anchor="middle" fill="#6ee7b7" font-size="11" font-weight="500">직선으로 분리 가능!</text>

    <!-- Grid (back to straight) -->
    <g stroke="rgba(71,85,105,0.15)" stroke-width="0.5">
      <line x1="25" y1="40" x2="25" y2="200"/>
      <line x1="65" y1="40" x2="65" y2="200"/>
      <line x1="105" y1="40" x2="105" y2="200"/>
      <line x1="145" y1="40" x2="145" y2="200"/>
      <line x1="185" y1="40" x2="185" y2="200"/>
      <line x1="25" y1="40" x2="185" y2="40"/>
      <line x1="25" y1="80" x2="185" y2="80"/>
      <line x1="25" y1="120" x2="185" y2="120"/>
      <line x1="25" y1="160" x2="185" y2="160"/>
      <line x1="25" y1="200" x2="185" y2="200"/>
    </g>

    <!-- Transformed data - now linearly separable -->
    <circle cx="65" cy="160" r="8" fill="#ef4444" opacity="0.9"/>
    <circle cx="145" cy="160" r="8" fill="#ef4444" opacity="0.9"/>
    <circle cx="75" cy="80" r="8" fill="#3b82f6" opacity="0.9"/>
    <circle cx="135" cy="80" r="8" fill="#3b82f6" opacity="0.9"/>

    <!-- Linear boundary (now works!) -->
    <line x1="25" y1="120" x2="185" y2="120" stroke="#10b981" stroke-width="2.5" opacity="0.8"/>

    <!-- Checkmark -->
    <text x="105" y="205" text-anchor="middle" fill="#10b981" font-size="20" font-weight="700">✓</text>
    <text x="155" y="205" text-anchor="start" fill="#10b981" font-size="9">분리 성공!</text>
  </g>

  <!-- Bottom caption -->
  <text x="360" y="272" text-anchor="middle" fill="#64748b" font-size="10">활성화함수는 데이터가 놓인 공간 자체를 변형하여, 원래 직선으로 나눌 수 없던 것을 나눌 수 있게 만듭니다</text>
</svg>