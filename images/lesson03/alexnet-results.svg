<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 420" font-family="system-ui, -apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif">
  <rect width="760" height="420" rx="16" fill="#1a1b26" opacity="0.95"/>

  <text x="380" y="36" text-anchor="middle" fill="#e2e8f0" font-size="18" font-weight="700">ImageNet 대회 오류율 변화</text>
  <text x="380" y="56" text-anchor="middle" fill="#94a3b8" font-size="12">낮을수록 좋음 (Top-5 Error Rate, %)</text>

  <!-- Axes -->
  <line x1="100" y1="80" x2="100" y2="330" stroke="#475569" stroke-width="1.5"/>
  <line x1="100" y1="330" x2="700" y2="330" stroke="#475569" stroke-width="1.5"/>

  <!-- Y-axis labels and grid lines -->
  <text x="90" y="84" text-anchor="end" fill="#94a3b8" font-size="11">30%</text>
  <line x1="96" y1="80" x2="700" y2="80" stroke="#475569" stroke-width="0.5" stroke-dasharray="4,4" opacity="0.4"/>

  <text x="90" y="164" text-anchor="end" fill="#94a3b8" font-size="11">20%</text>
  <line x1="96" y1="160" x2="700" y2="160" stroke="#475569" stroke-width="0.5" stroke-dasharray="4,4" opacity="0.4"/>

  <text x="90" y="247" text-anchor="end" fill="#94a3b8" font-size="11">10%</text>
  <line x1="96" y1="243" x2="700" y2="243" stroke="#475569" stroke-width="0.5" stroke-dasharray="4,4" opacity="0.4"/>

  <text x="90" y="334" text-anchor="end" fill="#94a3b8" font-size="11">0%</text>

  <!-- Human-level line at ~5% -->
  <line x1="100" y1="288" x2="700" y2="288" stroke="#f59e0b" stroke-width="1.5" stroke-dasharray="8,4" opacity="0.7"/>
  <text x="705" y="285" fill="#fcd34d" font-size="11" font-weight="600">인간 수준 (~5%)</text>

  <!-- Gradient definitions -->
  <defs>
    <linearGradient id="bar-trad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#64748b"/>
      <stop offset="100%" stop-color="#475569"/>
    </linearGradient>
    <linearGradient id="bar-alex" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ef4444"/>
      <stop offset="100%" stop-color="#dc2626"/>
    </linearGradient>
    <linearGradient id="bar-deep" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <marker id="arrowRed" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#fca5a5"/>
    </marker>
  </defs>

  <!-- 2010: 28.2% -->
  <rect x="140" y="95" width="60" height="235" rx="4" fill="url(#bar-trad)"/>
  <text x="170" y="88" text-anchor="middle" fill="#94a3b8" font-size="13" font-weight="600">28.2%</text>
  <text x="170" y="350" text-anchor="middle" fill="#94a3b8" font-size="14" font-weight="600">2010</text>
  <text x="170" y="366" text-anchor="middle" fill="#64748b" font-size="10">전통 방법</text>

  <!-- 2011: 25.8% -->
  <rect x="240" y="115" width="60" height="215" rx="4" fill="url(#bar-trad)"/>
  <text x="270" y="108" text-anchor="middle" fill="#94a3b8" font-size="13" font-weight="600">25.8%</text>
  <text x="270" y="350" text-anchor="middle" fill="#94a3b8" font-size="14" font-weight="600">2011</text>
  <text x="270" y="366" text-anchor="middle" fill="#64748b" font-size="10">전통 방법</text>

  <!-- 2012: 16.4% - AlexNet (highlighted) -->
  <rect x="340" y="193" width="60" height="137" rx="4" fill="url(#bar-alex)" stroke="#fca5a5" stroke-width="2"/>
  <text x="370" y="186" text-anchor="middle" fill="#fca5a5" font-size="14" font-weight="700">16.4%</text>
  <text x="370" y="350" text-anchor="middle" fill="#fca5a5" font-size="14" font-weight="700">2012</text>

  <!-- AlexNet label -->
  <rect x="330" y="370" width="80" height="26" rx="6" fill="rgba(239,68,68,0.15)" stroke="#ef4444" stroke-width="1"/>
  <text x="370" y="388" text-anchor="middle" fill="#fca5a5" font-size="12" font-weight="700">AlexNet</text>

  <!-- Arrow and annotation -->
  <line x1="440" y1="220" x2="405" y2="220" stroke="#fca5a5" stroke-width="2" marker-end="url(#arrowRed)"/>
  <text x="445" y="215" fill="#fca5a5" font-size="11" font-weight="600">2위(26.2%)와</text>
  <text x="445" y="230" fill="#fca5a5" font-size="11" font-weight="600">10%p 차이!</text>

  <!-- 2013: 11.7% -->
  <rect x="440" y="232" width="60" height="98" rx="4" fill="url(#bar-deep)"/>
  <text x="470" y="225" text-anchor="middle" fill="#6ee7b7" font-size="13" font-weight="600">11.7%</text>
  <text x="470" y="350" text-anchor="middle" fill="#6ee7b7" font-size="14" font-weight="600">2013</text>
  <text x="470" y="366" text-anchor="middle" fill="#059669" font-size="10">딥러닝</text>

  <!-- 2014: 6.7% -->
  <rect x="540" y="274" width="60" height="56" rx="4" fill="url(#bar-deep)"/>
  <text x="570" y="267" text-anchor="middle" fill="#6ee7b7" font-size="13" font-weight="600">6.7%</text>
  <text x="570" y="350" text-anchor="middle" fill="#6ee7b7" font-size="14" font-weight="600">2014</text>
  <text x="570" y="366" text-anchor="middle" fill="#059669" font-size="10">딥러닝</text>

  <!-- 2015: 3.6% -->
  <rect x="640" y="300" width="60" height="30" rx="4" fill="url(#bar-deep)"/>
  <text x="670" y="293" text-anchor="middle" fill="#6ee7b7" font-size="13" font-weight="600">3.6%</text>
  <text x="670" y="350" text-anchor="middle" fill="#6ee7b7" font-size="14" font-weight="600">2015</text>
  <text x="670" y="366" text-anchor="middle" fill="#059669" font-size="10">딥러닝</text>

  <!-- Legend -->
  <rect x="140" y="400" width="12" height="12" rx="2" fill="#64748b"/>
  <text x="157" y="411" fill="#94a3b8" font-size="11">전통적 방법</text>

  <rect x="260" y="400" width="12" height="12" rx="2" fill="#ef4444"/>
  <text x="277" y="411" fill="#94a3b8" font-size="11">AlexNet (딥러닝의 시작)</text>

  <rect x="450" y="400" width="12" height="12" rx="2" fill="#10b981"/>
  <text x="467" y="411" fill="#94a3b8" font-size="11">딥러닝</text>
</svg>