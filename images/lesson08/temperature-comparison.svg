<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" font-family="'Nanum Gothic', 'Apple SD Gothic Neo', sans-serif">
  <style>@import url("https://fonts.googleapis.com/css2?family=Nanum+Gothic:wght@400;700&amp;display=swap");</style>
  <rect width="800" height="400" rx="16" fill="#1a1b26" opacity="0.95"/>

  <text x="400" y="30" text-anchor="middle" fill="#e2e8f0" font-size="18" font-weight="700">Temperature(온도)에 따른 출력 변화</text>
  <text x="400" y="50" text-anchor="middle" fill="#94a3b8" font-size="12">"오늘 점심에 나는 ___을 먹었다" → 빈칸 예측</text>

  <!-- Three columns -->
  <!-- Column 1: Low Temperature -->
  <rect x="20" y="65" width="245" height="325" rx="12" fill="rgba(16,185,129,0.04)" stroke="#10b981" stroke-width="1.5" stroke-opacity="0.5"/>

  <!-- Thermometer icon low -->
  <rect x="35" y="78" width="8" height="25" rx="4" fill="none" stroke="#10b981" stroke-width="1.5"/>
  <rect x="35" y="95" width="8" height="8" rx="4" fill="#10b981"/>
  <circle cx="39" cy="108" r="7" fill="none" stroke="#10b981" stroke-width="1.5"/>
  <circle cx="39" cy="108" r="4" fill="#10b981"/>

  <text x="55" y="95" fill="#6ee7b7" font-size="14" font-weight="700">T = 0.1 (낮음)</text>
  <text x="55" y="110" fill="#94a3b8" font-size="10">안전하지만 지루</text>

  <!-- Bar chart low temp -->
  <g transform="translate(35, 130)">
    <rect x="0" y="0" width="190" height="22" rx="4" fill="rgba(16,185,129,0.5)" stroke="#10b981" stroke-width="1"/>
    <text x="8" y="15" fill="#ecfdf5" font-size="10" font-weight="700">밥  95%</text>

    <rect x="0" y="28" width="18" height="18" rx="3" fill="rgba(16,185,129,0.15)" stroke="#10b981" stroke-width="0.5" opacity="0.5"/>
    <text x="22" y="42" fill="#94a3b8" font-size="9">김치 3%</text>

    <rect x="0" y="50" width="6" height="14" rx="2" fill="rgba(16,185,129,0.08)" opacity="0.3"/>
    <text x="10" y="61" fill="#94a3b8" font-size="8" opacity="0.5">나머지 2%</text>
  </g>

  <!-- Output example -->
  <rect x="35" y="210" width="210" height="60" rx="8" fill="rgba(16,185,129,0.08)" stroke="#10b981" stroke-width="1"/>
  <text x="140" y="228" text-anchor="middle" fill="#6ee7b7" font-size="10" font-weight="600">AI 출력 (5회 반복)</text>
  <text x="45" y="245" fill="#94a3b8" font-size="9">1. 밥  2. 밥  3. 밥  4. 밥  5. 밥</text>
  <text x="45" y="260" fill="#94a3b8" font-size="8" opacity="0.7">→ 매번 같은 답!</text>

  <!-- Usage -->
  <rect x="35" y="285" width="210" height="45" rx="8" fill="rgba(16,185,129,0.06)"/>
  <text x="140" y="302" text-anchor="middle" fill="#10b981" font-size="10" font-weight="600">적합한 용도</text>
  <text x="140" y="318" text-anchor="middle" fill="#94a3b8" font-size="10">코드 작성, 수학 문제, 번역</text>

  <!-- Student metaphor -->
  <rect x="35" y="340" width="210" height="38" rx="6" fill="rgba(16,185,129,0.1)" stroke="#10b981" stroke-width="1" stroke-dasharray="3,3"/>
  <text x="140" y="358" text-anchor="middle" fill="#6ee7b7" font-size="10">시험에서 확실한 답만 쓰는 학생</text>
  <text x="140" y="373" text-anchor="middle" fill="#94a3b8" font-size="9">안전하지만 창의성 &#x2193;</text>

  <!-- Column 2: Medium Temperature -->
  <rect x="278" y="65" width="245" height="325" rx="12" fill="rgba(129,140,248,0.04)" stroke="#818cf8" stroke-width="1.5" stroke-opacity="0.5"/>

  <!-- Thermometer icon mid -->
  <rect x="293" y="78" width="8" height="25" rx="4" fill="none" stroke="#818cf8" stroke-width="1.5"/>
  <rect x="293" y="88" width="8" height="15" rx="4" fill="#818cf8"/>
  <circle cx="297" cy="108" r="7" fill="none" stroke="#818cf8" stroke-width="1.5"/>
  <circle cx="297" cy="108" r="4" fill="#818cf8"/>

  <text x="313" y="95" fill="#a5b4fc" font-size="14" font-weight="700">T = 1.0 (보통)</text>
  <text x="313" y="110" fill="#94a3b8" font-size="10">자연스러운 균형</text>

  <!-- Bar chart mid temp -->
  <g transform="translate(293, 130)">
    <rect x="0" y="0" width="80" height="22" rx="4" fill="rgba(129,140,248,0.4)" stroke="#818cf8" stroke-width="1"/>
    <text x="8" y="15" fill="#c7d2fe" font-size="10" font-weight="600">밥  35%</text>

    <rect x="0" y="28" width="50" height="18" rx="3" fill="rgba(129,140,248,0.3)" stroke="#818cf8" stroke-width="0.8"/>
    <text x="8" y="42" fill="#c7d2fe" font-size="9">김치 20%</text>

    <rect x="0" y="50" width="35" height="18" rx="3" fill="rgba(129,140,248,0.2)" stroke="#818cf8" stroke-width="0.8" opacity="0.7"/>
    <text x="8" y="64" fill="#c7d2fe" font-size="9" opacity="0.8">라면 15%</text>

    <rect x="0" y="72" width="25" height="14" rx="3" fill="rgba(129,140,248,0.12)" opacity="0.5"/>
    <text x="30" y="83" fill="#94a3b8" font-size="8">피자 12%...</text>
  </g>

  <!-- Output example -->
  <rect x="293" y="210" width="210" height="60" rx="8" fill="rgba(129,140,248,0.08)" stroke="#818cf8" stroke-width="1"/>
  <text x="398" y="228" text-anchor="middle" fill="#a5b4fc" font-size="10" font-weight="600">AI 출력 (5회 반복)</text>
  <text x="303" y="245" fill="#94a3b8" font-size="9">1. 밥  2. 김치  3. 밥  4. 라면  5. 밥</text>
  <text x="303" y="260" fill="#94a3b8" font-size="8" opacity="0.7">→ 다양하지만 자연스러움</text>

  <!-- Usage -->
  <rect x="293" y="285" width="210" height="45" rx="8" fill="rgba(129,140,248,0.06)"/>
  <text x="398" y="302" text-anchor="middle" fill="#818cf8" font-size="10" font-weight="600">적합한 용도</text>
  <text x="398" y="318" text-anchor="middle" fill="#94a3b8" font-size="10">일반 대화, 요약, 질의응답</text>

  <!-- Student metaphor -->
  <rect x="293" y="340" width="210" height="38" rx="6" fill="rgba(129,140,248,0.1)" stroke="#818cf8" stroke-width="1" stroke-dasharray="3,3"/>
  <text x="398" y="358" text-anchor="middle" fill="#a5b4fc" font-size="10">골고루 잘하는 보통 학생</text>
  <text x="398" y="373" text-anchor="middle" fill="#94a3b8" font-size="9">안정적 + 적당한 다양성</text>

  <!-- Column 3: High Temperature -->
  <rect x="536" y="65" width="245" height="325" rx="12" fill="rgba(239,68,68,0.04)" stroke="#ef4444" stroke-width="1.5" stroke-opacity="0.5"/>

  <!-- Thermometer icon high -->
  <rect x="551" y="78" width="8" height="25" rx="4" fill="none" stroke="#ef4444" stroke-width="1.5"/>
  <rect x="551" y="78" width="8" height="25" rx="4" fill="#ef4444"/>
  <circle cx="555" cy="108" r="7" fill="none" stroke="#ef4444" stroke-width="1.5"/>
  <circle cx="555" cy="108" r="4" fill="#ef4444"/>

  <text x="571" y="95" fill="#fca5a5" font-size="14" font-weight="700">T = 2.0 (높음)</text>
  <text x="571" y="110" fill="#94a3b8" font-size="10">창의적이지만 엉뚱</text>

  <!-- Bar chart high temp -->
  <g transform="translate(551, 130)">
    <rect x="0" y="0" width="30" height="22" rx="4" fill="rgba(239,68,68,0.3)" stroke="#ef4444" stroke-width="0.8"/>
    <text x="35" y="15" fill="#fca5a5" font-size="9">밥 14%</text>

    <rect x="0" y="28" width="28" height="18" rx="3" fill="rgba(239,68,68,0.25)" stroke="#ef4444" stroke-width="0.6"/>
    <text x="33" y="42" fill="#fca5a5" font-size="9">김치 12%</text>

    <rect x="0" y="50" width="25" height="18" rx="3" fill="rgba(245,158,11,0.2)" stroke="#f59e0b" stroke-width="0.6"/>
    <text x="30" y="64" fill="#fcd34d" font-size="9">우주선 10%</text>

    <rect x="0" y="72" width="22" height="14" rx="3" fill="rgba(245,158,11,0.15)" opacity="0.6"/>
    <text x="27" y="83" fill="#94a3b8" font-size="8">행복 8%...</text>
  </g>

  <!-- Output example -->
  <rect x="551" y="210" width="210" height="60" rx="8" fill="rgba(239,68,68,0.08)" stroke="#ef4444" stroke-width="1"/>
  <text x="656" y="228" text-anchor="middle" fill="#fca5a5" font-size="10" font-weight="600">AI 출력 (5회 반복)</text>
  <text x="561" y="245" fill="#94a3b8" font-size="9">1. 행복  2. 밥  3. 우주  4. 피아노  5. 구름</text>
  <text x="561" y="260" fill="#94a3b8" font-size="8" opacity="0.7">→ 엉뚱하고 예측 불가!</text>

  <!-- Usage -->
  <rect x="551" y="285" width="210" height="45" rx="8" fill="rgba(239,68,68,0.06)"/>
  <text x="656" y="302" text-anchor="middle" fill="#ef4444" font-size="10" font-weight="600">적합한 용도</text>
  <text x="656" y="318" text-anchor="middle" fill="#94a3b8" font-size="10">시 쓰기, 브레인스토밍</text>

  <!-- Student metaphor -->
  <rect x="551" y="340" width="210" height="38" rx="6" fill="rgba(239,68,68,0.1)" stroke="#ef4444" stroke-width="1" stroke-dasharray="3,3"/>
  <text x="656" y="358" text-anchor="middle" fill="#fca5a5" font-size="10">감으로 엉뚱한 답 쓰는 학생</text>
  <text x="656" y="373" text-anchor="middle" fill="#94a3b8" font-size="9">창의적이지만 정확도 &#x2193;</text>
</svg>