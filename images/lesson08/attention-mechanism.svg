<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" font-family="'Nanum Gothic', 'Apple SD Gothic Neo', sans-serif">
  <style>@import url("https://fonts.googleapis.com/css2?family=Nanum+Gothic:wght@400;700&amp;display=swap");</style>
  <rect width="800" height="400" rx="16" fill="#1a1b26" opacity="0.95"/>

  <text x="400" y="30" text-anchor="middle" fill="#e2e8f0" font-size="18" font-weight="700">어텐션(Attention) 메커니즘</text>
  <text x="400" y="50" text-anchor="middle" fill="#94a3b8" font-size="13">"나는 프랑스에서 태어나서 ... 프랑스어를 잘합니다"</text>

  <!-- Source tokens -->
  <text x="80" y="85" text-anchor="middle" fill="#94a3b8" font-size="11" font-weight="600">입력 토큰</text>
  <rect x="30" y="95" width="80" height="32" rx="8" fill="rgba(129,140,248,0.3)" stroke="#818cf8" stroke-width="1.2"/>
  <text x="70" y="116" text-anchor="middle" fill="#c7d2fe" font-size="12">나는</text>

  <rect x="125" y="95" width="90" height="32" rx="8" fill="rgba(245,158,11,0.4)" stroke="#f59e0b" stroke-width="2"/>
  <text x="170" y="116" text-anchor="middle" fill="#fcd34d" font-size="12" font-weight="700">프랑스</text>

  <rect x="230" y="95" width="70" height="32" rx="8" fill="rgba(129,140,248,0.15)" stroke="#818cf8" stroke-width="1"/>
  <text x="265" y="116" text-anchor="middle" fill="#c7d2fe" font-size="12" opacity="0.7">에서</text>

  <rect x="315" y="95" width="90" height="32" rx="8" fill="rgba(245,158,11,0.25)" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="360" y="116" text-anchor="middle" fill="#fcd34d" font-size="12">태어나서</text>

  <rect x="420" y="95" width="50" height="32" rx="8" fill="rgba(129,140,248,0.1)" stroke="#818cf8" stroke-width="1" opacity="0.5"/>
  <text x="445" y="116" text-anchor="middle" fill="#c7d2fe" font-size="12" opacity="0.5">...</text>

  <!-- Target token (prediction) -->
  <rect x="560" y="85" width="130" height="42" rx="10" fill="rgba(16,185,129,0.25)" stroke="#10b981" stroke-width="2"/>
  <text x="625" y="101" text-anchor="middle" fill="#6ee7b7" font-size="10">예측할 단어</text>
  <text x="625" y="118" text-anchor="middle" fill="#10b981" font-size="14" font-weight="700">프랑스어를</text>

  <!-- Attention lines with varying opacity (weight) -->
  <line x1="70" y1="127" x2="590" y2="85" stroke="#818cf8" stroke-width="1" opacity="0.15"/>
  <line x1="170" y1="127" x2="595" y2="85" stroke="#f59e0b" stroke-width="3.5" opacity="0.85"/>
  <line x1="265" y1="127" x2="610" y2="85" stroke="#818cf8" stroke-width="1" opacity="0.1"/>
  <line x1="360" y1="127" x2="620" y2="85" stroke="#f59e0b" stroke-width="2.5" opacity="0.6"/>
  <line x1="445" y1="127" x2="630" y2="85" stroke="#818cf8" stroke-width="0.8" opacity="0.08"/>

  <!-- Attention weights bar chart -->
  <text x="400" y="165" text-anchor="middle" fill="#e2e8f0" font-size="14" font-weight="600">어텐션 점수 (가중치)</text>
  <text x="400" y="182" text-anchor="middle" fill="#94a3b8" font-size="11">"프랑스어를" 예측 시, 각 토큰에 부여되는 주목도</text>

  <!-- Bar chart -->
  <g transform="translate(60, 200)">
    <!-- Y axis -->
    <line x1="60" y1="0" x2="60" y2="150" stroke="#475569" stroke-width="1"/>
    <text x="55" y="5" text-anchor="end" fill="#94a3b8" font-size="9">100%</text>
    <text x="55" y="80" text-anchor="end" fill="#94a3b8" font-size="9">50%</text>
    <text x="55" y="155" text-anchor="end" fill="#94a3b8" font-size="9">0%</text>

    <!-- Bars -->
    <rect x="90" y="120" width="60" height="30" rx="4" fill="rgba(129,140,248,0.25)" stroke="#818cf8" stroke-width="1"/>
    <text x="120" y="170" text-anchor="middle" fill="#c7d2fe" font-size="11">나는</text>
    <text x="120" y="115" text-anchor="middle" fill="#818cf8" font-size="10" font-weight="600">5%</text>

    <rect x="180" y="15" width="60" height="135" rx="4" fill="rgba(245,158,11,0.5)" stroke="#f59e0b" stroke-width="2"/>
    <text x="210" y="170" text-anchor="middle" fill="#fcd34d" font-size="11" font-weight="700">프랑스</text>
    <text x="210" y="10" text-anchor="middle" fill="#f59e0b" font-size="10" font-weight="700">72%</text>

    <rect x="270" y="135" width="60" height="15" rx="4" fill="rgba(129,140,248,0.15)" stroke="#818cf8" stroke-width="1" opacity="0.6"/>
    <text x="300" y="170" text-anchor="middle" fill="#c7d2fe" font-size="11" opacity="0.7">에서</text>
    <text x="300" y="130" text-anchor="middle" fill="#818cf8" font-size="10">2%</text>

    <rect x="360" y="55" width="60" height="95" rx="4" fill="rgba(245,158,11,0.3)" stroke="#f59e0b" stroke-width="1.5"/>
    <text x="390" y="170" text-anchor="middle" fill="#fcd34d" font-size="11">태어나서</text>
    <text x="390" y="50" text-anchor="middle" fill="#f59e0b" font-size="10" font-weight="600">18%</text>

    <rect x="450" y="140" width="60" height="10" rx="4" fill="rgba(129,140,248,0.1)" stroke="#818cf8" stroke-width="1" opacity="0.4"/>
    <text x="480" y="170" text-anchor="middle" fill="#c7d2fe" font-size="11" opacity="0.5">...</text>
    <text x="480" y="135" text-anchor="middle" fill="#818cf8" font-size="10" opacity="0.5">3%</text>

    <!-- Highlight annotation -->
    <rect x="530" y="30" width="120" height="55" rx="8" fill="rgba(245,158,11,0.1)" stroke="#f59e0b" stroke-width="1" stroke-dasharray="4,3"/>
    <text x="590" y="50" text-anchor="middle" fill="#f59e0b" font-size="10" font-weight="600">핵심 단서에</text>
    <text x="590" y="65" text-anchor="middle" fill="#f59e0b" font-size="10" font-weight="600">강하게 주목!</text>
    <line x1="530" y1="57" x2="240" y2="57" stroke="#f59e0b" stroke-width="1" stroke-dasharray="3,3" opacity="0.4"/>
  </g>

  <!-- Bottom annotation -->
  <rect x="100" y="370" width="600" height="24" rx="6" fill="rgba(79,70,229,0.1)" stroke="#4f46e5" stroke-width="1" stroke-opacity="0.3"/>
  <text x="400" y="387" text-anchor="middle" fill="#a5b4fc" font-size="11">형광펜 비유: 관련 높은 단어에 진하게, 관련 없는 단어는 연하게 칠하는 것</text>
</svg>