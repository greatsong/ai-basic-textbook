<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500" font-family="system-ui, -apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif">
  <rect width="900" height="500" rx="16" fill="#1a1b26" opacity="0.95"/>

  <text x="450" y="30" text-anchor="middle" fill="#e2e8f0" font-size="18" font-weight="700">AI가 문장을 완성하는 전체 과정</text>
  <text x="450" y="50" text-anchor="middle" fill="#94a3b8" font-size="13">1~8차시 개념이 모두 연결됩니다</text>

  <defs>
    <marker id="pipeArrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#60a5fa"/>
    </marker>
    <marker id="learnArrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#ef4444"/>
    </marker>
  </defs>

  <!-- ===== INFERENCE PIPELINE (Left column) ===== -->
  <text x="310" y="75" text-anchor="middle" fill="#60a5fa" font-size="14" font-weight="700">&#x25b6; 추론 (예측) 과정</text>

  <!-- Step 0: Input -->
  <rect x="80" y="88" width="460" height="38" rx="8" fill="rgba(71,85,105,0.3)" stroke="#475569" stroke-width="1"/>
  <text x="310" y="112" text-anchor="middle" fill="#e2e8f0" font-size="13" font-weight="600">입력: "오늘 날씨가 좋아서 산책을 ___"</text>

  <!-- Arrow down -->
  <line x1="310" y1="130" x2="310" y2="148" stroke="#60a5fa" stroke-width="2" marker-end="url(#pipeArrow)"/>

  <!-- Step 1: Tokenization [7차시] -->
  <rect x="80" y="152" width="460" height="42" rx="8" fill="rgba(129,140,248,0.15)" stroke="#818cf8" stroke-width="1.5"/>
  <rect x="84" y="156" width="55" height="16" rx="4" fill="rgba(129,140,248,0.3)"/>
  <text x="111" y="168" text-anchor="middle" fill="#c7d2fe" font-size="9" font-weight="700">7차시</text>
  <text x="310" y="170" text-anchor="middle" fill="#c7d2fe" font-size="12" font-weight="600">토큰화</text>
  <text x="310" y="186" text-anchor="middle" fill="#94a3b8" font-size="10">["오늘", "날씨가", "좋아서", "산책을"]</text>

  <!-- Arrow down -->
  <line x1="310" y1="198" x2="310" y2="213" stroke="#60a5fa" stroke-width="2" marker-end="url(#pipeArrow)"/>

  <!-- Step 2: Embedding [7차시] -->
  <rect x="80" y="217" width="460" height="42" rx="8" fill="rgba(16,185,129,0.12)" stroke="#10b981" stroke-width="1.5"/>
  <rect x="84" y="221" width="55" height="16" rx="4" fill="rgba(16,185,129,0.3)"/>
  <text x="111" y="233" text-anchor="middle" fill="#6ee7b7" font-size="9" font-weight="700">7차시</text>
  <text x="310" y="235" text-anchor="middle" fill="#6ee7b7" font-size="12" font-weight="600">임베딩</text>
  <text x="310" y="251" text-anchor="middle" fill="#94a3b8" font-size="10">[[0.3, 0.1, ...], [0.5, 0.2, ...], [0.8, 0.4, ...], ...]</text>

  <!-- Arrow down -->
  <line x1="310" y1="263" x2="310" y2="278" stroke="#60a5fa" stroke-width="2" marker-end="url(#pipeArrow)"/>

  <!-- Step 3: Attention [8차시] -->
  <rect x="80" y="282" width="460" height="38" rx="8" fill="rgba(245,158,11,0.12)" stroke="#f59e0b" stroke-width="1.5"/>
  <rect x="84" y="286" width="55" height="16" rx="4" fill="rgba(245,158,11,0.3)"/>
  <text x="111" y="298" text-anchor="middle" fill="#fcd34d" font-size="9" font-weight="700">8차시</text>
  <text x="310" y="305" text-anchor="middle" fill="#fcd34d" font-size="12" font-weight="600">셀프 어텐션 &#x2192; 문맥이 반영된 벡터들</text>

  <!-- Arrow down -->
  <line x1="310" y1="324" x2="310" y2="339" stroke="#60a5fa" stroke-width="2" marker-end="url(#pipeArrow)"/>

  <!-- Step 4: Neural Network [2-3차시] -->
  <rect x="80" y="343" width="460" height="38" rx="8" fill="rgba(96,165,250,0.12)" stroke="#60a5fa" stroke-width="1.5"/>
  <rect x="84" y="347" width="65" height="16" rx="4" fill="rgba(96,165,250,0.3)"/>
  <text x="116" y="359" text-anchor="middle" fill="#93c5fd" font-size="9" font-weight="700">2-3차시</text>
  <text x="310" y="366" text-anchor="middle" fill="#93c5fd" font-size="12" font-weight="600">신경망 (피드포워드) &#x2192; 확률 분포 계산</text>

  <!-- Arrow down -->
  <line x1="310" y1="385" x2="310" y2="400" stroke="#60a5fa" stroke-width="2" marker-end="url(#pipeArrow)"/>

  <!-- Step 5: Selection [8차시] -->
  <rect x="80" y="404" width="460" height="42" rx="8" fill="rgba(245,158,11,0.15)" stroke="#f59e0b" stroke-width="1.5"/>
  <rect x="84" y="408" width="55" height="16" rx="4" fill="rgba(245,158,11,0.3)"/>
  <text x="111" y="420" text-anchor="middle" fill="#fcd34d" font-size="9" font-weight="700">8차시</text>
  <text x="310" y="424" text-anchor="middle" fill="#fcd34d" font-size="12" font-weight="600">다음 토큰 선택</text>
  <text x="310" y="440" text-anchor="middle" fill="#10b981" font-size="12" font-weight="700">"갔습니다" (확률 42%)</text>

  <!-- ===== TRAINING PIPELINE (Right column) ===== -->
  <text x="720" y="75" text-anchor="middle" fill="#ef4444" font-size="14" font-weight="700">&#x25c0; 학습 (훈련) 과정</text>

  <!-- Training step 1: Loss [4차시] -->
  <rect x="590" y="282" width="280" height="50" rx="10" fill="rgba(239,68,68,0.12)" stroke="#ef4444" stroke-width="1.5"/>
  <rect x="594" y="286" width="55" height="16" rx="4" fill="rgba(239,68,68,0.3)"/>
  <text x="621" y="298" text-anchor="middle" fill="#fca5a5" font-size="9" font-weight="700">4차시</text>
  <text x="730" y="302" text-anchor="middle" fill="#fca5a5" font-size="12" font-weight="600">손실 측정 (MSE / Cross-Entropy)</text>
  <text x="730" y="320" text-anchor="middle" fill="#94a3b8" font-size="10">예측과 정답의 차이를 숫자로</text>

  <!-- Training step 2: Backprop [6차시] -->
  <rect x="590" y="345" width="280" height="50" rx="10" fill="rgba(239,68,68,0.12)" stroke="#ef4444" stroke-width="1.5"/>
  <rect x="594" y="349" width="55" height="16" rx="4" fill="rgba(239,68,68,0.3)"/>
  <text x="621" y="361" text-anchor="middle" fill="#fca5a5" font-size="9" font-weight="700">6차시</text>
  <text x="730" y="365" text-anchor="middle" fill="#fca5a5" font-size="12" font-weight="600">역전파 (Backpropagation)</text>
  <text x="730" y="383" text-anchor="middle" fill="#94a3b8" font-size="10">오차를 각 가중치에 분배</text>

  <!-- Training step 3: Gradient Descent [5차시] -->
  <rect x="590" y="408" width="280" height="50" rx="10" fill="rgba(239,68,68,0.12)" stroke="#ef4444" stroke-width="1.5"/>
  <rect x="594" y="412" width="55" height="16" rx="4" fill="rgba(239,68,68,0.3)"/>
  <text x="621" y="424" text-anchor="middle" fill="#fca5a5" font-size="9" font-weight="700">5차시</text>
  <text x="730" y="428" text-anchor="middle" fill="#fca5a5" font-size="12" font-weight="600">경사하강법 (가중치 업데이트)</text>
  <text x="730" y="446" text-anchor="middle" fill="#94a3b8" font-size="10">손실을 줄이는 방향으로 조금씩</text>

  <!-- Red arrows connecting training steps (upward, showing flow) -->
  <line x1="730" y1="345" x2="730" y2="336" stroke="#ef4444" stroke-width="1.5" marker-end="url(#learnArrow)"/>
  <line x1="730" y1="408" x2="730" y2="399" stroke="#ef4444" stroke-width="1.5" marker-end="url(#learnArrow)"/>

  <!-- Arrow from training back to neural network (feedback loop) -->
  <path d="M 730,282 L 730,250 Q 730,240 720,240 L 545,240" stroke="#ef4444" stroke-width="1.5" fill="none" stroke-dasharray="5,3" marker-end="url(#learnArrow)"/>
  <text x="640" y="235" text-anchor="middle" fill="#ef4444" font-size="10" font-weight="600">가중치 개선</text>

  <!-- Connection from inference to training -->
  <path d="M 540,420 L 560,420 Q 575,420 575,430 L 575,433 Q 575,445 590,445 L 590,433" stroke="#ef4444" stroke-width="1.5" fill="none" stroke-dasharray="5,3"/>

  <!-- Bottom note -->
  <rect x="80" y="460" width="740" height="30" rx="8" fill="rgba(71,85,105,0.2)" stroke="#475569" stroke-width="0.5"/>
  <text x="450" y="480" text-anchor="middle" fill="#94a3b8" font-size="12">추론은 학습된 모델로 예측, 학습은 예측 오차를 줄여 모델을 개선 &#x2014; 이 순환이 AI의 핵심!</text>
</svg>