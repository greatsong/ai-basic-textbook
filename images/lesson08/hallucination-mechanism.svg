<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" font-family="'Nanum Gothic', 'Apple SD Gothic Neo', sans-serif">
  <style>@import url("https://fonts.googleapis.com/css2?family=Nanum+Gothic:wght@400;700&amp;display=swap");</style>
  <rect width="800" height="400" rx="16" fill="#1a1b26" opacity="0.95"/>

  <text x="400" y="30" text-anchor="middle" fill="#e2e8f0" font-size="18" font-weight="700">환각(Hallucination)은 왜 발생하는가?</text>
  <text x="400" y="50" text-anchor="middle" fill="#94a3b8" font-size="12">버그가 아니라 "다음 단어 예측" 구조의 필연적 결과</text>

  <!-- Divider -->
  <line x1="400" y1="65" x2="400" y2="380" stroke="#475569" stroke-width="1" stroke-dasharray="4,4" opacity="0.3"/>

  <!-- LEFT: Normal case -->
  <rect x="20" y="65" width="370" height="310" rx="12" fill="rgba(16,185,129,0.04)" stroke="#10b981" stroke-width="1" stroke-opacity="0.3"/>
  <text x="205" y="90" text-anchor="middle" fill="#6ee7b7" font-size="14" font-weight="700">정상 작동</text>
  <text x="205" y="108" text-anchor="middle" fill="#94a3b8" font-size="11">학습 데이터에 정답이 있는 경우</text>

  <!-- Question -->
  <rect x="40" y="120" width="330" height="35" rx="8" fill="rgba(129,140,248,0.15)" stroke="#818cf8" stroke-width="1"/>
  <text x="55" y="133" fill="#94a3b8" font-size="9">질문</text>
  <text x="205" y="145" text-anchor="middle" fill="#c7d2fe" font-size="12">"한국의 수도는 ___이다"</text>

  <!-- Arrow -->
  <line x1="205" y1="155" x2="205" y2="175" stroke="#818cf8" stroke-width="1.2"/>
  <polygon points="200,173 205,180 210,173" fill="#818cf8"/>

  <!-- Model -->
  <rect x="100" y="180" width="210" height="30" rx="6" fill="rgba(79,70,229,0.15)" stroke="#4f46e5" stroke-width="1"/>
  <text x="205" y="200" text-anchor="middle" fill="#a5b4fc" font-size="10">트랜스포머 (확률 계산)</text>

  <!-- Arrow -->
  <line x1="205" y1="210" x2="205" y2="230" stroke="#818cf8" stroke-width="1.2"/>
  <polygon points="200,228 205,235 210,228" fill="#818cf8"/>

  <!-- Probability bars -->
  <rect x="60" y="235" width="290" height="75" rx="8" fill="rgba(16,185,129,0.06)" stroke="#10b981" stroke-width="1" stroke-opacity="0.4"/>
  <text x="75" y="252" fill="#94a3b8" font-size="9">확률 분포</text>

  <rect x="75" y="260" width="220" height="14" rx="3" fill="rgba(16,185,129,0.5)" stroke="#10b981" stroke-width="1"/>
  <text x="80" y="272" fill="#ecfdf5" font-size="9" font-weight="600">서울  97%</text>

  <rect x="75" y="278" width="15" height="14" rx="3" fill="rgba(129,140,248,0.15)" stroke="#818cf8" stroke-width="0.5" opacity="0.4"/>
  <text x="95" y="290" fill="#94a3b8" font-size="8">부산 1.5%</text>

  <rect x="75" y="296" width="8" height="6" rx="2" fill="rgba(129,140,248,0.1)" opacity="0.3"/>
  <text x="88" y="302" fill="#94a3b8" font-size="7" opacity="0.5">기타...</text>

  <!-- Result -->
  <rect x="80" y="325" width="250" height="35" rx="8" fill="rgba(16,185,129,0.2)" stroke="#10b981" stroke-width="2"/>
  <text x="205" y="340" text-anchor="middle" fill="#6ee7b7" font-size="10">결과</text>
  <text x="205" y="355" text-anchor="middle" fill="#10b981" font-size="13" font-weight="700">"한국의 수도는 서울이다" &#x2713;</text>

  <!-- RIGHT: Hallucination case -->
  <rect x="410" y="65" width="370" height="310" rx="12" fill="rgba(239,68,68,0.04)" stroke="#ef4444" stroke-width="1" stroke-opacity="0.3"/>
  <text x="595" y="90" text-anchor="middle" fill="#fca5a5" font-size="14" font-weight="700">환각 발생</text>
  <text x="595" y="108" text-anchor="middle" fill="#94a3b8" font-size="11">학습 데이터에 정답이 없는 경우</text>

  <!-- Question -->
  <rect x="430" y="120" width="330" height="35" rx="8" fill="rgba(129,140,248,0.15)" stroke="#818cf8" stroke-width="1"/>
  <text x="445" y="133" fill="#94a3b8" font-size="9">질문</text>
  <text x="595" y="145" text-anchor="middle" fill="#c7d2fe" font-size="12">"2025년 노벨 물리학상은 ___"</text>

  <!-- Arrow -->
  <line x1="595" y1="155" x2="595" y2="175" stroke="#818cf8" stroke-width="1.2"/>
  <polygon points="590,173 595,180 600,173" fill="#818cf8"/>

  <!-- Model -->
  <rect x="490" y="180" width="210" height="30" rx="6" fill="rgba(79,70,229,0.15)" stroke="#4f46e5" stroke-width="1"/>
  <text x="595" y="200" text-anchor="middle" fill="#a5b4fc" font-size="10">트랜스포머 (확률 계산)</text>

  <!-- Arrow -->
  <line x1="595" y1="210" x2="595" y2="230" stroke="#818cf8" stroke-width="1.2"/>
  <polygon points="590,228 595,235 600,228" fill="#818cf8"/>

  <!-- Probability bars - confused -->
  <rect x="450" y="235" width="290" height="75" rx="8" fill="rgba(239,68,68,0.06)" stroke="#ef4444" stroke-width="1" stroke-opacity="0.4"/>
  <text x="465" y="252" fill="#94a3b8" font-size="9">확률 분포 (불확실)</text>

  <rect x="465" y="260" width="55" height="14" rx="3" fill="rgba(239,68,68,0.3)" stroke="#ef4444" stroke-width="0.8"/>
  <text x="470" y="272" fill="#fca5a5" font-size="8">???  12%</text>

  <rect x="465" y="278" width="48" height="14" rx="3" fill="rgba(245,158,11,0.25)" stroke="#f59e0b" stroke-width="0.8"/>
  <text x="470" y="290" fill="#fcd34d" font-size="8">???  10%</text>

  <rect x="465" y="296" width="42" height="6" rx="2" fill="rgba(129,140,248,0.15)" opacity="0.4"/>
  <text x="512" y="302" fill="#94a3b8" font-size="7" opacity="0.6">비슷비슷한 확률들...</text>

  <!-- Annotation -->
  <text x="680" y="272" fill="#ef4444" font-size="9" font-weight="600">정답이 없어도</text>
  <text x="680" y="285" fill="#ef4444" font-size="9" font-weight="600">"가장 그럴듯한"</text>
  <text x="680" y="298" fill="#ef4444" font-size="9" font-weight="600">단어를 선택!</text>

  <!-- Result -->
  <rect x="470" y="325" width="250" height="35" rx="8" fill="rgba(239,68,68,0.2)" stroke="#ef4444" stroke-width="2"/>
  <text x="595" y="340" text-anchor="middle" fill="#fca5a5" font-size="10">결과</text>
  <text x="595" y="355" text-anchor="middle" fill="#ef4444" font-size="11" font-weight="700">"... 김OO 교수가 수상" &#x2717; 거짓!</text>

  <!-- Bottom key message -->
  <rect x="120" y="380" width="560" height="18" rx="5" fill="rgba(239,68,68,0.1)" stroke="#ef4444" stroke-width="1" stroke-opacity="0.4"/>
  <text x="400" y="393" text-anchor="middle" fill="#fca5a5" font-size="10" font-weight="600">AI는 "모른다"고 말하는 대신, 항상 가장 높은 확률의 다음 단어를 이어붙인다 = 환각의 원인</text>
</svg>