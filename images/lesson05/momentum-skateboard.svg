<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 520">
  <style>@import url("https://fonts.googleapis.com/css2?family=Nanum+Gothic:wght@400;700&amp;display=swap");</style>
  <defs>
    <linearGradient id="bg2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#F8FAFC"/>
      <stop offset="100%" stop-color="#E2E8F0"/>
    </linearGradient>
    <linearGradient id="terrL" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#CBD5E1"/>
      <stop offset="100%" stop-color="#E2E8F0"/>
    </linearGradient>
    <linearGradient id="terrR" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#CBD5E1"/>
      <stop offset="100%" stop-color="#E2E8F0"/>
    </linearGradient>
    <filter id="sh2">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-opacity="0.12"/>
    </filter>
    <marker id="moveArr" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#3B82F6"/>
    </marker>
  </defs>

  <rect width="800" height="520" fill="url(#bg2)" rx="12"/>

  <!-- Title -->
  <text x="400" y="30" text-anchor="middle" font-family="'Nanum Gothic', 'Apple SD Gothic Neo', sans-serif" font-size="20" font-weight="bold" fill="#1E293B">모멘텀의 직관: 공이 언덕을 넘을 수 있을까?</text>

  <!-- ==================== LEFT SIDE ==================== -->
  <rect x="15" y="46" width="380" height="28" rx="6" fill="#FEE2E2" stroke="#EF4444" stroke-width="1.5"/>
  <text x="205" y="65" text-anchor="middle" font-family="'Nanum Gothic', 'Apple SD Gothic Neo', sans-serif" font-size="14" font-weight="bold" fill="#DC2626">모멘텀 = 0 (관성 없음)</text>

  <!-- W-shaped terrain: clear shallow valley + hill + deep valley -->
  <!-- Points: start high(30,100) → down to shallow valley(130,210) → up to hill(210,120) → down to deep valley(310,280) → up to end(380,140) -->
  <path d="M 30,100 C 50,100 80,100 100,150 C 120,200 125,210 140,210 C 155,210 160,200 175,170 C 190,140 200,120 215,120 C 230,120 240,140 255,180 C 270,220 290,280 310,280 C 330,280 350,220 375,140"
        fill="none" stroke="#64748B" stroke-width="4" stroke-linecap="round"/>
  <!-- Terrain fill -->
  <path d="M 30,100 C 50,100 80,100 100,150 C 120,200 125,210 140,210 C 155,210 160,200 175,170 C 190,140 200,120 215,120 C 230,120 240,140 255,180 C 270,220 290,280 310,280 C 330,280 350,220 375,140 L 375,310 L 30,310 Z"
        fill="url(#terrL)" opacity="0.3"/>

  <!-- Ball stuck in LOCAL minimum (shallow valley at ~140,210) -->
  <circle cx="140" cy="198" r="12" fill="#EF4444" stroke="white" stroke-width="2.5"/>
  <line x1="134" y1="192" x2="146" y2="204" stroke="white" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="146" y1="192" x2="134" y2="204" stroke="white" stroke-width="2.5" stroke-linecap="round"/>

  <!-- "Here stopped" label -->
  <rect x="75" y="155" width="130" height="26" rx="6" fill="#FEE2E2" stroke="#EF4444" stroke-width="1.5"/>
  <text x="140" y="173" text-anchor="middle" font-family="'Nanum Gothic', 'Apple SD Gothic Neo', sans-serif" font-size="12" font-weight="bold" fill="#DC2626">여기서 멈춤!</text>

  <!-- Valley labels -->
  <text x="140" y="240" text-anchor="middle" font-family="'Nanum Gothic', 'Apple SD Gothic Neo', sans-serif" font-size="11" fill="#F59E0B" font-weight="bold">로컬 미니마</text>
  <text x="140" y="254" text-anchor="middle" font-family="'Nanum Gothic', 'Apple SD Gothic Neo', sans-serif" font-size="10" fill="#F59E0B">(얕은 골짜기)</text>

  <!-- Hill label -->
  <text x="215" y="108" text-anchor="middle" font-family="'Nanum Gothic', 'Apple SD Gothic Neo', sans-serif" font-size="10" fill="#94A3B8" font-weight="bold">언덕</text>

  <!-- Global minimum label (unreachable) -->
  <text x="310" y="302" text-anchor="middle" font-family="'Nanum Gothic', 'Apple SD Gothic Neo', sans-serif" font-size="11" fill="#94A3B8">글로벌 미니마</text>
  <text x="310" y="316" text-anchor="middle" font-family="'Nanum Gothic', 'Apple SD Gothic Neo', sans-serif" font-size="10" fill="#94A3B8">(도달 못 함 😢)</text>

  <!-- Arrows showing ball can't get over hill -->
  <path d="M 152,195 Q 175,170 185,155" fill="none" stroke="#EF4444" stroke-width="2" stroke-dasharray="4,3"/>
  <text x="195" y="150" font-family="'Nanum Gothic', 'Apple SD Gothic Neo', sans-serif" font-size="9" fill="#EF4444">오르막!</text>
  <path d="M 128,195 Q 105,170 95,155" fill="none" stroke="#EF4444" stroke-width="2" stroke-dasharray="4,3"/>
  <text x="75" y="150" font-family="'Nanum Gothic', 'Apple SD Gothic Neo', sans-serif" font-size="9" fill="#EF4444">오르막!</text>

  <!-- ==================== RIGHT SIDE ==================== -->
  <rect x="415" y="46" width="380" height="28" rx="6" fill="#D1FAE5" stroke="#10B981" stroke-width="1.5"/>
  <text x="605" y="65" text-anchor="middle" font-family="'Nanum Gothic', 'Apple SD Gothic Neo', sans-serif" font-size="14" font-weight="bold" fill="#059669">모멘텀 > 0 (관성 있음)</text>

  <!-- SAME W-shaped terrain (shifted +400) -->
  <path d="M 430,100 C 450,100 480,100 500,150 C 520,200 525,210 540,210 C 555,210 560,200 575,170 C 590,140 600,120 615,120 C 630,120 640,140 655,180 C 670,220 690,280 710,280 C 730,280 750,220 775,140"
        fill="none" stroke="#64748B" stroke-width="4" stroke-linecap="round"/>
  <path d="M 430,100 C 450,100 480,100 500,150 C 520,200 525,210 540,210 C 555,210 560,200 575,170 C 590,140 600,120 615,120 C 630,120 640,140 655,180 C 670,220 690,280 710,280 C 730,280 750,220 775,140 L 775,310 L 430,310 Z"
        fill="url(#terrR)" opacity="0.3"/>

  <!-- Ghost ball positions showing trajectory -->
  <circle cx="540" cy="198" r="8" fill="#10B981" opacity="0.15" stroke="#10B981" stroke-width="1" stroke-dasharray="2,2"/>
  <circle cx="570" cy="175" r="8" fill="#10B981" opacity="0.25"/>
  <circle cx="595" cy="140" r="9" fill="#10B981" opacity="0.35"/>
  <circle cx="620" cy="125" r="9" fill="#10B981" opacity="0.5"/>
  <circle cx="650" cy="155" r="9" fill="#10B981" opacity="0.65"/>

  <!-- Ball arrives at GLOBAL minimum (deep valley at ~710,280) -->
  <circle cx="710" cy="268" r="13" fill="#10B981" stroke="white" stroke-width="2.5"/>
  <text x="710" y="273" text-anchor="middle" font-family="'Nanum Gothic', 'Apple SD Gothic Neo', sans-serif" font-size="11" fill="white" font-weight="bold">!</text>

  <!-- Momentum arrow arc over the hill -->
  <path d="M 548,190 C 570,100 640,90 660,150" fill="none" stroke="#3B82F6" stroke-width="3" marker-end="url(#moveArr)"/>

  <!-- Success label -->
  <rect x="495" y="85" width="220" height="26" rx="6" fill="#DBEAFE" stroke="#3B82F6" stroke-width="1.5"/>
  <text x="605" y="103" text-anchor="middle" font-family="'Nanum Gothic', 'Apple SD Gothic Neo', sans-serif" font-size="12" font-weight="bold" fill="#1D4ED8">관성으로 언덕을 넘어간다!</text>

  <!-- Valley labels -->
  <text x="540" y="240" text-anchor="middle" font-family="'Nanum Gothic', 'Apple SD Gothic Neo', sans-serif" font-size="11" fill="#F59E0B" font-weight="bold">로컬 미니마</text>
  <text x="540" y="254" text-anchor="middle" font-family="'Nanum Gothic', 'Apple SD Gothic Neo', sans-serif" font-size="10" fill="#F59E0B">(지나침!)</text>

  <!-- Hill label -->
  <text x="615" y="108" text-anchor="middle" font-family="'Nanum Gothic', 'Apple SD Gothic Neo', sans-serif" font-size="10" fill="#94A3B8" font-weight="bold">언덕</text>

  <!-- Global minimum label (reached!) -->
  <rect x="660" y="295" width="110" height="22" rx="4" fill="#D1FAE5" stroke="#10B981" stroke-width="1"/>
  <text x="715" y="311" text-anchor="middle" font-family="'Nanum Gothic', 'Apple SD Gothic Neo', sans-serif" font-size="11" fill="#065F46" font-weight="bold">글로벌 미니마 🎉</text>

  <!-- ==================== BOTTOM COMPARISON ==================== -->
  <rect x="15" y="340" width="380" height="165" rx="12" fill="#FEF2F2" stroke="#FECACA" stroke-width="1.5" filter="url(#sh2)"/>
  <text x="205" y="368" text-anchor="middle" font-family="'Nanum Gothic', 'Apple SD Gothic Neo', sans-serif" font-size="15" font-weight="bold" fill="#DC2626">모멘텀 없이 (일반 경사하강법)</text>
  <line x1="65" y1="378" x2="345" y2="378" stroke="#FECACA" stroke-width="1"/>
  <text x="205" y="400" text-anchor="middle" font-family="'Nanum Gothic', 'Apple SD Gothic Neo', sans-serif" font-size="12" fill="#64748B">현재 기울기만 보고 한 걸음 이동</text>
  <text x="205" y="420" text-anchor="middle" font-family="'Nanum Gothic', 'Apple SD Gothic Neo', sans-serif" font-size="12" fill="#64748B">주변이 모두 오르막이면 → 멈춤</text>
  <text x="205" y="448" text-anchor="middle" font-family="'Nanum Gothic', 'Apple SD Gothic Neo', sans-serif" font-size="12" fill="#64748B">얕은 골짜기를 벗어나지 못하고</text>
  <text x="205" y="475" text-anchor="middle" font-family="'Nanum Gothic', 'Apple SD Gothic Neo', sans-serif" font-size="15" font-weight="bold" fill="#DC2626">가짜 바닥에서 멈춤 😫</text>

  <rect x="415" y="340" width="380" height="165" rx="12" fill="#ECFDF5" stroke="#A7F3D0" stroke-width="1.5" filter="url(#sh2)"/>
  <text x="605" y="368" text-anchor="middle" font-family="'Nanum Gothic', 'Apple SD Gothic Neo', sans-serif" font-size="15" font-weight="bold" fill="#059669">모멘텀 있을 때</text>
  <line x1="465" y1="378" x2="745" y2="378" stroke="#A7F3D0" stroke-width="1"/>
  <text x="605" y="400" text-anchor="middle" font-family="'Nanum Gothic', 'Apple SD Gothic Neo', sans-serif" font-size="12" fill="#64748B">이전 방향의 관성을 기억하며 이동</text>
  <text x="605" y="420" text-anchor="middle" font-family="'Nanum Gothic', 'Apple SD Gothic Neo', sans-serif" font-size="12" fill="#64748B">오르막을 만나도 → 관성으로 넘어감</text>
  <text x="605" y="448" text-anchor="middle" font-family="'Nanum Gothic', 'Apple SD Gothic Neo', sans-serif" font-size="12" fill="#64748B">얕은 골짜기를 통과하여</text>
  <text x="605" y="475" text-anchor="middle" font-family="'Nanum Gothic', 'Apple SD Gothic Neo', sans-serif" font-size="15" font-weight="bold" fill="#059669">진짜 바닥까지 도달! 🎉</text>
</svg>