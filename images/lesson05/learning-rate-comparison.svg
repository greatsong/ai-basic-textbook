<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 300" font-family="system-ui, -apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif">
  <rect width="800" height="300" rx="16" fill="#1a1b26" opacity="0.95"/>

  <text x="400" y="30" text-anchor="middle" fill="#e2e8f0" font-size="18" font-weight="700">학습률(Learning Rate)에 따른 차이</text>

  <defs>
    <marker id="arrowBlue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#60a5fa"/>
    </marker>
    <marker id="arrowRed" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#ef4444"/>
    </marker>
    <marker id="arrowGreen" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#10b981"/>
    </marker>
  </defs>

  <!-- Panel 1: Too Small -->
  <rect x="20" y="50" width="240" height="240" rx="12" fill="rgba(239,68,68,0.08)" stroke="#ef4444" stroke-width="1" stroke-opacity="0.3"/>
  <text x="140" y="75" text-anchor="middle" fill="#fca5a5" font-size="14" font-weight="600">너무 작음 (0.001)</text>

  <!-- Parabola 1 -->
  <path d="M 50,230 Q 80,230 95,225 Q 110,220 120,200 Q 130,170 140,120 Q 145,95 150,80" stroke="#475569" stroke-width="1.5" fill="none"/>
  <path d="M 150,80 Q 155,95 160,120 Q 170,170 180,200 Q 190,220 205,225 Q 220,230 230,230" stroke="#475569" stroke-width="1.5" fill="none"/>

  <!-- Ball positions - tiny steps -->
  <circle cx="85" cy="227" r="5" fill="#ef4444"/>
  <circle cx="90" cy="226" r="4" fill="#ef4444" opacity="0.8"/>
  <circle cx="95" cy="225" r="4" fill="#ef4444" opacity="0.6"/>
  <circle cx="100" cy="223" r="3" fill="#ef4444" opacity="0.4"/>
  <line x1="85" y1="227" x2="100" y2="223" stroke="#ef4444" stroke-width="1.5" stroke-dasharray="3,2" opacity="0.5"/>

  <text x="140" y="260" text-anchor="middle" fill="#ef4444" font-size="11" font-weight="600">수렴이 너무 느림!</text>
  <text x="140" y="276" text-anchor="middle" fill="#94a3b8" font-size="10">최소점까지 도달 못 함</text>

  <!-- Panel 2: Just Right -->
  <rect x="280" y="50" width="240" height="240" rx="12" fill="rgba(16,185,129,0.08)" stroke="#10b981" stroke-width="1.5" stroke-opacity="0.5"/>
  <text x="400" y="75" text-anchor="middle" fill="#6ee7b7" font-size="14" font-weight="600">적당함 (0.1)</text>

  <!-- Parabola 2 -->
  <path d="M 310,230 Q 340,230 355,225 Q 370,220 380,200 Q 390,170 400,120 Q 405,95 410,80" stroke="#475569" stroke-width="1.5" fill="none"/>
  <path d="M 410,80 Q 415,95 420,120 Q 430,170 440,200 Q 450,220 465,225 Q 480,230 490,230" stroke="#475569" stroke-width="1.5" fill="none"/>

  <!-- Ball positions - smooth descent -->
  <circle cx="335" cy="228" r="5" fill="#10b981"/>
  <line x1="335" y1="228" x2="365" y2="220" stroke="#10b981" stroke-width="1.5" marker-end="url(#arrowGreen)" opacity="0.6"/>
  <circle cx="365" cy="220" r="4.5" fill="#10b981" opacity="0.85"/>
  <line x1="365" y1="220" x2="385" y2="205" stroke="#10b981" stroke-width="1.5" marker-end="url(#arrowGreen)" opacity="0.5"/>
  <circle cx="385" cy="205" r="4" fill="#10b981" opacity="0.7"/>
  <line x1="385" y1="205" x2="398" y2="195" stroke="#10b981" stroke-width="1.5" marker-end="url(#arrowGreen)" opacity="0.4"/>
  <circle cx="400" cy="192" r="3.5" fill="#10b981" opacity="0.6"/>

  <!-- Star at minimum -->
  <circle cx="410" cy="80" r="6" fill="#10b981" opacity="0.3"/>
  <text x="410" y="72" text-anchor="middle" fill="#6ee7b7" font-size="16">&#x2605;</text>

  <text x="400" y="260" text-anchor="middle" fill="#10b981" font-size="11" font-weight="600">안정적으로 수렴!</text>
  <text x="400" y="276" text-anchor="middle" fill="#94a3b8" font-size="10">최적의 학습 속도</text>

  <!-- Panel 3: Too Large -->
  <rect x="540" y="50" width="240" height="240" rx="12" fill="rgba(245,158,11,0.08)" stroke="#f59e0b" stroke-width="1" stroke-opacity="0.3"/>
  <text x="660" y="75" text-anchor="middle" fill="#fcd34d" font-size="14" font-weight="600">너무 큼 (2.0)</text>

  <!-- Parabola 3 -->
  <path d="M 570,230 Q 600,230 615,225 Q 630,220 640,200 Q 650,170 660,120 Q 665,95 670,80" stroke="#475569" stroke-width="1.5" fill="none"/>
  <path d="M 670,80 Q 675,95 680,120 Q 690,170 700,200 Q 710,220 725,225 Q 740,230 750,230" stroke="#475569" stroke-width="1.5" fill="none"/>

  <!-- Ball positions - oscillating/diverging -->
  <circle cx="620" cy="215" r="5" fill="#f59e0b"/>
  <line x1="620" y1="215" x2="730" y2="220" stroke="#f59e0b" stroke-width="1.5" stroke-dasharray="4,3" opacity="0.5"/>
  <circle cx="730" cy="222" r="5" fill="#f59e0b" opacity="0.8"/>
  <line x1="730" y1="222" x2="590" y2="228" stroke="#f59e0b" stroke-width="1.5" stroke-dasharray="4,3" opacity="0.4"/>
  <circle cx="590" cy="228" r="5" fill="#f59e0b" opacity="0.6"/>
  <line x1="590" y1="228" x2="745" y2="228" stroke="#f59e0b" stroke-width="1.5" stroke-dasharray="4,3" opacity="0.3"/>

  <text x="660" y="260" text-anchor="middle" fill="#f59e0b" font-size="11" font-weight="600">발산! 점점 벌어짐</text>
  <text x="660" y="276" text-anchor="middle" fill="#94a3b8" font-size="10">최소점을 뛰어넘음</text>
</svg>