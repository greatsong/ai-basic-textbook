<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500">
  <style>@import url("https://fonts.googleapis.com/css2?family=Nanum+Gothic:wght@400;700&amp;display=swap");</style>
  <defs>
    <linearGradient id="skyGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#BFDBFE"/>
      <stop offset="60%" stop-color="#E0E7FF"/>
      <stop offset="100%" stop-color="#F1F5F9"/>
    </linearGradient>
    <linearGradient id="mtGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#6B7280"/>
      <stop offset="100%" stop-color="#9CA3AF"/>
    </linearGradient>
    <linearGradient id="fogGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="white" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="white" stop-opacity="0"/>
    </linearGradient>
    <filter id="blur">
      <feGaussianBlur stdDeviation="8"/>
    </filter>
    <filter id="softShadow">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-opacity="0.15"/>
    </filter>
  </defs>

  <!-- Sky -->
  <rect width="800" height="500" fill="url(#skyGrad)"/>

  <!-- Mountains background -->
  <path d="M0,300 L120,180 L200,220 L320,130 L400,170 L480,100 L560,150 L650,120 L720,180 L800,160 L800,500 L0,500Z" fill="#94A3B8" opacity="0.5"/>
  <path d="M0,350 L100,250 L180,280 L280,200 L380,230 L460,170 L540,210 L640,180 L720,230 L800,210 L800,500 L0,500Z" fill="#6B7280" opacity="0.6"/>

  <!-- Main mountain -->
  <path d="M0,400 L150,300 L300,220 L400,160 L500,220 L650,300 L800,380 L800,500 L0,500Z" fill="url(#mtGrad)"/>

  <!-- Fog layers -->
  <ellipse cx="200" cy="300" rx="250" ry="60" fill="white" opacity="0.7" filter="url(#blur)"/>
  <ellipse cx="600" cy="280" rx="200" ry="50" fill="white" opacity="0.6" filter="url(#blur)"/>
  <ellipse cx="400" cy="250" rx="300" ry="40" fill="white" opacity="0.5" filter="url(#blur)"/>
  <ellipse cx="100" cy="350" rx="180" ry="40" fill="white" opacity="0.8" filter="url(#blur)"/>
  <ellipse cx="700" cy="340" rx="200" ry="50" fill="white" opacity="0.7" filter="url(#blur)"/>

  <!-- Person on mountain top -->
  <!-- Body -->
  <circle cx="400" cy="130" r="12" fill="#F59E0B"/>
  <!-- Head -->
  <circle cx="400" cy="112" r="10" fill="#FBBF24"/>
  <!-- Legs -->
  <line x1="396" y1="142" x2="390" y2="160" stroke="#F59E0B" stroke-width="3" stroke-linecap="round"/>
  <line x1="404" y1="142" x2="410" y2="160" stroke="#F59E0B" stroke-width="3" stroke-linecap="round"/>
  <!-- Arms -->
  <line x1="393" y1="130" x2="378" y2="122" stroke="#F59E0B" stroke-width="3" stroke-linecap="round"/>
  <line x1="407" y1="130" x2="422" y2="122" stroke="#F59E0B" stroke-width="3" stroke-linecap="round"/>

  <!-- Question marks around person -->
  <text x="360" y="100" font-family="'Nanum Gothic', 'Apple SD Gothic Neo', sans-serif" font-size="24" font-weight="bold" fill="#3B82F6" opacity="0.8">?</text>
  <text x="430" y="95" font-family="'Nanum Gothic', 'Apple SD Gothic Neo', sans-serif" font-size="20" font-weight="bold" fill="#3B82F6" opacity="0.6">?</text>
  <text x="350" y="130" font-family="'Nanum Gothic', 'Apple SD Gothic Neo', sans-serif" font-size="18" font-weight="bold" fill="#3B82F6" opacity="0.5">?</text>

  <!-- Foot sensing arrows -->
  <path d="M385,162 L370,178" stroke="#10B981" stroke-width="2.5" stroke-dasharray="4,3" marker-end="url(#footArrow)"/>
  <path d="M415,162 L430,178" stroke="#EF4444" stroke-width="2.5" stroke-dasharray="4,3"/>

  <!-- Valley marker (goal) -->
  <circle cx="650" cy="298" r="10" fill="#10B981" opacity="0.8"/>
  <text x="650" y="320" text-anchor="middle" font-family="'Nanum Gothic', 'Apple SD Gothic Neo', sans-serif" font-size="12" font-weight="bold" fill="#10B981">골짜기</text>

  <!-- Speech bubble -->
  <rect x="440" y="72" width="200" height="50" rx="10" fill="white" filter="url(#softShadow)"/>
  <polygon points="440,92 430,102 440,102" fill="white"/>
  <text x="540" y="93" text-anchor="middle" font-family="'Nanum Gothic', 'Apple SD Gothic Neo', sans-serif" font-size="13" font-weight="bold" fill="#1E293B">발밑이 기울어진 방향!</text>
  <text x="540" y="112" text-anchor="middle" font-family="'Nanum Gothic', 'Apple SD Gothic Neo', sans-serif" font-size="11" fill="#64748B">어느 쪽이 내리막일까?</text>

  <!-- Bottom label -->
  <rect x="200" y="440" width="400" height="45" rx="10" fill="white" opacity="0.9" filter="url(#softShadow)"/>
  <text x="400" y="468" text-anchor="middle" font-family="'Nanum Gothic', 'Apple SD Gothic Neo', sans-serif" font-size="15" font-weight="bold" fill="#1E293B">안개 낀 산 = 손실 지형 | 사람 = AI 모델 | 발밑 기울기 = Gradient</text>
</svg>