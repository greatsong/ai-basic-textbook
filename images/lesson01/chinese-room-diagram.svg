<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 380" font-family="'Pretendard', 'Noto Sans KR', sans-serif">
  <defs>
    <linearGradient id="room-bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="input-grad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#6366f1"/>
    </linearGradient>
    <linearGradient id="output-grad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="720" height="380" rx="16" fill="#1a1b26" opacity="0.95"/>

  <!-- Title -->
  <text x="360" y="36" text-anchor="middle" fill="#e2e8f0" font-size="18" font-weight="700">중국어 방 사고실험 (John Searle, 1980)</text>

  <!-- Outside person (Left) -->
  <text x="60" y="160" text-anchor="middle" fill="#e2e8f0" font-size="40">🧑</text>
  <text x="60" y="195" text-anchor="middle" fill="#94a3b8" font-size="13" font-weight="600">밖의 사람</text>
  <text x="60" y="215" text-anchor="middle" fill="#64748b" font-size="11">(중국어 원어민)</text>

  <!-- Input arrow -->
  <rect x="110" y="130" width="120" height="36" rx="18" fill="url(#input-grad)" opacity="0.8"/>
  <text x="170" y="148" text-anchor="middle" fill="#e2e8f0" font-size="20">你好嗎？</text>
  <text x="170" y="163" text-anchor="middle" fill="#e2e8f0" font-size="9">잘 지내?</text>
  <path d="M 230 148 L 260 148" stroke="#818cf8" stroke-width="2" marker-end="url(#arrow-blue)"/>

  <!-- The Room -->
  <rect x="265" y="60" width="240" height="260" rx="6" fill="url(#room-bg)" stroke="#475569" stroke-width="3" stroke-dasharray="8,4"/>
  <text x="385" y="82" text-anchor="middle" fill="#64748b" font-size="12" font-weight="600">밀 폐 된   방</text>

  <!-- Person inside -->
  <text x="385" y="140" text-anchor="middle" fill="#e2e8f0" font-size="44">🤷</text>
  <text x="385" y="172" text-anchor="middle" fill="#f1f5f9" font-size="13" font-weight="600">중국어를 모르는 사람</text>

  <!-- Manual -->
  <rect x="305" y="195" width="160" height="55" rx="8" fill="#312e81" opacity="0.6" stroke="#6366f1" stroke-width="1.5"/>
  <text x="385" y="215" text-anchor="middle" fill="#c7d2fe" font-size="13" font-weight="600">📖 규칙 매뉴얼</text>
  <text x="385" y="235" text-anchor="middle" fill="#a5b4fc" font-size="11">"你好 → 我很好 출력"</text>

  <!-- Input slot -->
  <rect x="261" y="133" width="8" height="30" fill="#3b82f6" rx="2"/>
  <text x="280" y="123" fill="#93c5fd" font-size="10">입력</text>

  <!-- Output slot -->
  <rect x="501" y="133" width="8" height="30" fill="#3b82f6" rx="2"/>
  <text x="490" y="123" fill="#93c5fd" font-size="10">출력</text>

  <!-- Output arrow -->
  <path d="M 510 148 L 540 148" stroke="#818cf8" stroke-width="2" marker-end="url(#arrow-blue)"/>
  <rect x="545" y="130" width="120" height="36" rx="18" fill="url(#output-grad)" opacity="0.8"/>
  <text x="605" y="148" text-anchor="middle" fill="#e2e8f0" font-size="20">我很好！</text>
  <text x="605" y="163" text-anchor="middle" fill="#e2e8f0" font-size="9">잘 지내!</text>

  <!-- Outside person (Right) -->
  <text x="680" y="160" text-anchor="middle" fill="#e2e8f0" font-size="22">😲</text>
  <text x="680" y="185" text-anchor="middle" fill="#94a3b8" font-size="11">"중국어를</text>
  <text x="680" y="200" text-anchor="middle" fill="#94a3b8" font-size="11">잘하네!"</text>

  <!-- Key question at bottom -->
  <rect x="120" y="335" width="480" height="36" rx="18" fill="#dc2626" opacity="0.15" stroke="#ef4444" stroke-width="1.5"/>
  <text x="360" y="358" text-anchor="middle" fill="#fca5a5" font-size="14" font-weight="700">❓ 이 사람은 중국어를 "이해"하는 걸까?</text>

  <defs>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#818cf8"/>
    </marker>
  </defs>
</svg>