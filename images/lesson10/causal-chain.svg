<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500">
  <style>@import url("https://fonts.googleapis.com/css2?family=Nanum+Gothic:wght@400;700&amp;display=swap");</style>
  <defs>
    <linearGradient id="bg2" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#FAFBFF;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#F0F4FF;stop-opacity:1" />
    </linearGradient>
    <filter id="sh2">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#000" flood-opacity="0.1"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4F46E5"/>
    </marker>
    <marker id="arrowRed" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#EF4444"/>
    </marker>
  </defs>
  <rect width="900" height="500" fill="url(#bg2)" rx="12"/>
  <text x="450" y="40" text-anchor="middle" font-family="'Nanum Gothic', 'Apple SD Gothic Neo', sans-serif" font-size="20" font-weight="bold" fill="#1E293B">인과관계의 사슬: 한계가 다음 연구의 시작</text>

  <!-- Row 1: Perceptron -> XOR limit -->
  <rect x="30" y="70" width="160" height="80" rx="10" fill="#4F46E5" filter="url(#sh2)"/>
  <text x="110" y="96" text-anchor="middle" font-family="'Nanum Gothic', 'Apple SD Gothic Neo', sans-serif" font-size="13" font-weight="bold" fill="#FFF">퍼셉트론 (1958)</text>
  <text x="110" y="115" text-anchor="middle" font-family="'Nanum Gothic', 'Apple SD Gothic Neo', sans-serif" font-size="10" fill="#C7D2FE">기계가 학습할 수 있다!</text>
  <text x="110" y="135" text-anchor="middle" font-family="'Nanum Gothic', 'Apple SD Gothic Neo', sans-serif" font-size="9" fill="#C7D2FE">직선 하나로 분류</text>

  <!-- Arrow + limit label -->
  <line x1="190" y1="110" x2="240" y2="110" stroke="#EF4444" stroke-width="2" marker-end="url(#arrowRed)"/>
  <rect x="198" y="84" width="35" height="16" rx="3" fill="#FEE2E2"/>
  <text x="215" y="95" text-anchor="middle" font-family="'Nanum Gothic', 'Apple SD Gothic Neo', sans-serif" font-size="8" font-weight="bold" fill="#EF4444">한계</text>

  <rect x="248" y="70" width="160" height="80" rx="10" fill="#EF4444" filter="url(#sh2)"/>
  <text x="328" y="96" text-anchor="middle" font-family="'Nanum Gothic', 'Apple SD Gothic Neo', sans-serif" font-size="13" font-weight="bold" fill="#FFF">XOR 한계 (1969)</text>
  <text x="328" y="115" text-anchor="middle" font-family="'Nanum Gothic', 'Apple SD Gothic Neo', sans-serif" font-size="10" fill="#FECACA">직선으로 못 푸는 문제!</text>
  <text x="328" y="135" text-anchor="middle" font-family="'Nanum Gothic', 'Apple SD Gothic Neo', sans-serif" font-size="9" fill="#FECACA">AI 겨울 ~20년</text>

  <line x1="408" y1="110" x2="458" y2="110" stroke="#4F46E5" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="416" y="84" width="35" height="16" rx="3" fill="#D1FAE5"/>
  <text x="433" y="95" text-anchor="middle" font-family="'Nanum Gothic', 'Apple SD Gothic Neo', sans-serif" font-size="8" font-weight="bold" fill="#10B981">해결</text>

  <rect x="466" y="70" width="160" height="80" rx="10" fill="#10B981" filter="url(#sh2)"/>
  <text x="546" y="96" text-anchor="middle" font-family="'Nanum Gothic', 'Apple SD Gothic Neo', sans-serif" font-size="13" font-weight="bold" fill="#FFF">역전파 (1986)</text>
  <text x="546" y="115" text-anchor="middle" font-family="'Nanum Gothic', 'Apple SD Gothic Neo', sans-serif" font-size="10" fill="#D1FAE5">다층을 자동 학습!</text>
  <text x="546" y="135" text-anchor="middle" font-family="'Nanum Gothic', 'Apple SD Gothic Neo', sans-serif" font-size="9" fill="#D1FAE5">연쇄법칙으로 해결</text>

  <line x1="626" y1="110" x2="676" y2="110" stroke="#EF4444" stroke-width="2" marker-end="url(#arrowRed)"/>
  <rect x="634" y="84" width="35" height="16" rx="3" fill="#FEE2E2"/>
  <text x="651" y="95" text-anchor="middle" font-family="'Nanum Gothic', 'Apple SD Gothic Neo', sans-serif" font-size="8" font-weight="bold" fill="#EF4444">한계</text>

  <rect x="684" y="70" width="190" height="80" rx="10" fill="#F59E0B" filter="url(#sh2)"/>
  <text x="779" y="96" text-anchor="middle" font-family="'Nanum Gothic', 'Apple SD Gothic Neo', sans-serif" font-size="13" font-weight="bold" fill="#FFF">기울기 소실 + 느린 연산</text>
  <text x="779" y="115" text-anchor="middle" font-family="'Nanum Gothic', 'Apple SD Gothic Neo', sans-serif" font-size="10" fill="#FEF3C7">깊은 층에서 학습 불가</text>
  <text x="779" y="135" text-anchor="middle" font-family="'Nanum Gothic', 'Apple SD Gothic Neo', sans-serif" font-size="9" fill="#FEF3C7">컴퓨터 성능 부족</text>

  <!-- Connector down -->
  <path d="M 779 150 L 779 180 L 110 180 L 110 200" stroke="#4F46E5" stroke-width="2" fill="none" marker-end="url(#arrow)" stroke-dasharray="6,3"/>

  <!-- Row 2 -->
  <rect x="30" y="208" width="160" height="80" rx="10" fill="#F59E0B" filter="url(#sh2)"/>
  <text x="110" y="234" text-anchor="middle" font-family="'Nanum Gothic', 'Apple SD Gothic Neo', sans-serif" font-size="13" font-weight="bold" fill="#FFF">AlexNet (2012)</text>
  <text x="110" y="253" text-anchor="middle" font-family="'Nanum Gothic', 'Apple SD Gothic Neo', sans-serif" font-size="10" fill="#FEF3C7">ReLU + GPU = 딥러닝 부활</text>
  <text x="110" y="273" text-anchor="middle" font-family="'Nanum Gothic', 'Apple SD Gothic Neo', sans-serif" font-size="9" fill="#FEF3C7">이미지 인식 혁명</text>

  <line x1="190" y1="248" x2="240" y2="248" stroke="#EF4444" stroke-width="2" marker-end="url(#arrowRed)"/>
  <rect x="198" y="222" width="35" height="16" rx="3" fill="#FEE2E2"/>
  <text x="215" y="233" text-anchor="middle" font-family="'Nanum Gothic', 'Apple SD Gothic Neo', sans-serif" font-size="8" font-weight="bold" fill="#EF4444">한계</text>

  <rect x="248" y="208" width="160" height="80" rx="10" fill="#8B5CF6" filter="url(#sh2)"/>
  <text x="328" y="234" text-anchor="middle" font-family="'Nanum Gothic', 'Apple SD Gothic Neo', sans-serif" font-size="13" font-weight="bold" fill="#FFF">Word2Vec (2013)</text>
  <text x="328" y="253" text-anchor="middle" font-family="'Nanum Gothic', 'Apple SD Gothic Neo', sans-serif" font-size="10" fill="#E9D5FF">단어를 숫자로 변환!</text>
  <text x="328" y="273" text-anchor="middle" font-family="'Nanum Gothic', 'Apple SD Gothic Neo', sans-serif" font-size="9" fill="#E9D5FF">의미를 벡터로 표현</text>

  <line x1="408" y1="248" x2="458" y2="248" stroke="#EF4444" stroke-width="2" marker-end="url(#arrowRed)"/>
  <rect x="416" y="222" width="35" height="16" rx="3" fill="#FEE2E2"/>
  <text x="433" y="233" text-anchor="middle" font-family="'Nanum Gothic', 'Apple SD Gothic Neo', sans-serif" font-size="8" font-weight="bold" fill="#EF4444">한계</text>

  <rect x="466" y="208" width="160" height="80" rx="10" fill="#4F46E5" filter="url(#sh2)"/>
  <text x="546" y="234" text-anchor="middle" font-family="'Nanum Gothic', 'Apple SD Gothic Neo', sans-serif" font-size="13" font-weight="bold" fill="#FFF">트랜스포머 (2017)</text>
  <text x="546" y="253" text-anchor="middle" font-family="'Nanum Gothic', 'Apple SD Gothic Neo', sans-serif" font-size="10" fill="#C7D2FE">어텐션으로 문맥 파악!</text>
  <text x="546" y="273" text-anchor="middle" font-family="'Nanum Gothic', 'Apple SD Gothic Neo', sans-serif" font-size="9" fill="#C7D2FE">같은 단어, 다른 의미</text>

  <line x1="626" y1="248" x2="676" y2="248" stroke="#4F46E5" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="634" y="222" width="35" height="16" rx="3" fill="#E0E7FF"/>
  <text x="651" y="233" text-anchor="middle" font-family="'Nanum Gothic', 'Apple SD Gothic Neo', sans-serif" font-size="8" font-weight="bold" fill="#4F46E5">확장</text>

  <rect x="684" y="208" width="190" height="80" rx="10" fill="#3730A3" filter="url(#sh2)" stroke="#818CF8" stroke-width="2"/>
  <text x="779" y="234" text-anchor="middle" font-family="'Nanum Gothic', 'Apple SD Gothic Neo', sans-serif" font-size="14" font-weight="bold" fill="#FFF">ChatGPT (2022)</text>
  <text x="779" y="253" text-anchor="middle" font-family="'Nanum Gothic', 'Apple SD Gothic Neo', sans-serif" font-size="10" fill="#C7D2FE">1750억 파라미터</text>
  <text x="779" y="273" text-anchor="middle" font-family="'Nanum Gothic', 'Apple SD Gothic Neo', sans-serif" font-size="9" fill="#C7D2FE">생성형 AI 시대 개막</text>

  <!-- Key insight box -->
  <rect x="100" y="330" width="700" height="80" rx="12" fill="#FFF" filter="url(#sh2)" stroke="#4F46E5" stroke-width="2"/>
  <text x="450" y="360" text-anchor="middle" font-family="'Nanum Gothic', 'Apple SD Gothic Neo', sans-serif" font-size="15" font-weight="bold" fill="#3730A3">핵심 패턴: 돌파 --> 새로운 한계 발견 --> 한계를 해결하는 새 연구</text>
  <text x="450" y="385" text-anchor="middle" font-family="'Nanum Gothic', 'Apple SD Gothic Neo', sans-serif" font-size="12" fill="#475569">모든 성공에는 해결한 문제와 새로 드러난 한계가 함께 있습니다. 이것이 과학의 발전 방식입니다.</text>

  <!-- Bottom label -->
  <rect x="250" y="440" width="400" height="36" rx="18" fill="#E0E7FF"/>
  <text x="450" y="463" text-anchor="middle" font-family="'Nanum Gothic', 'Apple SD Gothic Neo', sans-serif" font-size="13" font-weight="bold" fill="#4F46E5">가우스(1801) ~ ChatGPT(2022): 220년의 인과관계</text>
</svg>