<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500">
  <style>@import url("https://fonts.googleapis.com/css2?family=Nanum+Gothic:wght@400;700&amp;display=swap");</style>
  <defs>
    <linearGradient id="bg5" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FAFBFF;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#E0E7FF;stop-opacity:1" />
    </linearGradient>
    <filter id="sh5">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#000" flood-opacity="0.1"/>
    </filter>
    <marker id="arr5" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4F46E5"/>
    </marker>
  </defs>
  <rect width="900" height="500" fill="url(#bg5)" rx="12"/>
  <text x="450" y="40" text-anchor="middle" font-family="'Nanum Gothic', 'Apple SD Gothic Neo', sans-serif" font-size="20" font-weight="bold" fill="#1E293B">트랜스포머: 왜 혁명적이었나?</text>

  <!-- LEFT: RNN (Before) -->
  <rect x="30" y="65" width="380" height="210" rx="12" fill="#FFF" filter="url(#sh5)"/>
  <rect x="30" y="65" width="380" height="35" rx="12" fill="#94A3B8"/>
  <rect x="30" y="88" width="380" height="12" fill="#94A3B8"/>
  <text x="220" y="88" text-anchor="middle" font-family="'Nanum Gothic', 'Apple SD Gothic Neo', sans-serif" font-size="13" font-weight="bold" fill="#FFF">이전: RNN (순환 신경망)</text>

  <!-- Sequential processing -->
  <rect x="55" y="115" width="50" height="35" rx="6" fill="#E0E7FF"/>
  <text x="80" y="136" text-anchor="middle" font-family="'Nanum Gothic', 'Apple SD Gothic Neo', sans-serif" font-size="10" fill="#4F46E5">나는</text>
  <path d="M 105 132 L 125 132" stroke="#94A3B8" stroke-width="2" marker-end="url(#arr5)"/>

  <rect x="130" y="115" width="50" height="35" rx="6" fill="#E0E7FF"/>
  <text x="155" y="136" text-anchor="middle" font-family="'Nanum Gothic', 'Apple SD Gothic Neo', sans-serif" font-size="10" fill="#4F46E5">학교에</text>
  <path d="M 180 132 L 200 132" stroke="#94A3B8" stroke-width="2" marker-end="url(#arr5)"/>

  <rect x="205" y="115" width="50" height="35" rx="6" fill="#E0E7FF"/>
  <text x="230" y="136" text-anchor="middle" font-family="'Nanum Gothic', 'Apple SD Gothic Neo', sans-serif" font-size="10" fill="#4F46E5">가서</text>
  <path d="M 255 132 L 275 132" stroke="#94A3B8" stroke-width="2" marker-end="url(#arr5)"/>

  <rect x="280" y="115" width="50" height="35" rx="6" fill="#E0E7FF"/>
  <text x="305" y="136" text-anchor="middle" font-family="'Nanum Gothic', 'Apple SD Gothic Neo', sans-serif" font-size="10" fill="#4F46E5">공부</text>
  <path d="M 330 132 L 350 132" stroke="#94A3B8" stroke-width="2" marker-end="url(#arr5)"/>

  <rect x="355" y="115" width="40" height="35" rx="6" fill="#C7D2FE"/>
  <text x="375" y="136" text-anchor="middle" font-family="'Nanum Gothic', 'Apple SD Gothic Neo', sans-serif" font-size="10" fill="#3730A3">...</text>

  <!-- Problem explanation -->
  <text x="220" y="175" text-anchor="middle" font-family="'Nanum Gothic', 'Apple SD Gothic Neo', sans-serif" font-size="11" fill="#EF4444" font-weight="bold">문제: 한 단어씩 순서대로 읽음</text>
  <rect x="55" y="185" width="340" height="75" rx="8" fill="#FEE2E2"/>
  <text x="225" y="205" text-anchor="middle" font-family="'Nanum Gothic', 'Apple SD Gothic Neo', sans-serif" font-size="10" fill="#EF4444">1. 앞 단어가 끝나야 다음 진행 (느림)</text>
  <text x="225" y="222" text-anchor="middle" font-family="'Nanum Gothic', 'Apple SD Gothic Neo', sans-serif" font-size="10" fill="#EF4444">2. 문장이 길면 앞부분을 잊어버림</text>
  <text x="225" y="240" text-anchor="middle" font-family="'Nanum Gothic', 'Apple SD Gothic Neo', sans-serif" font-size="10" fill="#EF4444">3. 같은 "은행"이라도 구분 어려움</text>

  <!-- RIGHT: Transformer (After) -->
  <rect x="440" y="65" width="430" height="210" rx="12" fill="#FFF" filter="url(#sh5)" stroke="#4F46E5" stroke-width="2"/>
  <rect x="440" y="65" width="430" height="35" rx="12" fill="#4F46E5"/>
  <rect x="440" y="88" width="430" height="12" fill="#4F46E5"/>
  <text x="655" y="88" text-anchor="middle" font-family="'Nanum Gothic', 'Apple SD Gothic Neo', sans-serif" font-size="13" font-weight="bold" fill="#FFF">이후: 트랜스포머 (2017)</text>

  <!-- Parallel processing with attention lines -->
  <rect x="465" y="115" width="50" height="35" rx="6" fill="#E0E7FF"/>
  <text x="490" y="136" text-anchor="middle" font-family="'Nanum Gothic', 'Apple SD Gothic Neo', sans-serif" font-size="10" fill="#4F46E5">나는</text>

  <rect x="530" y="115" width="55" height="35" rx="6" fill="#E0E7FF"/>
  <text x="557" y="136" text-anchor="middle" font-family="'Nanum Gothic', 'Apple SD Gothic Neo', sans-serif" font-size="10" fill="#4F46E5">학교에</text>

  <rect x="600" y="115" width="50" height="35" rx="6" fill="#E0E7FF"/>
  <text x="625" y="136" text-anchor="middle" font-family="'Nanum Gothic', 'Apple SD Gothic Neo', sans-serif" font-size="10" fill="#4F46E5">가서</text>

  <rect x="665" y="115" width="50" height="35" rx="6" fill="#E0E7FF"/>
  <text x="690" y="136" text-anchor="middle" font-family="'Nanum Gothic', 'Apple SD Gothic Neo', sans-serif" font-size="10" fill="#4F46E5">공부</text>

  <rect x="730" y="115" width="55" height="35" rx="6" fill="#E0E7FF"/>
  <text x="757" y="136" text-anchor="middle" font-family="'Nanum Gothic', 'Apple SD Gothic Neo', sans-serif" font-size="10" fill="#4F46E5">했다</text>

  <!-- Attention lines (all connect to all) -->
  <line x1="490" y1="150" x2="557" y2="150" stroke="#818CF8" stroke-width="1" opacity="0.3"/>
  <line x1="490" y1="150" x2="625" y2="150" stroke="#818CF8" stroke-width="1" opacity="0.3"/>
  <line x1="490" y1="150" x2="690" y2="150" stroke="#818CF8" stroke-width="2" opacity="0.7"/>
  <line x1="490" y1="150" x2="757" y2="150" stroke="#818CF8" stroke-width="1" opacity="0.3"/>
  <line x1="557" y1="150" x2="625" y2="150" stroke="#818CF8" stroke-width="2" opacity="0.7"/>
  <line x1="557" y1="150" x2="690" y2="150" stroke="#818CF8" stroke-width="1" opacity="0.5"/>

  <!-- Highlight box -->
  <text x="655" y="175" text-anchor="middle" font-family="'Nanum Gothic', 'Apple SD Gothic Neo', sans-serif" font-size="11" fill="#4F46E5" font-weight="bold">해결: 모든 단어를 한 번에 봄</text>
  <rect x="465" y="185" width="390" height="75" rx="8" fill="#E0E7FF"/>
  <text x="660" y="205" text-anchor="middle" font-family="'Nanum Gothic', 'Apple SD Gothic Neo', sans-serif" font-size="10" fill="#3730A3">1. 모든 단어를 동시에 처리 (빠름)</text>
  <text x="660" y="222" text-anchor="middle" font-family="'Nanum Gothic', 'Apple SD Gothic Neo', sans-serif" font-size="10" fill="#3730A3">2. 어텐션으로 어디를 집중할지 학습</text>
  <text x="660" y="240" text-anchor="middle" font-family="'Nanum Gothic', 'Apple SD Gothic Neo', sans-serif" font-size="10" fill="#3730A3">3. "은행"의 의미를 문맥으로 구별</text>

  <!-- Attention visualization -->
  <rect x="50" y="300" width="800" height="170" rx="12" fill="#FFF" filter="url(#sh5)"/>
  <text x="450" y="325" text-anchor="middle" font-family="'Nanum Gothic', 'Apple SD Gothic Neo', sans-serif" font-size="14" font-weight="bold" fill="#3730A3">어텐션(Attention) = "형광펜 칠하기"</text>

  <!-- Example sentence -->
  <text x="80" y="365" font-family="'Nanum Gothic', 'Apple SD Gothic Neo', sans-serif" font-size="12" fill="#475569">문장:</text>

  <rect x="130" y="348" width="40" height="28" rx="4" fill="#E0E7FF"/>
  <text x="150" y="366" text-anchor="middle" font-family="'Nanum Gothic', 'Apple SD Gothic Neo', sans-serif" font-size="11" fill="#4F46E5">나는</text>

  <rect x="180" y="348" width="75" height="28" rx="4" fill="#FEF3C7" stroke="#F59E0B" stroke-width="2"/>
  <text x="217" y="366" text-anchor="middle" font-family="'Nanum Gothic', 'Apple SD Gothic Neo', sans-serif" font-size="11" font-weight="bold" fill="#F59E0B">은행에서</text>

  <rect x="265" y="348" width="55" height="28" rx="4" fill="#E0E7FF"/>
  <text x="292" y="366" text-anchor="middle" font-family="'Nanum Gothic', 'Apple SD Gothic Neo', sans-serif" font-size="11" fill="#4F46E5">돈을</text>

  <rect x="330" y="348" width="65" height="28" rx="4" fill="#D1FAE5" stroke="#10B981" stroke-width="2"/>
  <text x="362" y="366" text-anchor="middle" font-family="'Nanum Gothic', 'Apple SD Gothic Neo', sans-serif" font-size="11" font-weight="bold" fill="#10B981">인출했다</text>

  <text x="430" y="366" font-family="'Nanum Gothic', 'Apple SD Gothic Neo', sans-serif" font-size="14" fill="#475569">--></text>

  <rect x="460" y="348" width="120" height="28" rx="4" fill="#FEF3C7" stroke="#F59E0B" stroke-width="2"/>
  <text x="520" y="366" text-anchor="middle" font-family="'Nanum Gothic', 'Apple SD Gothic Neo', sans-serif" font-size="11" font-weight="bold" fill="#F59E0B">"은행" = 금융기관</text>

  <!-- Second example -->
  <rect x="130" y="395" width="40" height="28" rx="4" fill="#E0E7FF"/>
  <text x="150" y="413" text-anchor="middle" font-family="'Nanum Gothic', 'Apple SD Gothic Neo', sans-serif" font-size="11" fill="#4F46E5">강</text>

  <rect x="180" y="395" width="75" height="28" rx="4" fill="#FEF3C7" stroke="#F59E0B" stroke-width="2"/>
  <text x="217" y="413" text-anchor="middle" font-family="'Nanum Gothic', 'Apple SD Gothic Neo', sans-serif" font-size="11" font-weight="bold" fill="#F59E0B">은행에서</text>

  <rect x="265" y="395" width="55" height="28" rx="4" fill="#E0E7FF"/>
  <text x="292" y="413" text-anchor="middle" font-family="'Nanum Gothic', 'Apple SD Gothic Neo', sans-serif" font-size="11" fill="#4F46E5">물고기</text>

  <rect x="330" y="395" width="55" height="28" rx="4" fill="#E9D5FF" stroke="#8B5CF6" stroke-width="2"/>
  <text x="357" y="413" text-anchor="middle" font-family="'Nanum Gothic', 'Apple SD Gothic Neo', sans-serif" font-size="11" font-weight="bold" fill="#8B5CF6">낚시</text>

  <text x="417" y="413" font-family="'Nanum Gothic', 'Apple SD Gothic Neo', sans-serif" font-size="14" fill="#475569">--></text>

  <rect x="440" y="395" width="140" height="28" rx="4" fill="#FEF3C7" stroke="#F59E0B" stroke-width="2"/>
  <text x="510" y="413" text-anchor="middle" font-family="'Nanum Gothic', 'Apple SD Gothic Neo', sans-serif" font-size="11" font-weight="bold" fill="#F59E0B">"은행" = 강가 둑</text>

  <!-- Insight -->
  <rect x="620" y="385" width="210" height="50" rx="8" fill="#3730A3"/>
  <text x="725" y="405" text-anchor="middle" font-family="'Nanum Gothic', 'Apple SD Gothic Neo', sans-serif" font-size="11" font-weight="bold" fill="#FFF">주변 단어를 보고</text>
  <text x="725" y="422" text-anchor="middle" font-family="'Nanum Gothic', 'Apple SD Gothic Neo', sans-serif" font-size="11" font-weight="bold" fill="#C7D2FE">의미를 자동 구별!</text>
</svg>